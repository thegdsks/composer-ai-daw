# Nothing in this catalogue is bundled in the repository. Packs are fetched by the user with sounds/fetch.sh and are gitignored.
# Sound source catalogue (T13). Licences read on the pages in licence_url on 2026-11-23.
# status: listed (source verified, nothing downloaded), fetched (downloaded by sounds/fetch.sh), wired (loads in the browser app).
# Packs are never committed: sounds/packs is gitignored and sounds/fetch.sh refetches them with the sha256 in sounds/packs.tsv.
# checksum of a pack entry is the sha256 of the downloaded archive. The extracted .sf2 hash is in sounds/packs.tsv.
# kind builtin: voices generated in code by composer-engine (D29); checksum is the sha256 of the source file.
