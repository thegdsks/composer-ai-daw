gaps:
  - "Real choir (aah and ooh vocal) with natural release: only synth pad choir found"
  - "Studio quality solo and ensemble strings (legato, long sustain): only synth strings, VSCO style sections not auditioned"
  - "Cinematic hybrid textures, risers, impacts, evolving ambient beds"
  - "Cinematic big percussion (taiko, epic toms, low drums) with a checked licence"
  - "Soft plucks and mallets (celesta, music box, kalimba) with a verified licence"
  - "Warm electric piano and felt piano"
  - "Verified CC0 or CC BY real choir, trumpet, trombone, French horn, cello and violin that fit a small download: none found in this pass (Karoryfer libraries are CC0 on the sfzinstruments index but 100 MB and up, and their vendor pages state no licence)"
  - "FreePats Recorder page showed no licence line when read, so it is not catalogued"
  - "Drums and percussion: only large kits (FreePats Acoustic Drum Kit 53 MiB SF2). No kit under 5 MB verified"
  - "FLAC sample sets (many SFZ packs) cannot load until the sampler has a FLAC decoder"

plan:
  - "1. Importer accepts WAV, SF2 and SFZ by drag in, reads a licence field or sidecar licence.txt and stores it with the sound."
  - "2. A WAV drop becomes a sampler instrument: pitch detect, root key and loop point suggestion, velocity from filename hints."
  - "3. SF2 and SFZ imports are referenced, not copied into the app bundle, so licence duty stays visible to the user in the sound list."
  - "4. Gaps (choir, hybrid textures, cinematic percussion, plucks) are filled by user owned or CC0 packs offered from this catalogue (bundle yes or maybe only)."
  - "5. Each project records the licence and attribution text of every sound it uses so export can emit a credits file."
