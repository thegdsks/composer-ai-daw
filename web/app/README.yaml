name: composer web app (M1)
stack: Vite, TypeScript strict, React (chrome only), Tailwind v4, canvas for roll and arrangement
run:
  dev: cd web/app && npm install && npm run dev   # http://127.0.0.1:5173, COOP and COEP sent
  build: npm run build && npm run preview          # http://127.0.0.1:4173
  checks: npm run typecheck && npm run lint && npm test
  wasm: npm run wasm   # cargo build --profile wasm-small, copies to public/composer_wasm.wasm (gitignored)
url_options:
  daemon: "?daemon=ws://127.0.0.1:7420#token=<pairing token>   (token is removed from the address bar after boot)"
  stress: "?stress=20000   (builds a one region project from group commands, no autosave)"
color_tokens:
  rule: chrome is strictly monochrome (neutral grays, black, white) in light and dark; accent is ink itself (primary button = solid ink on paper, inverted in dark, secondary = outlined), focus ring, selection, sliders, splitters, tabs, scrollbar, roll notes, playhead, loop and key shading all read tokens in src/index.css
  data_colors: instrument family hues, record and the red error and meter overload signal live only in src/data-colors.css (the allowlist); no other file under src/ui or src/index.css may hold a hue-bearing literal or a Tailwind hue class (tests/monochrome.test.ts); components use tokens, never hues
architecture:
  backend: src/backend (Backend interface, WasmBackend, DaemonBackend); the UI only calls Backend through Store
  audio: src/audio (worklet with song and live engines, offline WAV render)
  roll: src/roll (RollController and ArrangementController own canvas input and drawing)
  config: src/config.ts, every threshold overridable by VITE_* env
debug: window.composerDebug (audio status, project counts, draw stats, edit timing, last export)
layout:
  workspace: arrangement on top, bottom dock with Notes, Sound and Mix tabs, one resizable split (drag or arrow keys, Enter resets, remembered in localStorage)
  settings: the gear button sets theme (system, light, dark) and density (comfortable, compact); both are remembered
  announcer: every committed step is read in a polite live region (data-testid announcer), undo and redo name the step
  narrow: under 640 px a Tracks or Editor switch shows one area at a time
  e2e: npm run build && node e2e/shell.mjs (local helper e2e/shell-lib.mjs until the shared harness merges); node e2e/run.mjs region-edit and keyboard-clips (U05)
height_budget:
  u38: "1280x800: top bar one row (48 px, rarely used controls in the More popover: time signature, tap tempo, count in, recorded timing, MIDI keyboard, History, Find a command), roll toolbar one row, Edit tools and Chords folded, loudness lane toggle (prefs velocityLane auto, open, closed; auto folds below VITE_VELOCITY_AUTO_COLLAPSE_ROWS free rows), dock share VITE_SPLIT_NOTES_PERCENT arrangement while Notes is open until the splitter is used (Enter or double click goes back to following the tab). Labels collapse to icons under 2000 px wide (names stay as aria-labels). e2e layout (E2E_MIN_ROWS, default 14)"
start_screen:
  sheet: non modal goal sheet over the workspace on first open (no autosave yet, Never show not chosen) and at #/start (Keys and help, Show the start screen); one data-primary (Play the starter); a goal card applies a template as one group that also deletes the old tracks, so one Undo brings the old piece back, then plays with repeat on; closing lands on #/p/<project id>
  first_run: three step card, dismissible, remembered in prefs; next action chip under the top bar (src/nextAction.ts rules, hides after VITE_NEXT_ACTION_MAX_DISMISSALS dismissals)
  url: ?start=off keeps the sheet and the first run card away (automation and deep links); the other e2e scripts use it
  e2e: node e2e/run.mjs start-cinematic (smoke now clicks Play the starter on the sheet)
library_sidebar:
  what: left column with a Sounds scope (Samples is a disabled placeholder until T23 and T21a data exists); open on first run, drag its right edge or use arrow keys (Enter resets) to resize, collapse to a rail with the chevron or Shift+B; width and open state remembered (composer.library.v1), limits from VITE_LIBRARY_*
  use: click a sound to hear it (the project is not edited), double click or Enter or the Use button gives it to the selected track (adds a track when there is none), arrows step and hear after VITE_LIBRARY_AUDITION_DELAY_MS, left and right fold groups, Space still plays; licence line on every row and the full licence and credit in the footer; windowed list; hidden after 640 px
  e2e: node e2e/run.mjs library
timeline_lanes:
  what: the lanes button in the arrangement toolbar shows or hides Markers, Tempo and Key lanes (hidden by default, remembered in composer.lanes.v1); they share the arrangement scroll and zoom (src/roll/TimelineLanes.ts, src/ui/useTimelineLanes.tsx, plans in src/state/timelinePlans.ts)
  use: double click the marker lane adds a marker on the bar line, double click a marker renames it; double click the tempo or key lane opens a small sheet (BPM, or note and scale) for a change at that bar; click a marker to move the playhead there; right click a point for Go to, Rename or Change, Remove; the plus button on each lane label adds at the playhead (nearest beat), which is the keyboard route
  tap_tempo: Tap button beside Tempo; taps within VITE_TAP_RESET_MS average over the last VITE_TAP_WINDOW taps and one set_tempo at tick 0 is sent after VITE_TAP_COMMIT_MS without a tap (one undo step)
  position: readout beside Play and Stop, bar.beat.sixteenth and m:ss.cc, following the meter and tempo maps
  clip_loop: clip menu item Loop length opens a sheet (Off or shorter lengths from VITE_LOOP_CHOICES_BEATS), one set_region_loop; note clips only
  e2e: node e2e/run.mjs timeline-lanes
  known_gaps: points cannot be dragged to a new tick yet, the loop is not drawn on the clip itself, removing a point needs the right click menu, the readout does not switch unit on click, the time signature has no lane
  dnd: src/ui/dnd.ts (typed payload, acceptDrop, laneTarget, drag store); a library sound row is draggable onto a track header or clip (sets the track sound) and onto the Drop here strip or the empty lane area (new track with that sound); one undo step each; src/state/soundDrop.ts
  keyboard_drop: the sound list opens a menu with Shift+F10, the Menu key or right click (Use on <track>, Add a track with <sound>), the same action as a drop
  menu_kit: src/ui/ContextMenu.tsx (popover, role=menu, arrows, Home, End, letters, Escape, Tab closes, focus returns, touch long press from VITE_MENU_LONG_PRESS_MS); item lists in src/ui/menus.ts; track menu (Rename, Move up, Move down, Delete with an Undo toast), clip menu (Open in Notes, Split, Duplicate, Delete)
  e2e: E2E_PORT and E2E_SESSION pick the port and browser session; node e2e/run.mjs dnd and menu
keys:
  space: play or pause
  undo_redo: ctrl or cmd Z, add shift for redo
  delete: removes selected notes
  piano: off until K (Shift K turns it off) or the Keys button, and on while recording (setting remembered in prefs). A S D F G H J K L ; (white), W E T Y U O P (black), Z and X shift the octave
  roll_focus: arrows move, shift+arrows resize or change octave, Enter adds a note, ctrl A selects all, Home fits
  region_drag: drag a clip to move it (sideways and across tracks; below the last track makes a new track), drag its right edge to resize; snaps to a bar, or to a beat when a bar is narrower than VITE_SNAP_BAR_MIN_PX; hold Shift for no snap; Alt at release copies; Esc cancels; Shift click adds a clip to the selection and a drag moves all selected; Alt click splits at the pointer
  arrangement_keys: Tab reaches the arrangement (or the Skip link). Arrows move between clips and tracks and the live region reads "Pad, bars 5 to 8"; Shift plus arrows add to the selection; Enter opens the clip in Notes; N adds a clip after the selected one; S splits at the playhead; Delete removes the selected clips; Ctrl A selects all; Alt plus left or right moves the selection by the snap step, Alt plus Shift resizes, Alt plus up or down changes track
  arrangement_view: plus and minus or Ctrl wheel zoom, F fits the selection, Shift F fits the song (also the Fit button), Home goes to the start, Page Up and Page Down scroll, a scrollbar is drawn at the foot of the canvas; view state only, not commands
  transport_v2: ruler click seeks (keeps playing), drag on the ruler draws the loop brace, drag a brace end resizes it; L loop, M metronome, comma and period move the playhead one bar (focus on the arrangement or the Loop group); Loop, Metronome, Count in (off, 1, 2 bars, used when the metronome is on) and Follow buttons; Stop once halts in place, twice returns to where Play started; Home also moves the playhead to 0; e2e transport
  record: R or the Record button. Arms the selected clip (a new clip at the playhead when none), counts in (always, even with the metronome off, as many bars as Count in says), then captures Keys and MIDI notes on the audio clock with the output delay taken off. Stop with R, Stop or Pause; the song running out also stops it. Notes land as one group 'Record N notes' (resize_region first when the take runs past the clip, then add_note each); Tidy timing (default on, eighth notes) snaps starts and lengths to the grid. With Loop on, each pass is its own undo step. Held keys light up on the roll keyboard. e2e record
  effects_tab: "Effects tab in the dock (U41): chain of the chosen track or the master as device cards in order (power, name, move earlier and later, remove, generated sliders from src/state/effectsModel.ts: one release is one command, Home or double click resets). Reorder by drag on the grip (dnd kit payload effect), Alt and Up or Down on the grip, or the arrow buttons. Add effect opens the context menu kit with name and one line hint per device; audio clip tracks are refused with a reason. The device table mirrors EffectKind::params and tests/effects.test.ts checks it against the engine (defaults and describe() ranges). Effect change feed ops make the mirror fall back to one full fetch. blob.ts reads versions 1 to 7 (live engine keeps the banks, master, loops, lanes and chains). e2e effects"
  keys_tab: "Keys tab in the dock (U36): chord pads for the key at the playhead (1 to 7 or click, 7ths toggle; no key shows a key picker), a two octave clickable keyboard that also lights for computer and MIDI notes, octave buttons shared with Z and X. All live notes go through src/input/liveBus.ts. Opening the tab turns Keys on. e2e catch"
  catch: "Catch what I just played (U36): a rolling buffer (VITE_CATCH_SECONDS, VITE_CATCH_MAX_NOTES) of live notes from any source, no Record needed. Catch button (dim when empty) or Ctrl or Cmd Shift M writes one new clip at the playhead bar (next free bar on the track) as add_region plus add_notes in one group, first note at the clip start, timed by wall clock through the tempo map, tidied like Record"
  clipboard: Ctrl or Cmd C, X, V copy, cut and paste in the piano roll (notes, into the open clip) and the arrangement (clips on their source track, or notes into the selected clip); paste lands on the bar line at or before the playhead, keeps each note's beat inside its bar, grows the clip to a whole bar when needed and follows Stay in key. Ctrl D duplicates right after the selection, Ctrl Shift D asks Repeat x N (1 to VITE_MAX_REPEAT, default 16); each is one undo step (Paste 4 notes, Duplicate clip, Repeat 3 times); Duplicate and Repeat buttons sit in the arrangement toolbar; the clipboard is internal (no system clipboard mirror); e2e clipboard
  chord_strip: "Chords button in the Notes header (remembered in prefs, starts folded so the roll keeps its height) opens a row of the key's chords as plain names (7ths toggle). Click replaces the bar at the playhead, or adds one grid step at the playhead, as one undo step. Hover or keyboard focus plays it through the live engine (never while recording). More discloses voicing (inversions) and roman numerals. No key shows a hint. src/ui/ChordStrip.tsx, src/state/chordPlan.ts; e2e chord"
  mix: M and S toggles, volume and pan sliders per track (double click resets), one undo step per release
  mix_tab: one strip per track (src/ui/mixer, windowed), dB fader (arrows 0.5 dB, Home or double click resets to 0 dB), segmented meter, M and S, Show pan toggle; the meter is derived from held notes, volume, mute and solo (the engine has no per track level); e2e mixer
  daemon_files: Open and Save open a dialog for a file name inside the daemon files dir (.cmpf added automatically)
dialogs_toasts:
  dialog: src/ui/Dialog.tsx is the one native modal (headline, body, primary and secondary, Escape cancels, focus returns to the opener); Help, EnvDialog, FileDialog, the Rename sheet and confirm questions (useConfirm in src/ui/Confirm.tsx) all use it
  toasts: src/ui/toastQueue.ts (2 s, 5 s over VITE_TOAST_LONG_CHARS characters, toasts with an action VITE_TOAST_MS, at most VITE_TOAST_MAX), optional Undo button; the settings gear can silence plain toasts (Undo offers always show)
  project_menu: the Project button replaces the loose Open, Save and Export buttons (New, Open file, Save to file, Save as template and Export MIDI listed off with a reason, Export audio, Rename, Keys and help)
  unsaved_guard: src/state/unsavedGuard.ts compares the state hash with the last file save, open or new project; leaving asks through the browser prompt and New or Open ask first; the autosave is the recovery copy
  e2e: node e2e/dialogs.mjs (toast Undo, stacking, confirm focus, leave prompt)
track_header:
  what: "grip (drag, or arrow keys, Home, End on the focused grip; one move_track each), color chip (from the sound category, press to override, view state in localStorage composer.trackview.v1), name (double click, F2 or Enter edits in place, Enter commits, Escape cancels), arm button (disabled with a reason, no per track arm command), menu button and the track menu now has Duplicate track (one group labelled Duplicate track: add_track, sound and mix, duplicate_region per clip, one undo step); e2e headers"
assist:
  what: "AI assist in the palette (U26). No model call inside the app: Suggestions at the top of Ctrl K list proposals that AI clients posted (MCP or CLI) plus local recipe cards planned from the selection (bass from chords, pad, extend, repeat, soften; calm sections on an empty project). Badge on the search button and the next action chip show the waiting count (polled every VITE_ASSIST_POLL_MS)"
  card: "plain summary (what changes, command and edit counts), Show commands, Preview (an open group: shown and heard live, always rolled back, also on Escape or after VITE_ASSIST_PREVIEW_MAX_MS), Accept (one undo step: proposals tagged ai, recipes tagged recipe), Reject for proposals, Undo on the card while the project has not moved on. A stale proposal says so; one that no longer fits cannot be previewed or accepted, only rejected"
  files: src/state/assist.ts (summary and card rules), src/state/assistRun.ts (preview, accept, reject), src/state/proposalWatch.ts, src/ui/AssistCard.tsx, src/ui/useAssist.ts, src/backend/recipes.ts (templates and recipes wrappers on both backends); e2e proposals (the driver stands in for an AI client through window.composerE2e, only with ?e2e)
  gaps: no ghost overlay on the roll or arrangement (the preview is live through the open group), recipe parameters use their defaults (no form), a recipe card is tagged recipe not ai, the next action chip is hidden after VITE_NEXT_ACTION_MAX_DISMISSALS dismissals even with proposals waiting, the daemon proposals.changed push is not used (polling instead), templates are not offered in the palette yet
known_gaps:
  - keys tab and catch (U36): catch always times by wall clock (not the song position while playing), notes of a track other than the latest note's are dropped into that latest track, pads and keys were played by pointer in a browser but not heard by ear, no velocity from pointer position, no glide across keys
  - track header (U35): record arm is a disabled placeholder, track height handle not built, chip colors are the family tokens from index.css (D01 may change them), drag reorder was driven with real mouse events only in vitest math, the e2e covers the keyboard path
  - dnd and menus: no note or ruler menu yet, no sample, file or clip payloads, move up and down and Rename are menu only (no button), no Duplicate track (no command), real mouse drag and a real right click were driven through dispatched events
  - record (U14): no add_notes bulk command and no source tag on a history step exist, so a take is one add_note group labelled Record N notes (D31 asks for the label field); the take is not heard back by ear for timing, output delay is taken from the browser's reported latency; presses during the count in are dropped; the song running out ends the recording (no auto extend of an empty song); MIDI recording ran only against a fake clock in vitest, not real hardware
  - start screen: repeat is a client flag that restarts the song when it ends (the loop range and brace wait for the transport task), the prompt path and reference piece import (no MIDI import in the backend) are not built, recents lists only the one autosaved project (no library), every project shares one id so #/p/<id> only names the open project, the source template tag on the history step has no field in the command API (the step label is Start from <name>), the template voices were not heard by ear
  - mix reaches the engine through a rebuilt blob v2; the level meter read 0.00 with both tracks muted, but volume, pan and solo were not listened to by ear, and there is no live mix without a rebuild (D19), so a mix change restarts held live notes
  - sound browser (Sound tab): the 8 built in voices are picked with set_track_sound (one undo step) and heard through a separate preview engine in the worklet, so an audition never edits the project; they were not auditioned by ear. Sample packs (SF2, SFZ) are listed disabled with a reason, because loading banks in the browser is not built (D34). The in-browser backend lists the 8 voices from a static list checked against sounds/catalogue.yaml; no open group (D32), so there is no trial that Escape rolls back
  - daemon JSON import is unsupported (Open with the daemon uses files in the daemon folder); the daemon does not save assets yet
  - region drag has no auto scroll at the view edge; there is no marquee select for clips, no clip menu (Move to track, Copy), no toast with an Undo button when a drop overlaps another clip (a status message says so), and left edge trim waits for D22
  - Alt, Shift and Alt at release were driven in the e2e through key events (the browser driver does not put modifiers on mouse events), a real mouse with Alt was not tried
  - daemon Save was run in a browser and wrote the file; Open and the plain language errors are covered only by mock socket tests
  - clipboard: copied clips are snapshots pasted as add_region plus add_notes (so cut then paste works), audio clips cannot be copied (Duplicate and Repeat work on them); there is no paste at the pointer, no system clipboard text mirror, and a paste with the playhead before the open clip lands at the clip start
  - track rows are 64 px (VITE_TRACK_ROW_HEIGHT must stay equal to the h-16 class)
  - the Mix tab is a placeholder with two next actions; track header is still 64 px (60 compact) and only narrows to 208 px under 900 px, not to icons
  - Safari and Firefox unverified
