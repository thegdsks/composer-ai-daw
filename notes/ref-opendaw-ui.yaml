    - {n: 6, tag: borrow, lesson: "Double click empty grid to place a note with remembered length and velocity, double click a note to remove it.", reason: "Fastest first-note gesture, one undo step.", src: "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:215-248", live: "n/a", applies_to: "draw notes"}
    - {n: 7, tag: borrow, lesson: "Scale mask plus follow project key in the roll, with Fit to Key.", reason: "Wrong notes are hard to make, which suits beginners.", src: "packages/app/studio/src/ui/timeline/editors/notes/pitch/ScaleConfig.ts:4-50", live: "n/a", applies_to: "note editor"}
