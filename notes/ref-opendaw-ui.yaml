command_api_fit:
  rule: "Every UI action must be a serializable command in the core command API. UI, CLI and MCP are clients."
  notes:
    - fact: "Region part drags, note create, move, resize, delete, quantize, transpose, fit to key, group, freeze, preset save: each maps to a command with arguments. In their code the UI calls an editing API that writes through one edit transaction, so the shape is similar and can be copied as a design."
      src: "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:222-243"
    - fact: "Live drag previews are unmarked edits with one undo mark on approve. We should model a drag as a preview state in the UI that emits one command at the end (or a begin, update, commit command triple if the engine must hear the live value). Escape drops the preview and emits nothing."
      src: "packages/lib/dom/src/dragging.ts:7-31"
    - fact: "The audition picker uses a checkpoint inside the edit history. Our version should be a command group with a rollback token so the CLI and MCP can try and revert the same way."
      src: "packages/lib/box/src/editing.ts:114-136"
    - fact: "Command palette verbs (create, open, go to, sample) should be generated from the command registry, with each command declaring a verb, label, keywords and an enabled test with reason text."
      src: "plans/spotlight.md:1-30"
    - fact: "Pure UI state (panel layout, zoom, scroll, snap choice, tour progress, tool preference) may stay local, but anything that changes the song, including snap based grid for new notes, goes through commands."
    - fact: "Shortcut definitions as data with descriptions fit a command registry: bind a key to a command id, show the same description in tooltips and in agent tool lists."
      src: "packages/app/studio/src/service/StudioShortcutManager.ts:33-42"
    - fact: "Screen switching and pane toggles exist as global shortcuts in their app but are view state; we may expose them as read only view commands for agents."

unverified:
  - "Exact current panel sizes persist between sessions; code for saving layout was not located."
  - "Whether native scrollbars hidden by default hurt a trackpad-less user in practice beyond the clip columns."
  - "Whether the faded icon near the MIDI button in the header is undo, capture MIDI or something else."
  - "Whether the manual claim that Tab cycles screens matches the actual shortcut set (next and previous screen shortcuts exist; keys were not read)."
