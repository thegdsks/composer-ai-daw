performance_tactics:
  - id: canvas_painters_with_requested_updates
    tag: borrow
    fact: "Canvas editors repaint only when asked. Painters subscribe to range, snapping, selection and data changes, each of which calls a request update that coalesces into the next animation frame."
    src: ["packages/studio/core/src/ui/canvas/painter.ts:5-60", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:293-300"]
  - id: frame_throttle_to_60
    tag: borrow
    fact: "A single animation frame service drives all painters and meters and skips frames closer than 16 ms. On a 120 Hz screen this halved UI work across more than thirty subscribers. Exposed as a preference."
    src: ["packages/lib/dom/src/frames.ts:28-46", "docs/performance.md:63-69", "packages/studio/core/src/StudioSettings.ts:47"]
  - id: audio_off_main_thread
    tag: borrow
    fact: "Audio runs in a worklet, file and storage work in workers, and offline render and mixdown in a worker. Live meter and peak data stream from the engine to the UI. The studio needs cross origin isolation and refuses to boot without it."
    src: ["packages/app/studio/src/main.ts:35-45", "packages/studio/core/src/OfflineEngineRenderer.ts", "packages/studio/core/src/Workers.ts"]
  - id: custom_scrollbars
    tag: rethink
    fact: "Native scrollbars are hidden everywhere (to stop layout shift and style them) and custom scrollbars are drawn where wired. Where not wired, users cannot see scroll position (the clip columns have no horizontal bar)."
    src: ["packages/app/studio/src/main.sass:47-53", "packages/studio/scrollbars/src/Scrollbars.tsx:25-55", "issues/0185.md:12-20"]
  - id: no_list_virtualization_found
    tag: rethink
    fact: "Searching UI code found no virtual list for long lists. Large lists (94 devices, samples) render fully. Lists of regions are drawn on canvas so DOM size stays small."
    src: ["packages/app/studio/src/ui/browse/ResourceBrowser.tsx:270-300", "packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionRenderer.ts"]
  - id: wheel_event_calibration
    tag: borrow
    fact: "Wheel and trackpad inputs are normalized so zoom speed feels the same across devices."
    src: ["packages/app/studio/src/ui/timeline/WheelScaling.ts:11-27"]
  - id: perf_page_per_device
    tag: borrow
    fact: "A built in page renders every device offline and reports render time, marginal cost over an empty engine and per quantum cost, after a warm-up. Per device regressions are visible."
    src: ["docs/performance.md:3-21", "packages/app/studio/src/ui/pages/PerformancePage.tsx"]
  - id: clip_and_bound_memory_hints
    tag: borrow
    fact: "Footer can show memory and sample memory use; the DSP load readout toggles from the header. Mixdown for very long projects can run out of memory and crashes rather than warns."
    src: ["packages/app/studio/src/ui/Footer.tsx:129-160", "packages/app/studio/src/ui/header/PerformanceStats.tsx:38", "errors/P3-mixdown-offline-render-oom.md:1-8"]

