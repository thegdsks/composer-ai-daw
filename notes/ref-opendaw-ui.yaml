    live: "Footer read 'Online Yes, Project Untitled, SampleRate 48k, Output 24.0ms, Memory 11/29M, Storage 0kB'."

input_model:
  - id: shortcut_contexts
    tag: borrow
    fact: "Shortcuts are grouped in named contexts (global, regions, chord track, note editor, content editor, device panel, software MIDI, piano panel). The more local context wins when its element has focus. Each shortcut has a description string and the same data feeds tooltips and a shortcut manager page."
    src: ["packages/app/studio/src/service/StudioShortcutManager.ts:33-42", "packages/app/studio/src/ui/shortcuts/ShortcutTooltip.ts", "packages/app/studio/src/ui/shortcuts/GlobalShortcuts.ts:8-20"]
  - id: user_remappable_shortcuts
    tag: borrow
    fact: "Only the differences from defaults are stored in local storage under a custom shortcuts key, and old snapshots are migrated so defaults that later moved are not mistaken for user choices."
    src: ["packages/app/studio/src/service/ShortcutStorage.ts:8-36", "packages/app/manual/public/keyboard-shortcuts.md:3"]
  - id: modifier_conventions
    tag: borrow
    fact: "Consistent grammar across editors: Cmd or Ctrl drag copies; Alt drag is fine control or freeze axis or draw line; Shift click toggles selection, Shift disables snapping when dragging values and warp markers."
    src: ["packages/app/manual/public/keyboard-shortcuts.md:9-49"]
  - id: pointer_drag_protocol
    tag: borrow
    fact: "All drags go through one helper with update, approve, cancel and finally steps and pointer capture. Escape cancels. Live updates are applied unmarked and the undo mark happens only on approve, so a whole drag is one undo step. Optional pointer lock for endless drags is a preference."
    src: ["packages/lib/dom/src/dragging.ts:7-60", "packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionsArea.tsx:330-345", "packages/studio/core/src/StudioSettings.ts:70-78"]
  - id: hit_testing_by_capture_objects
    tag: borrow
    fact: "Canvas content is hit tested by a small capture object per editor that maps a local point to a typed target (note start, note end, region part, loop edge) instead of per element DOM events. The same object drives the cursor shape."
    src: ["packages/studio/core/src/ui/canvas/capturing.ts:1-26", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:314-320"]
  - id: context_menus_everywhere
    tag: borrow
    fact: "Right click menus exist on regions, notes, tracks, strips and devices and carry the shortcut text next to each item. Long press on touch synthesizes a context menu (500 ms, 10 px slop) because WebKit sends none."
    src: ["packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionContextMenu.ts:76-266", "packages/app/studio/src/ui/TouchContextMenu.ts:4-50"]
  - id: drag_and_drop_payloads
    tag: borrow
    fact: "Drag payloads are a small typed union (sample, soundfont, file, device with ids, instrument). Drops are validated per target so lanes and device chains show whether a drop is allowed."
    src: ["packages/app/studio/src/ui/AnyDragData.ts:6-30", "packages/app/studio/src/ui/DragAndDrop.ts"]
  - id: touch_is_second_class
    tag: avoid
    fact: "On a phone the app does not load; it shows a static page saying it needs a computer. Touch is partly handled on desktop browsers (long press, touch action, history buttons default on only when touch points exist)."
    src: ["packages/app/studio/src/main.ts:15-34", "packages/app/studio/src/mobile.sass:1-40", "packages/studio/core/src/StudioSettings.ts:22"]

feedback:
  - id: undo_model
    tag: borrow
    fact: "Edits run inside a transaction. A marked transaction becomes one undo step and folds leftover unmarked edits in. Unmarked updates are used for live drag previews. A checkpoint lets a picker roll back or commit everything since as one step."
    src: ["packages/lib/box/src/editing.ts:114-136", "packages/lib/box/src/editing.ts:243-250", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:222-226"]
  - id: undo_ui_is_minimal
    tag: rethink
    fact: "Undo and redo are two icons that grey out when impossible and a pair of shortcuts. There is no visible history list. The history buttons are off by default on non touch devices (shortcuts still work)."
    src: ["packages/app/studio/src/ui/header/UndoRedoButtons.tsx:19-43", "packages/studio/core/src/StudioSettings.ts:22"]
  - id: toasts
    tag: borrow
    fact: "Short toast messages stack at one corner, display 2 seconds or 5 seconds when text is longer than 60 characters, then fade. A preference turns them off."
    src: ["packages/app/studio/src/ui/surface/Toast.tsx:11-25", "packages/app/studio/src/ui/surface/Surface.tsx:212-213", "packages/app/studio/src/ui/pages/PreferencesPageLabels.ts:14"]
  - id: progress_dialogs_with_cancel
    tag: borrow
    fact: "Long jobs (stem import, exports) open a progress dialog with a headline, optional progress bar and a cancel callback."
    src: ["packages/app/studio/src/ui/components/dialogs.tsx:226-262", "packages/app/studio/src/service/StudioService.ts:346-369"]
  - id: friendly_error_boundaries
    tag: borrow
    fact: "Known environmental failures are caught and turned into plain dialogs: audio engine start failure, storage full, file picker blocked, component chunk failed to load. Unknown errors go to an error reporter with scrubbing."
    src: ["packages/app/studio/src/service/StudioService.ts:511-557", "packages/app/studio/src/errors/ErrorHandler.ts:96-110", "errors/ENV-storage-quota-exceeded.md:1-8", "errors/ENV-file-picker-not-allowed.md:1-8"]
  - id: error_triage_with_priorities
    tag: borrow
    fact: "Production error reports are grouped into files per cause with priority (P1 to P3, ENV for environment) and status, with a recommended fix and evidence. This keeps a handful of real bugs separate from browser noise."
    src: ["errors/error-triage.md", "docs/error-triage.md"]
  - id: empty_states_are_actions
    tag: borrow
    fact: "Empty timeline and empty device panel both show two buttons, Add instrument and Add audio track, plus a drop hint. The empty Projects tab points to demo projects."
    src: ["packages/app/studio/src/ui/dashboard/Resources.tsx:68-70"]
    live: "Timeline: 'Add instrument (+)' and 'Add audio track (+)' buttons and the text 'Drop instruments or samples here'. Devices panel repeated the same two buttons centered."
  - id: unsaved_work_guards
    tag: rethink
    fact: "Leaving the page prompts via the browser. A recovery backup of the open project is written to private storage so it can be restored on next start. A request to back up continuously while editing is open."
    src: ["packages/app/studio/src/service/StudioService.ts:612", "packages/studio/core/src/project/Recovery.ts:16-40", "issues/0084.md:1-12"]
  - id: dialog_export_options_visible
    tag: borrow
    fact: "Mixdown export is one small dialog: section (entire song), format, channels, sample rate, bit depth, with a one line description of what the format does, and a single Export button."
    live: "Export Mixdown dialog showed Section 'Entire song', Format 'WAV' with the line 'Uncompressed PCM. 32 bit float is lossless, 16 and 24 bit are quantized.', Channels Mono or Stereo, Sample Rate 48000 Hz, Bit Depth 32 Bit Float, Export button."
    src: ["packages/app/studio/src/ui/components/BounceOptionsSelector.tsx", "packages/app/studio/src/service/Mixdowns.ts"]

