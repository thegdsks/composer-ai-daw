    - {n: 2, tag: borrow, lesson: "A first instrument also makes one bar of empty clip and opens the editor on it.", reason: "Removes the 'now what' moment of an empty project.", src: "packages/studio/core/src/StudioSettings.ts:82", live: "Cubed then Ok created a region and opened the roll", applies_to: "make a beat, first note"}
    - {n: 3, tag: borrow, lesson: "Empty states show the next two actions as buttons (add instrument, add audio track) plus a drop hint.", reason: "The empty screen teaches the first step.", src: "packages/app/studio/src/ui/dashboard/Resources.tsx:68-70", live: "empty timeline and devices", applies_to: "empty project, arrangement"}
