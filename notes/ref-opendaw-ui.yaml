  - id: record_arming_and_inputs
    tag: borrow
    fact: "Each channel header has an arm button, shift click adds more armed tracks, the arm button doubles as an input peak meter, a header menu picks the audio or MIDI input and monitoring mode (off, direct, through effects) and force mono."
    src: ["packages/app/manual/public/recording.md:11-37", "packages/app/studio/src/ui/timeline/tracks/audio-unit/headers/TrackHeaderMenu.ts:51-70"]
