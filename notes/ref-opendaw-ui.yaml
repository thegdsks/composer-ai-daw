beginner_friction:
  walkthrough_status: "Live walk-through reached first open, New Project, tour offer, Add Instrument, empty piano roll, mixer screen, spotlight and the mixdown dialog. Not done: audible playback, recording, adding an effect, drawing notes beyond the first region, an actual export (headless, no audio or input device, nothing submitted)."
  items:
    - id: first_open_no_guidance_until_project
      tag: rethink
      fact: "The dashboard is dense: four big actions, six tabs, search, many outbound links, sponsors and contributors. The first thing a beginner must decide is New Project versus Demos, with no recommendation beyond the empty state text."
      live: "Dashboard first screen listed New Project, New Live Room, Open Bundle, Neural Demux, 6 tabs and 60+ links."
      src: ["packages/app/studio/src/ui/dashboard/Dashboard.tsx", "packages/app/studio/src/ui/dashboard/Contributors.tsx"]
    - id: blank_project_needs_vocabulary
      tag: rethink
      fact: "A blank project asks for 'instrument' versus 'audio track', then a 94 entry picker with names like Apparat, Composite, Cubed, Korpus. Brand names do not tell a beginner what they sound like."
      live: "Add Instrument list started with Apparat, Composite, Cubed, Korpus with short grey subtitles such as 'Scriptable Instrument' and '303-style Synth'."
      src: ["packages/app/studio/src/ui/browse/DeviceCatalog.ts", "packages/app/studio/src/ui/browse/DeviceTags.ts"]
    - id: hidden_gestures
      tag: avoid
      fact: "Key actions are gestures with no on screen affordance: double click to create or delete a note, Alt drag to create with velocity, Alt click to cut, Shift wheel to zoom, Shift click on an automation curve to add a point. The manual page lists them; the UI does not."
      src: ["packages/app/manual/public/keyboard-shortcuts.md:9-49", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:215-248"]
    - id: manual_drift
      tag: avoid
      fact: "The mixer manual says M toggles the mixer, but the shortcut table binds M to mute of the edited channel."
      src: ["packages/app/manual/public/mixer.md:15-18", "packages/app/studio/src/ui/shortcuts/GlobalShortcuts.ts:110-113"]
    - id: tour_cannot_be_restarted
      tag: avoid
      fact: "The tour has no menu entry. A user who says Never show this again must find a preference to see it again."
      src: ["plans/studio-tour.md:19-30"]
    - id: recording_depends_on_hardware
      tag: avoid
      fact: "The manual warns that Bluetooth devices add 100 ms or more latency and the browser may under report output latency by a wide margin (90 ms reported vs 300 ms real). Users must read and calibrate."
      src: ["packages/app/manual/public/recording.md:3-9", "packages/app/manual/public/latency-calibration.md:7-14"]
    - id: browser_limits
      tag: avoid
      fact: "Audio output selection and MIDI are missing in some browsers; storage can be unavailable in Safari private mode; quota exhaustion needs a friendly dialog; file pickers need a live user gesture."
      src: ["packages/app/manual/public/browser-support.md:5-10", "errors/ENV-storage-not-available.md:1-8", "errors/ENV-storage-quota-exceeded.md:1-8", "errors/ENV-file-picker-not-allowed.md:1-8"]
    - id: boot_gate_is_a_raw_alert
      tag: avoid
      fact: "If cross origin isolation is missing the app shows a plain browser alert and nothing else."
      src: ["packages/app/studio/src/main.ts:44-45"]
    - id: clips_get_lost
      tag: avoid
      fact: "Launch clips could be moved into hidden columns, the clip view could be widened until the arrangement left the screen, and there is no visible scroll bar for the clip columns, so users without a trackpad must know Shift plus wheel."
      src: ["issues/0185.md:6-24"]
    - id: deleted_tracks_vanish
      tag: avoid
      fact: "Deleted tracks vanish without a trace; a user asked for a recycle bin."
      src: ["issues/0327.md:1-10"]
    - id: load_hang_and_count_in
      tag: avoid
      fact: "A project can hang forever on the Loading dialog until reload. MIDI notes played during count-in are dropped or snapped to the downbeat."
      src: ["issues/0404.md:1-10", "issues/0493.md:1-10"]
    - id: silent_overlap_clipping
      tag: rethink
      fact: "By default a region moved over another clips it silently. Beginners may not notice data change."
      src: ["packages/studio/core/src/StudioSettings.ts:84", "docs/overlapping-regions-behaviour.md:5-8"]
    - id: squeezed_layout_small_window
      tag: avoid
      fact: "On a short laptop window the arrangement panel is pushed out when the editor opens."
      live: "At 1280x577 after Add Instrument the timeline was not visible."
      src: ["packages/app/studio/src/ui/workspace/Default.ts:81-98"]
    - id: export_choices_for_beginners
      tag: rethink
      fact: "Mixdown defaults to a 32 bit float WAV at 48 kHz, a heavy default for sharing. Options for MP3 style sharing are not in the first view."
      live: "Export Mixdown defaulted to WAV, 48000 Hz, 32 Bit Float."
      src: ["packages/app/studio/src/ui/components/BounceOptionsSelector.tsx", "packages/app/studio/src/ui/components/AudioFormatSelector.tsx"]
