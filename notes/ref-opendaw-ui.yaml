# UI reference map of openDAW (a browser DAW, AGPL). Paths in src: are relative to the clone root
# <reference checkout>/opendaw. Behavior is described in our own words, nothing is copied.
# Complements notes/ref-opendaw.yaml (which sampled the UI only lightly).
# live: marks facts seen in the running app at https://opendaw.studio (no sign-in, nothing uploaded
# or exported, sessions closed). Two viewports were used: 1280x577 and 1600x900.
# Not done live (headless, no audio device or input): playing sound, recording, adding an effect.

meta:
  license: "AGPL-3.0-or-later. Ideas and behavior are free, expression is not (see CLAUDE.md Reference code rule)."
  ui_stack:
    - fact: "No React and no virtual DOM. A small JSX runtime creates real DOM nodes, per-component Sass adopted as constructable stylesheets, observable values for state, a lifecycle object that owns every subscription."
      src: ["packages/app/studio/src/ui/workspace/PanelResizer.tsx:1-21", "packages/lib/jsx/src/create-element.ts", "packages/lib/dom/src/html.ts"]
    - fact: "Timeline, note editor, automation, meters and sample waveforms are canvas painters driven by a shared animation frame loop; menus, dialogs, device panels and mixer strips are DOM."
      src: ["packages/studio/core/src/ui/canvas/painter.ts:5-22", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:100-106"]
  ui_scope_of_this_file: "layout, timeline, note editor, device and mixer panels, browsers, input, feedback, onboarding, theming, perf tactics, a11y, beginner friction"

layout:
  - id: screens_are_named_workspaces
    tag: borrow
    fact: "The studio has a fixed set of named screens, each a tree of nested horizontal and vertical splits holding panels. Screens are default (arrangement), mixer, modulation, piano tutorial, project info, shader visualizer, code editor and tempo tap, plus a hidden dashboard. The user switches with icons at the top right, a next and previous screen shortcut, or direct shortcuts per screen."
    src: ["packages/app/studio/src/ui/workspace/Default.ts:54-291", "packages/app/studio/src/ui/workspace/Workspace.ts:6-12", "packages/app/studio/src/ui/shortcuts/GlobalShortcuts.ts:127-170"]
    live: "Top right shows 8 screen icons, the first active. Clicking the second icon swapped the arrangement for the mixer plus analysis screen and kept the device panel at the bottom."
  - id: default_screen_composition
    tag: borrow
    fact: "Default screen is a row of browser (left, fixed 300 px, starts collapsed), a column of timeline (flex weight 2), content editor (starts collapsed) and device panel (fixed 248 px), and mixer (right, collapsed, max 480 px). Collapsed panels show only a title strip or a vertical side tab."
    src: ["packages/app/studio/src/ui/workspace/Default.ts:6-21", "packages/app/studio/src/ui/workspace/Default.ts:69-111"]
    live: "First open of a new project showed Timeline expanded, Editor and Devices as thin header bars, Browser and Mixer as vertical side tabs on the far left and right."
  - id: panel_constraints_flex_or_fixed
    tag: borrow
    fact: "Each panel declares either a flex weight with min and optional max size, or a fixed size. Fixed panels and collapsed panels are not resizable. Dragging a divider redistributes flex weight between exactly the two neighbours, clamped by both of their min and max sizes."
    src: ["packages/app/studio/src/ui/workspace/Workspace.ts:13-23", "packages/app/studio/src/ui/workspace/PanelResizer.tsx:40-63"]
  - id: panel_flags
    tag: borrow
    fact: "Per panel flags decide whether it may be minimized, popped out, or starts minimized. The device panel and dashboard cannot be popped out; the notepad and project info cannot be minimized."
    src: ["packages/app/studio/src/ui/workspace/Default.ts:14-37", "packages/app/studio/src/ui/workspace/Workspace.ts:30-39"]
  - id: popout_to_browser_window
    tag: rethink
    fact: "A panel can be popped out into a separate 640 by 480 browser window and be re-embedded later. If the popup is blocked the user sees an info dialog asking to check the popup blocker. One panel instance may live in only one place at a time."
    src: ["packages/app/studio/src/ui/workspace/PanelContent.tsx:92-120", "packages/app/studio/src/ui/workspace/PanelContent.tsx:56-58", "packages/app/studio/src/ui/workspace/PanelPlaceholder.tsx:142-146"]
  - id: small_window_squeeze
    tag: avoid
    fact: "Layout is flex only, there is no breakpoint logic. In a short window the arrangement panel can be squeezed to nothing while the editor and devices take the space."
    live: "At 1280x577 after adding an instrument only the Editor and Devices panels were visible and the track list was gone. At 1600x900 the same project showed timeline, editor and devices stacked comfortably."
    src: ["packages/app/studio/src/ui/workspace/Default.ts:81-98"]
  - id: panels_toggle_by_shortcut
    tag: borrow
    fact: "Browser, content editor and device panel toggle with Shift plus B, E and D. Tempo, marker, signature, key and chord lanes toggle with Shift plus T, M, S, K, C. Clips toggle with Shift plus G."
    src: ["packages/app/studio/src/ui/shortcuts/GlobalShortcuts.ts:62-97"]
  - id: auto_reveal_editor
    tag: borrow
    fact: "Double clicking a region, or creating one by double click on an empty lane, makes the content editor visible if it was collapsed and points it at that region. Adding an instrument from the dialog also opened the editor."
    src: ["packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionsArea.tsx:154-180"]
    live: "After Add Instrument with Cubed the editor panel expanded to a piano roll without any extra click."

timeline:
  - id: lane_model
    tag: borrow
    fact: "Left column holds a header per channel (icon, name, record arm, mute, solo, monitor, a menu); right area holds the lanes. Extra primary lanes for tempo, signature, key, chords and markers sit above the channel lanes and are hidden by default except markers. A launch clip column strip can be shown left of the regions."
    src: ["packages/app/studio/src/ui/timeline/tracks/primary/PrimaryTracks.tsx", "packages/app/studio/src/ui/timeline/tracks/audio-unit/headers/AudioUnitTrackHeader.tsx", "packages/studio/core/src/StudioSettings.ts:28-44"]
    live: "Header strip of a new channel showed instrument icon, name 'Cubed', sub label 'Notes', and four small round controls plus a three dot menu. Markers row exists but is thin and empty by default."
  - id: region_parts_decide_drag
    tag: borrow
    fact: "There is no tool palette. What a drag does depends on which part of a region the pointer is over: start edge, end edge, body (move, also across lanes), content start, loop length handle, fade in handle, fade out handle. The cursor changes per part."
    src: ["packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionsArea.tsx:287-345", "packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionCapturing.ts"]
  - id: modifier_key_gestures
    tag: borrow
    fact: "Alt on a region shows a scissors cursor and a preview line at the snapped cut point; Alt click cuts, Alt plus Shift cuts without consolidating. Shift on a fade handle drag changes the fade curve slope instead of length. Shift plus wheel zooms around the pointer, Alt plus wheel pans, plain horizontal wheel pans with a dead zone."
    src: ["packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionsArea.tsx:182-203", "packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionsArea.tsx:252-285", "packages/app/manual/public/keyboard-shortcuts.md:14-20"]
  - id: draw_region_by_double_click
    tag: borrow
    fact: "Double click on empty lane space creates a region that fills the snap interval under the pointer, trimmed so it never overlaps neighbours, selects it and opens it in the editor. Disabled when the channel is frozen."
    src: ["packages/app/studio/src/ui/timeline/tracks/audio-unit/regions/RegionsArea.tsx:154-180"]
  - id: snapping
    tag: borrow
    fact: "One shared snap setting with units from Smart through bar down to 1/128. Smart picks the grid from zoom so cells never get narrower than about 16 px. Snap menu sits left of the lane area. Finer and coarser snap have shortcuts. Moves compare snapping the delta against snapping the absolute position and take whichever is closer to the pointer. Snap honours bar length when a signature track exists."
    src: ["packages/app/studio/src/ui/timeline/Snapping.ts:18-70", "packages/app/studio/src/ui/timeline/Snapping.ts:110-118", "packages/app/studio/src/ui/shortcuts/CommonShortcuts.ts:18-26"]
    live: "Snap dropdown reads 'Smart' by default in both timeline and note editor headers."
  - id: zoom_and_wheel_calibration
    tag: borrow
    fact: "Wheel zoom normalizes odd wheel devices: it tracks the largest recent wheel delta (decaying over about 300 ms) and expresses each tick as a fraction of it, then applies a user speed preference. Zoom anchors on the pointer position, clamped to the visible range."
    src: ["packages/app/studio/src/ui/timeline/WheelScaling.ts:6-42"]
  - id: selection_and_multi_select
    tag: borrow
    fact: "Click selects, Shift click toggles, a rubber band rectangle selects, Shift plus rectangle inverts. Select all, deselect all and delete are shared across editors through one common shortcut set."
    src: ["packages/app/manual/public/keyboard-shortcuts.md:9-12", "packages/app/studio/src/ui/shortcuts/CommonShortcuts.ts:28-42", "packages/app/studio/src/ui/timeline/SelectionRectangle.tsx"]
  - id: overlap_policy_is_a_setting
    tag: rethink
    fact: "When a region is dropped, moved or duplicated over another, the app resolves it by a user setting: clip the existing one (default), push the existing one to a new lane below, or keep the existing and push the new one. The resolver has had many regression tests and at least one known open crash path."
    src: ["packages/studio/core/src/StudioSettings.ts:5", "packages/studio/core/src/StudioSettings.ts:79-87", "docs/overlapping-regions-behaviour.md:1-8", "errors/P2-timeline-overlap-after-clipping.md:1-8"]
  - id: loop_and_playhead_and_scroll
    tag: borrow
    fact: "Loop is a draggable bar in the ruler with start handle, end handle and body drag. Follow cursor (auto scroll with the playhead) is an opt in toggle, off by default. Drags near the edge auto scroll at a capped speed, with exclusions for resize handles and header knobs."
    src: ["packages/app/studio/src/ui/timeline/LoopAreaEditor.tsx:12-30", "packages/studio/core/src/StudioSettings.ts:35-43", "packages/app/studio/src/ui/timeline/Config.ts:3-10"]
    live: "Header shows a loop toggle next to record, play, stop. Ruler shows bar numbers with a darker horizontal bar above it for the loop and a long pill slider for the visible range."
  - id: track_height_and_group_buses
    tag: borrow
    fact: "Each lane has a bottom edge drag handle (5 px), double click resets, height capped at 240 px and stored in the project. A group of channels can be folded behind a group bus lane with a collapse toggle. One undo step per resize, Escape cancels."
    src: ["plans/track-resizing.md:1-12", "packages/app/studio/src/ui/timeline/tracks/audio-unit/UnitLane.tsx:60-75", "packages/app/studio/src/ui/shortcuts/GlobalShortcuts.ts:9-16"]
  - id: tempo_signature_markers_as_lanes
    tag: borrow
    fact: "Tempo, meter, key and chord changes are ordinary lanes on the timeline rather than modal dialogs, shown on demand from a Primary Tracks submenu in the timeline plus menu."
    src: ["packages/app/studio/src/ui/timeline/TimelineHeader.tsx:55-90", "packages/app/manual/public/key-and-chords.md:16-18"]

note_editor:
  - id: create_by_double_click
    tag: borrow
    fact: "Double click on empty grid creates a note at the snapped position and clicked pitch, using the last used duration and velocity as defaults, selects it, and auditions it. Double click on an existing note deletes it. Creation and selection are one undo step."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:215-248", "packages/app/studio/src/ui/timeline/editors/notes/NoteDrawDefaults.ts:4-15"]
  - id: alt_drag_create_with_velocity
    tag: rethink
    fact: "Alt drag on empty space starts a create gesture where vertical drag distance reads as velocity while the pitch stays where the drag started. Hidden unless the user reads the manual."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:121-140", "packages/app/manual/public/keyboard-shortcuts.md:22-24"]
  - id: drag_parts_and_audition
    tag: borrow
    fact: "Dragging a note body moves position and pitch together; dragging the note end changes length. Both audition the pitch while dragging, and a pitch change retriggers the audition. Dragging the loop edge of the region inside the editor changes the loop duration."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:250-283", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchEditor.tsx:110-121"]
  - id: property_lane_under_grid
    tag: borrow
    fact: "Under the pitch grid a property lane edits one per-note value at a time (velocity by default), chosen from a small dropdown with min and max labels. Ctrl or Cmd drag paints values, Alt drag draws a straight line of values."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/NoteEditor.tsx:122-125", "packages/app/studio/src/ui/timeline/editors/notes/property/PropertyHeader.tsx:16-40", "packages/app/manual/public/keyboard-shortcuts.md:26-29"]
    live: "Under the empty piano roll a 'Velocity' dropdown with 100% and 0% range labels was visible."
  - id: scale_and_key_helpers
    tag: borrow
    fact: "The roll has a scale highlight: a 12 bit mask of allowed pitch classes plus a root, editable by clicking pitch classes, with a toggle to follow the project key at the playhead. A menu action 'Fit to Key' pushes notes onto the scale. The project key can also be set by playing a chord, and key and chords can be detected from existing note regions."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/pitch/ScaleConfig.ts:4-50", "packages/app/studio/src/ui/timeline/editors/notes/NoteEditor.tsx:110-120", "packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchMenu.ts:91-93", "packages/app/manual/public/key-and-chords.md:26-39"]
  - id: edit_menu_contents
    tag: borrow
    fact: "Edit menu offers delete, duplicate, step recording, consolidate, quantize, resize by two or half, inverse, reverse, fit to key and transpose by semitone or octave. View menu offers note height presets, center notes and zoom to all notes."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/pitch/PitchMenu.ts:23-108", "packages/app/studio/src/ui/timeline/editors/notes/NoteViewMenu.ts:9-43"]
  - id: step_recording
    tag: borrow
    fact: "With step recording on and playback stopped, each incoming MIDI note is written at the snapped playhead with the snap length, then the playhead advances by that length. The cursor changes look while it is on."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/NoteEditor.tsx:83-103", "packages/app/studio/src/ui/timeline/editors/notes/NoteEditor.tsx:247-250"]
  - id: initial_view_and_focus_care
    tag: borrow
    fact: "On first layout the roll centers on the middle of existing notes, or on C3 area when empty. The editor takes keyboard focus only when nothing else holds it, to avoid breaking region shortcuts after a content swap."
    src: ["packages/app/studio/src/ui/timeline/editors/notes/NoteEditor.tsx:181-208"]
    live: "Empty region opened with the keyboard strip centered around C3 and a one bar region outline in gold."

devices_and_mixer:
  - id: device_panel_for_selected_channel
    tag: borrow
    fact: "One shared device panel shows the instrument and effect chain of the selected channel, with insert points between devices. Both the add instrument and add effect actions open the same device browser filtered for that insert point."
    src: ["packages/app/manual/public/device-browser.md:7-15", "packages/app/studio/src/ui/devices/AddEffectButton.tsx:16-22", "packages/app/studio/src/ui/tour/TourSteps.ts:75-78"]
    live: "Device panel for 'Cubed' showed the device header with power toggle, name, preset folder icon and menu, knobs with value labels under each, a 16 step pattern grid, and a channel strip at the far right."
  - id: audition_before_commit_picker
    tag: borrow
    fact: "The device picker creates the clicked item at once so it sounds immediately. The next click first undoes the previous pick so only one candidate exists. Enter or Ok keeps it as one undo step; Escape or Cancel restores everything. A piano under the list plays the candidate; up and down arrows step through entries; Space plays the transport."
    src: ["packages/app/manual/public/device-browser.md:17-37", "plans/device-browser-nonmodal.md:5-10", "packages/app/studio/src/ui/browse/DeviceAudition.ts"]
    live: "Add Instrument dialog: search field 'Search names and tags', count '94 / 94', filter toggles, list of names with a short description, info pane reading 'Select an instrument to create and preview it', an on screen piano, Cancel and Ok."
  - id: picker_cramped_when_short
    tag: avoid
    fact: "The picker dialog gives the piano a fixed band, so the list gets very few rows on a short window."
    live: "At 1280x577 only four list rows were visible out of 94."
    src: ["packages/app/studio/src/ui/browse/DeviceDialog.tsx"]
  - id: non_modal_picker_cost
    tag: avoid
    fact: "Making the audition picker non modal was studied and found to break undo (undo can step below the checkpoint base), fold unrelated edits into the checkpoint, and confuse which channel the piano follows. The team kept it modal."
    src: ["plans/device-browser-nonmodal.md:5-24"]
  - id: effect_drag_and_drop
    tag: rethink
    fact: "Effects and instruments are drag sources with a ghost badge showing how many devices move. Dragging between channels was requested; maintainer closed it in favour of cut and paste. A request to drag between a layer rack and its parent chain is open."
    src: ["packages/app/studio/src/ui/devices/DeviceDragging.ts:8-40", "issues/0057.md:1-12", "issues/0408.md:1-12"]
  - id: mixer_strip_layout
    tag: borrow
    fact: "A strip, top to bottom, has input name, sends, output routing selector, pan knob, volume readout and peak readout over a tall fader with dB scale, then mute and solo. Master strip shows output routing and a mastering entry. Context menu on a strip offers group collapse, freeze, auto EQ, duplicate, delete, reset mute and reset solo. Mute and solo act on the edited channel by single key press."
    src: ["packages/app/studio/src/ui/mixer/ChannelStrip.tsx:183-216", "packages/app/manual/public/mixer.md:9-25", "packages/app/studio/src/ui/shortcuts/GlobalShortcuts.ts:110-117"]
    live: "Mixer screen showed two strips (Cubed and master 'Output' with 'Mastering' and 'Default'), with a tall fader, dB ticks and a header icon each."
  - id: analysis_panel_beside_mixer
    tag: borrow
    fact: "Mixer screen pairs the strips with an analysis panel: two VU meters, spectrum, spectrogram, loudness level bars, goniometer and scope."
    src: ["packages/app/studio/src/ui/workspace/Default.ts:38-44", "packages/app/studio/src/ui/tour/TourSteps.ts:83-86"]
    live: "Analysis panel on the right of the mixer screen listed VU L and R, Spectrum, Spectrogram, Level (LUFS), Gonio and Scope."
  - id: routing_is_dropdowns
    tag: borrow
    fact: "Routing is edited with plain output selector dropdowns per strip (channel to bus, bus to output, audio output device), not a patch bay."
    src: ["packages/app/studio/src/ui/mixer/ChannelOutputSelector.tsx", "packages/app/studio/src/ui/mixer/BusOutputSelector.tsx", "packages/app/studio/src/ui/mixer/AudioOutputSelector.tsx"]
  - id: layer_racks
    tag: rethink
    fact: "Layered instruments and nested effect chains exist (composite device), which needs extra UI for entering a layer and for drag targets mid chain. Beginners see more concepts."
    src: ["packages/app/studio/src/ui/devices/InstrumentCompositeLayer.tsx", "packages/app/studio/src/ui/devices/CompositeEntryList.tsx", "issues/0408.md:1-12"]

browser_and_library:
  - id: one_browser_many_scopes
    tag: borrow
    fact: "A side browser panel switches between scopes (samples, soundfonts and others) with a search field, folder tree, and drag out to the timeline or an instrument. Dropping a sample on the timeline creates an audio track. It starts collapsed."
    src: ["packages/app/studio/src/ui/browse/BrowserPanel.tsx", "packages/app/studio/src/ui/browse/BrowseScope.tsx", "packages/app/studio/src/ui/tour/TourSteps.ts:49-62", "packages/app/studio/src/ui/workspace/Default.ts:6-13"]
    live: "A vertical 'Browser' tab sits on the left edge, the empty timeline says 'Drop instruments or samples here'."
  - id: sample_audition
    tag: borrow
    fact: "Samples in the list audition on double click with buffering, playing and error visual states; starting a drag ejects any audition."
    src: ["packages/app/studio/src/ui/browse/SampleView.tsx:80-90"]
  - id: presets_scope_cloud_user
    tag: borrow
    fact: "Presets cover single device, effect chain and a whole channel (rack). Stock ones come from the cloud, user ones live on the device. A folder icon on every device header opens a list with user presets on top and stock ones below. Saving asks for name, description and comma separated tags."
    src: ["packages/app/manual/public/presets.md:3-40", "packages/app/manual/public/device-browser.md:39-58"]
  - id: spotlight_command_palette
    tag: borrow
    fact: "A command line opened by Shift+Enter or Cmd+F creates devices and presets, opens projects, goes to screens and creates sample tracks. Verb symbols (plus, slash, at, tilde) limit the search; matching is by word start; most used entries rank first; unavailable entries are greyed with a reason; the box is draggable and remembers where it was."
    src: ["packages/app/manual/public/spotlight.md:3-60", "plans/spotlight.md:1-30", "packages/app/studio/src/ui/spotlight/SpotlightVerbs.ts"]
    live: "Shift+Enter opened a floating input 'Type a device, preset, script, sample or place...' with a legend: + create, / open, @ goto, ~ sample, and a help icon."
  - id: dashboard_as_library
    tag: borrow
    fact: "The dashboard is a hidden screen. Left side has big actions (New Project, New Live Room, Open Bundle, Neural Demux). Below are tabs Projects, Templates, Demos, Samples, Soundfonts, WebCLAP with a search box. Right side links to preferences, manuals, scripting docs, bug report, feature request and cloud backup buttons."
    src: ["packages/app/studio/src/ui/dashboard/ActionButtons.tsx:15-35", "packages/app/studio/src/ui/dashboard/Resources.tsx:60-72", "packages/app/studio/src/ui/workspace/Default.ts:55-68"]
    live: "Dashboard matched this list. Empty project tab says 'No projects yet. Start with a demo project.'"
  - id: local_first_storage
    tag: rethink
    fact: "Projects, samples and soundfonts live in the browser private file system. Saved projects show in the Projects tab to reopen, rename or delete. Save As and Save as Template exist. Cloud backup to the user's own Drive, Dropbox or Nextcloud is optional and goes straight from the browser. A bundle file carries a project with all its samples."
    src: ["packages/app/manual/public/project-management.md:5-26", "packages/app/studio/src/ui/dashboard/Backup.tsx:20-35"]
    live: "openDAW menu lists New, Open, Save, Save As, Save as Template, Save Bundle File to Disk, Open Bundle File from Disk, Import, Export, Backup, Nextcloud. Footer shows Storage usage."
  - id: demo_projects_install_flow
    tag: borrow
    fact: "Demo projects are a curated id list fetched from a server and shown as cards with title, artist and tags. Opening one asks for approval to install it, and first asks to approve losing unsaved changes."
    src: ["packages/app/studio/src/ui/dashboard/DemoProjectsList.tsx:23-50", "packages/app/studio/src/ui/dashboard/DemoProject.tsx:19-37"]

transport_and_tempo:
  - id: header_transport_cluster
