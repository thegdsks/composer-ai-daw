    - "What the add effect flow looks like. The device chain showed small round plus buttons at both ends rather than an Add Effect label at 1600x900; the code file AddEffectButton.tsx exists with an 'Add Effect' label, its use site was not traced."
    - "Whether the faded round icon at the left of the MIDI button in the header is the capture MIDI button; not clicked."
    - "Why the arrangement panel disappeared in the 1280x577 viewport (likely minimum size and flex rules; the layout code was not traced further)."

