# FROZEN 2026-11-23: the queue is frozen with the experimental release. Statuses are truthful; todo and running items are not planned unless the project resumes.
# Task queue. Orchestrator (/tick) is the only writer of status. Workers report; they do not edit this file.
# status: todo | running | review | done | blocked
# ready = status todo, all `needs` done, no accepted decision missing (`decides`).
limits:
  max_parallel: 4
  max_attempts: 2
milestones:
  - id: M1
    title: Viewable and playable web app (open in a browser, add notes, hear sound, undo)
    done_when: [T14]
    notify_user: true
    reached: 2026-11-23 (T14 merged and verified; owner informed)
    priority: raise tasks on the path to M1 (T03, T04, T06, T08, T11, T14) above everything else
