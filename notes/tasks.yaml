  file: notes/ui-plan.yaml
  tasks: U01 to U30 in 4 waves, each with needs, brief and exit criteria; external deps T19 T20 T21 T21a T22 T23
  rule: "run U tasks in wave order and in parallel (max_parallel) the same way as T tasks; a U task is ready when its needs are done; mark status in notes/ui-plan.yaml waves or copy ids into this list as they start; do not duplicate T20 to T23"
  decisions: D20 to D33 are additive command API gaps listed in the plan, accept each in notes/decisions.yaml before the task that needs it
