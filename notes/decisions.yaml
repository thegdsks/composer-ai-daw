  - id: D40
    topic: audio clips in the model and three additive commands (T23)
    status: accepted
    accepted_by: "orchestrator, in the T23 task message"
    summary: "RegionContent gains a second audio form next to the old placeholder: Clip {asset, offset, gain}. asset is the SHA-256 of the audio file as 64 lowercase hex digits (D13: assets are referenced by content hash, bytes live outside the project file), offset is the first source frame played (0..=MAX_CLIP_OFFSET, 2^44), gain is permille 0..=MAX_VOLUME (1000 is unity). The region keeps start and length in ticks, so a clip plays from its start for length ticks of tempo map time and then stops; no time stretch, no loop (loop_length must be 0 for audio). RegionKind::Audio covers both forms; the unit Audio placeholder stays valid so existing files load. Commands (additive, no existing signature changed): add_audio_clip {id, track, start, length, asset, offset?, gain?} (audio tracks only), set_clip_gain {region, gain}, set_clip_offset {region, offset}. Each plans one Change (NewRegion, or Set ClipGain or ClipOffset), so one undo step and an exact inverse. move_region, resize_region, delete_region, move_region_to_track and duplicate_region work on clips; split_region on a clip is refused (the split offset needs the sample rate, so it is left for a later decision). The model checks only the shape of the hash; whether the hash names a known asset is a session and file level fact (the project does not hold the asset table): composer-format read_project fails with DanglingReference when a clip names a hash missing from the asset table, and the daemon checks the table before applying add_audio_clip."
