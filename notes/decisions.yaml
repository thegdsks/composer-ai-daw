# status: proposed | accepted | rejected. Agents may only treat accepted items as fixed.
decisions:
  - id: D1
    topic: product shape
    options: [A build on openDAW, B own engine, C beginner layer over any DAW]
    status: accepted
    chosen: "B own core and engine, openDAW and others as read-only references, C style beginner flow as the UX goal"
    accepted_by: "orchestrator on the standing instruction to take recommended calls, owner may overturn"
    note: recommendation is own core with openDAW as reference (B), C-style beginner workflow as the UX goal
  - id: D2
    topic: licence
    status: accepted
    chosen: "AGPL-3.0-only"
    decided: 2026-11-23
    note: "Open source release under AGPL-3.0-only (LICENSE at the repo root). Status of the project: experimental, released as is. Earlier text said open or closed undecided."
    interim_rule: agents read references freely and write our own code from notes (CLAUDE.md, Reference code rule); no verbatim copying, no stripping licences from references
    paths: [AGPL product with direct reuse, commercial licence from the author, clean reimplementation]
  - id: D3
    topic: core language
    proposal: Rust core, native plus WASM, one command API
    status: accepted
  - id: D4
    topic: delivery
    proposal: web first with three tiers (browser PWA, Tauri shell, local composerd daemon for native plugins and low latency); see notes/web-limits.yaml
    status: accepted
  - id: D5
    topic: AI control
    proposal: every action is a serializable command; CLI and MCP are thin clients
    status: accepted
  - id: D6
    topic: plugin formats
    proposal: CLAP first, VST3 after a licence decision, SF2 SFZ WAV MIDI built in
    status: accepted
  - id: D7
    topic: sound content
    proposal: curated built-in instruments plus a sample importer; no Splice API assumed
    status: accepted
  - id: D8
    topic: project and interchange format
    proposal: own format plus dawproject and MIDI in and out
    status: accepted
  - id: D9
    topic: command API v0 baseline (core/commands)
    status: accepted
    summary: 19 semantic commands (project, track, region, note), JSON tagged "command", plan() then apply, undo with groups, state_hash u64, describe() for clients; ticks i64 at 960 per quarter, ids u128 as 32 hex digits supplied by caller
    inspired_by: ref-opendaw (invertible update stream plus checksum), ref-ardour (avoid mutate-then-record undo)
    rule: signature changes after this need a new decision entry; additive commands are fine
    resolved_by_T04b: [notes must lie inside their region, regions may overlap on a track, ranges enforced in plan and apply, id index added, move_region_to_track added (additive)]
    open_points: [Project.tracks is still pub so direct edits need reindex(), duplicate ids on load are not rejected (add a fail-closed load check), shrinking a region scans its notes]
  - id: D10
    topic: composerd v0 behavior
    status: accepted
    summary: JSON-RPC 2.0 over stdio and localhost WebSocket; token pairing, Origin allowlist, Host check; one global edit order; state.changed pushed to subscribed clients
    open_points: [generated token printed once to stderr (alternative: 0600 file or Tauri handoff), empty Origin allowlist refuses browsers, clients subscribed by default, no batch requests, no save or load or export or render or selection methods yet]
    note: parity gaps are tracked as commands via D9 additions, never as daemon only features
  - id: D11
    topic: web UI stack
    status: accepted
    proposal: Vite, TypeScript, React, Tailwind only; canvas rendering for piano roll and timeline outside React state; one Backend interface with two implementations (daemon WebSocket, in-browser WASM editor)
  - id: D12
    topic: wasm engine blob v1
    status: accepted
    summary: header CMPW v1 (32 bytes), 12 byte tracks (waveform, gain, pan), 16 byte events; plain C ABI, unsafe only in composer-wasm ffi; live queue of 256 preallocated events
    open_points: [sampler and SF2 data placement (blob v2 or separate buffers), edition 2024 needs unsafe(no_mangle)]
  - id: D13
    topic: project file format v0 (core/composer-format)
    status: accepted
    summary: manifest first, 16 byte header, 72 byte section table with per section SHA-256, sections proj asst meta as JSON, assets referenced by content hash not embedded, fail closed with stable error codes, migration chain machinery present and empty
    inspired_by: ref-opendaw project_format (content addressed assets, manifest first); ref-ardour persistence (whole file rewrite on every save is the thing to avoid)
    open_points: [public Project::validate (T05b), audio region asset reference, manifest at fixed or tail location needed for in place incremental saves in v1, per track section split]
  - id: D14
    topic: track mix state in the model (T17 parity)
    status: accepted
    summary: Track gets a mix field (volume permille 0..2000 with 1000 unity, pan permille -1000..1000, mute, solo). Defaults are skipped when serializing and when hashing, so existing project files and state_hash values are unchanged. One new FieldKey (track_mix) and FieldValue (mix) carry the edit, so it is invertible like every other Set. Four additive commands set_track_volume, set_track_pan, set_track_mute, set_track_solo.
    rule: additive only (D9); no existing command or Change wire shape changes
    open_points: [integer permille instead of dB or floats keeps the model free of floats, solo semantics (any solo silences non solo tracks) are applied by render not by the model, master bus level is not modelled yet]
  - id: D15
    topic: bulk and clip editing commands (T17 parity)
    status: accepted
    summary: Additive commands add_notes (bulk), split_region, duplicate_region, transpose_notes, quantize_notes. Ids for anything new are supplied by the caller (D9), so split_region takes a right clip id plus one id per note that crosses the cut, and duplicate_region takes a clip id plus one id per copied note. Each plans to ordinary Change records, so undo is one step and dry run works unchanged. Bulk size is capped by a const in composer-commands (MAX_BULK_NOTES) and by the daemon message size limit from env.
    rule: additive only (D9)
    open_points: [quantize uses integer math with strength 0..100 and truncates toward zero, quantize clamps a note that would end past its clip to stay inside, notes can only be selected by id list or all notes of one clip]
  - id: D16
    topic: composerd file methods (T17 parity)
    status: accepted
    summary: "Daemon methods project.save, project.load, export.midi, import.midi, render.wav. All bytes logic stays in composer-format, composer-midi and composer-render; the daemon only does I/O. Paths are relative names resolved inside one base directory (COMPOSERD_FILES_DIR, default the working directory at start): no absolute paths, no .. components, no symlink escape, fixed extension per method, refuse to overwrite unless overwrite is true, write via temp file and rename, reads capped by COMPOSERD_MAX_FILE_BYTES. Every method takes dry_run and reports what it would do without touching the disk."
    note: project.load replaces the session and clears undo history, like session.new
    open_points: [project file extension is .cmpf until a product decision, render is synchronous inside the session lock and capped by COMPOSERD_MAX_RENDER_SECONDS, assets are not saved yet because audio regions have no asset reference]
  - id: D17
    topic: read methods for AI clients (T17 parity)
    status: accepted
    summary: project.tree (compact read, no notes unless asked), selection.get and selection.set (session state, ids validated against the project, stale ids pruned on read, not undoable and not part of state_hash), transport.get and transport.set (playhead tick as session state, seconds computed from the tempo map in composer-engine), meters.measure (offline render then peak and rms per track and master, from composer-render), sounds.list (catalogue from composer-catalogue).
    note: there is no realtime audio device in the daemon, so transport.get reports playing false and meters are measured offline; live meters need the Tauri shell or the browser engine
    open_points: [transport play and stop have no meaning until a realtime engine host exists, selection is global to the session not per client]
  - id: D18
    topic: sound catalogue reader (core/composer-catalogue)
    status: accepted
    summary: New crate with a small reader for the flat sounds/catalogue.yaml shape (list of entries, scalar fields only) so no YAML dependency is added. Unknown fields are kept out, unreadable files fail closed with a stable code. Path comes from COMPOSERD_SOUNDS_FILE.
    open_points: [switch to a real YAML crate if the catalogue grows nested fields]
  - id: D19
    topic: channel mix in the browser engine (blob v2)
    status: proposed
    summary: Blob v2 grows the track record to 16 bytes (waveform, flags bit0 mute bit1 solo, u16 volume permille, f32 gain, f32 pan, i16 pan permille, 2 zero bytes). v1 blobs still decode with the default mix. Mute, solo and the permille to gain and pan conversion live once in composer-engine (resolve_mix, any_solo) and are used by composer-render and by the wasm Session, so there is no second copy of the mixing logic. The blob carries raw mix state and the session resolves solo across tracks. Decode fails closed (BlobError::Mix) on out of range volume or pan.
    rule: demo hash 0x9234f99f24d6c39d unchanged for default mix; wasm path and offline render are compared bit for bit in composer-wasm/tests/mix.rs
    inspired_by: D14 (mix state and solo semantics), D12 (blob layout)
    open_points: [mix changes still need a new blob (a live mix update call would let the worklet avoid a rebuild), master bus level not modelled]
  - id: D34
    topic: sampler instruments, SF2 and SFZ playback, and where sample data lives in the browser blob (T21a)
    status: proposed
    summary: "composer-engine gets an in-memory SampleBank (samples plus zones with key range, velocity range, root key, cents tuning, loop mode and points, amp envelope, gain, pan) and InstrumentDef::Bank. Up to MAX_LAYERS (4) matching zones in zone order sound together per note on (stereo pairs stack, they share one voice age so a note off releases them together); pitch comes from resampling with linear interpolation, ratio from add and multiply only math so native and wasm match bit for bit. New crate composer-sampler (host side only, not linked into wasm) reads SF2 and SFZ plus WAV into a SampleBank, fail closed with size caps from env (COMPOSER_SAMPLER_MAX_FILE_BYTES, _MAX_SAMPLE_FRAMES, _MAX_TOTAL_FRAMES, _MAX_ZONES). The offline render takes banks through RenderSettings.instruments (no signature change). Browser: sample data lives INSIDE the blob. Blob v3 = v2 plus a bank section after the events; the last two zero bytes of a track record become a u16 bank index plus one (0 means synth). The blob is written as v3 only when a bank is used, otherwise v2 bytes are unchanged. Bank section stores f32 frames so the browser plays exactly the bits the offline render plays."
    rule: demo hash 0x9234f99f24d6c39d and default render hashes unchanged (no bank means no new code path taken); decode validates every count against the remaining blob length before allocating, so the host blob size cap is the only cap the wasm side needs; wasm session and offline render of the same bank are compared bit for bit in composer-wasm/tests/bank.rs
    inspired_by: "public SF2 2.04 and SFZ format specifications (notes/ref-sampler-formats.yaml); D12 and D19 (blob layout); engine voice pool design already in composer-engine"
    sound_reference_point: "D29 set_track_sound {track, sound} will resolve a catalogue sound id to an Id in Track.instrument; that Id is the single join point. Render takes banks by that Id through RenderSettings.instruments and the blob compiler takes them through compile_project_with_banks(banks: Id to Arc<SampleBank>). Nothing in the sampler knows catalogue ids, so D29 only has to fill those two maps (load the sf2 or sfz named by the catalogue entry with composer-sampler, key it by the track instrument Id)."
    open_points: ["one blob copy of all sample data is simple but doubles memory in the worklet (blob bytes plus decoded Vec); separate transferable buffers or i16 packing is the next step for big packs", "a sampler preset change needs a new blob (same limit as D19 mix)", "at most 4 stacked zones per note, no round robin, no crossfades", "linear interpolation only, no filter, no LFO, no modulators", "SFZ and SF2 sample streaming from disk is not designed yet, whole packs load into memory"]
  - id: D29
    topic: track sound reference and eight built in voices (U06)
    status: accepted
    summary: "Track gets an optional sound field: the catalogue sound id as text (1 to 64 chars of a to z, 0 to 9 and hyphen). It is skipped in JSON and in the state hash while None, so existing files and state_hash values (demo 0x9234f99f24d6c39d) do not change. One new FieldKey (track_sound) and FieldValue (sound) carry the edit so it is invertible, and one additive command set_track_sound {track, sound: text or null}, instrument tracks only. The command checks the shape of the id, not that the catalogue knows it (the model has no catalogue). Eight built in voices are generated in code by composer-engine (soft piano, warm pad, warm strings, pluck, sub bass, choir pad, bell, soft pulse), listed in sounds/catalogue.yaml as kind builtin with ids builtin-soft-piano, builtin-warm-pad, builtin-warm-strings, builtin-pluck, builtin-sub-bass, builtin-choir-pad, builtin-bell, builtin-soft-pulse. Resolution: offline render and the blob compiler look at Track.sound first, and a built in id selects the voice (blob waveform byte 2 to 9, bytes 0 and 1 stay sine and saw, blob version unchanged). Any other sound id is ignored by the engine and the track falls back to Track.instrument as before (D34 bank path). Voices use only add, multiply, divide and the existing sin_turns, so native and wasm match bit for bit."
    rule: additive only (D9); no existing command or Change wire shape changes; demo hash 0x9234f99f24d6c39d unchanged because the default voice is unchanged; native render and the wasm session of every voice are compared bit for bit in composer-wasm/tests/voices.rs; Engine::process stays allocation free for every voice (composer-engine/tests/no_alloc.rs)
    inspired_by: "textbook DSP only (polynomial band limited step, state variable filter, additive partials with per partial decay); no reference DAW code, presets or assets read or copied"
    open_points: ["a Track.sound that names a sample pack (not built in) is not resolved by the engine: the host (U07) still has to load the bank and key it by Track.instrument", "voices were not auditioned by ear, the owner listening check is outstanding", "no sound.preview or live audition call yet (D32)"]
  - id: D21
    topic: transport session state, loop, metronome and count in (U09)
    status: accepted
    summary: "transport.get and transport.set gain loop {on, start, end}, metronome {on}, count_in_bars and follow. transport.set fields are all optional and merge onto the current value (at least one is required); loop is validated (ticks 0..=MAX_TICK, start before end when on), count_in_bars is capped by COMPOSERD_MAX_COUNT_IN_BARS in the daemon and by composer_format::DEFAULT_MAX_COUNT_IN_BARS in the wasm editor. Values live in the optional meta.transport of the project file (D13), skipped when default, so files without them load and hash as before. They are session state: not undoable, never part of state_hash. The wasm editor implements transport.get and transport.set (playhead included) with the same shapes through ed_transport_get_json and ed_transport_set_json."
    rule: "state_hash unchanged by any transport.set; project.save writes meta.transport only when not default; project.load and session.new replace the daemon prefs with the file value or the default; wasm load resets to default."
    inspired_by: "D17 (transport.get and transport.set playhead), D13 (meta section)"
    open_points: ["playing stays false until a realtime host exists (D17)", "the browser has no project file yet, so wasm prefs are not persisted", "the wasm count in limit is the format default, there is no env in a page"]
  - id: D20
    topic: history read, step jumps and source tags (U20)
    status: proposed
    summary: "Editor keeps a source tag (user, ai, template, recipe) and a command count on every undo step. history.get {limit, offset} returns entries {index, label, source, command_count} oldest first (applied steps, then undone steps in redo order), the cursor (count of applied steps) and total; limit is capped by COMPOSERD_MAX_HISTORY_PAGE (daemon) and DEFAULT_MAX_HISTORY_PAGE (wasm). undo and redo take optional steps (default 1, at least 1, at most the available depth, reports steps_applied). command.group and group.begin take an optional source (default user). Source is not part of state_hash or the project file. No command signature changes: Command is untouched, Editor gains additive methods."
    rule: "state_hash after undo steps N equals the hash recorded after the matching edit; replay script history_steps.jsonl covers undo steps 3"
    inspired_by: "ui-plan interaction_specs undo_history (R01 lesson on step jumps); own Editor undo and redo stacks"
    flagged_for_orchestrator: "proposed, accept before U21 and U25 build on it"
  - id: D32
    topic: open groups for trials and live gestures (U20)
    status: proposed
    summary: "group.begin {label, source} returns a token (32 hex digits), group.commit {token} and group.rollback {token} close it. Commands applied while open take effect live and join the group; one open group per session. The daemon rolls the group back when the owning client disconnects or after COMPOSERD_GROUP_TIMEOUT_MS (default 30000), checked on every request; the wasm session has no clock, so the browser client owns the timeout and calls rollback. undo, redo, session.new and project.load while a group is open are rejected (group_already_open) except session replacement, which drops the group. Wrong token is rejected with group_token_mismatch."
    rule: "rollback restores state_hash exactly; commit adds one step; an empty group adds no step"
    inspired_by: "existing Editor::begin_group, commit_group, rollback_group (no new core logic)"
    flagged_for_orchestrator: "proposed"
  - id: D33
    topic: describe metadata and commands.enabled (U20)
    status: proposed
    summary: "commands.describe entries gain verb (add, change, remove, go_to, suggest), label (plain words), keywords (list) from a static table in composer-commands, merged by describe_json() so CommandInfo and describe() keep their signatures. Default shortcut ids are left out until the UI owns a keymap. commands.enabled {context} (context optional: track, region ids) returns per command {name, enabled, reason} computed from the project only, no change to it; reason is a plain sentence when disabled."
    rule: "every described command has verb, label and a non-empty keywords list; a command reported enabled is not rejected for a missing target"
    inspired_by: "ui-plan command_api_gaps D33"
    flagged_for_orchestrator: "proposed"
    open_points_u20: "the wasm editor session does not yet expose history.get, undo and redo steps, group.begin, commit, rollback, commands.enabled or the describe metadata (needs core/composer-wasm/src/editor_session.rs, outside the U20 file list); the daemon, MCP and CLI parts are done"
  - id: D23
    topic: project key and scale tables (U12, part 1)
    status: accepted
    accepted_by: "orchestrator, in the U12 task message"
    summary: "TempoMap gains an optional keys map (tick to {root 0..11, scale}), serialized as keys only when not empty, so existing files and state_hash values are unchanged (the hash adds the keys only when present). New commands set_key {tick, root, scale} and remove_key {tick} (tick 0 may be removed because a project may have no key; default is no key, shown as 'Not sure'), each plans one Change::SetKey with an inverse. Scales: major, minor, dorian, mixolydian, pentatonic_major, pentatonic_minor, harmonic_minor, kept in the new core/composer-theory crate (pure tables and membership). The wasm editor exposes ed_scale_json {root, scale} returning the scale pitch classes in degree order. theory.chords and conform_notes_to_scale are part 2 and not in this entry."
    rule: "Adding set_key and remove_key is additive: no existing Command, Change or wire shape changes; validate rejects a key with root above 11 or a tick outside 0..=MAX_TICK"
    inspired_by: "own TempoMap entries (SetTempo, SetMeter pattern); ui-plan command_api_gaps D23"
    open_points: ["theory.chords and conform_notes_to_scale (U13 part 2)", "the engine ignores keys, they only drive the UI and later helpers"]
  - id: D22
    topic: bulk note edits (U16)
    status: accepted
    accepted_by: "orchestrator, in the U16 task message"
    summary: "Four additive commands that act on an explicit non empty id list of one midi clip: move_notes {region, notes, delta_tick, delta_pitch}, resize_notes {region, notes, delta}, set_notes_velocity {region, notes, value or ramp {from, to}} (exactly one of value and ramp; a ramp interpolates by note start between the earliest and latest picked start, integer math truncating toward zero, and gives every note from when all starts are equal), delete_notes {region, notes}. Each plans to ordinary Change records (Set or DeleteNote), so undo is one step and dry run works unchanged. The list is capped by MAX_BULK_NOTES (D15), unknown or repeated ids and empty lists are rejected, and the whole command is rejected when any note would leave the clip, the pitch range or the duration range (no partial effect)."
    rule: "additive only (D9): no existing Command, Change, wire shape or state_hash value changes"
    inspired_by: "own TransposeNotes and QuantizeNotes plans (D15); ui-plan command_api_gaps D22"
    open_points: ["notes are picked by id list only; an all notes shortcut is not offered (use transpose_notes or quantize_notes for that)"]
  - id: D25
    topic: incremental change feed and client mirror (U22)
    status: accepted
    accepted_by: "orchestrator, in the U22 task message"
    summary: "Editor gains additive track_changes(bool) and take_journal(): every applied Change (edits, undo and redo inverses, group rollbacks) in order, off by default. composerd and the wasm editor seal one feed per request: {base_hash, hash, list} where list is the primitive Change records (serde shape of composer-model Change), or {base_hash, hash, full: true} when the session was replaced or the list exceeds COMPOSERD_MAX_FEED_CHANGES (daemon, default 5000) or the max given to ed_set_feed (wasm, VITE_MAX_FEED_CHANGES). command.apply, command.group, undo and redo take an optional changes: true and then add a changes object to the result; without it replies are byte for byte unchanged. state.changed params gain changes (the same feed) for every push, also for group rollbacks by timeout or disconnect. New daemon method changes.since {hash} joins the logged feeds after that state (COMPOSERD_FEED_HISTORY, default 64) and answers full when the hash is unknown, a replacement lies between, or the list is too large. The wasm editor gets ed_set_feed(handle, max_changes), 0 is off, results then always carry changes. MCP: optional changes flag on composer_group, composer_undo and composer_redo, new read tool composer_changes_since. TypeScript: ProjectMirror in web/app/src/backend/mirror.ts applies feeds."
    rule: "A client applies a feed only when its base_hash equals the hash the mirror stands at and the feed hash equals the hash the reply or push announced. Any other case (gap, full, a change whose recorded old value or target is missing) asks changes.since once when the backend has it, else fetches state.get in full. A delta is never applied onto a base that is not proven equal. A feed is applied to a draft and committed only if every change fits. Additive only: no existing method, wire shape or state_hash changes."
    inspired_by: "own Change records and Editor undo steps (no reference code); ui-plan command_api_gaps D25"
    open_points: ["the mirror proves the base by hash chain and checks the recorded old values of every Set, but does not recompute state_hash in TypeScript (would duplicate core/composer-model hash.rs); verifyEvery and verify() compare against a full fetch instead", "object key order inside the mirror follows application order, not the id order of a fresh state.get", "ProjectMirror is not yet wired into state/store.ts (outside the U22 worker file list)", "no CLI verb, use composer rpc changes.since or composer rpc command.apply with changes true"]
  - id: D23b
    topic: chords and conform to scale (U18, D23 part 2)
    status: accepted
    accepted_by: "orchestrator, in the U18 task message (D23 is accepted and names this as part 2)"
    summary: "One additive command conform_notes_to_scale {region, notes} (notes null means every note of the midi clip, like transpose_notes): each picked note whose pitch is not in the key in effect at its absolute start (region start plus note start) moves to the nearest in key pitch, the lower one on a tie, as ordinary Set NotePitch changes so undo is one step. Rejected when the project has no key, the clip is audio, or ids are unknown or repeated; a note with no key before it (first key starts later) and notes already in key are left alone. composer-theory gains pure helpers: chords(key, sevenths, octave) with plain names (C, Dm, Bdim, G7, Bm7b5), roman numerals, pitch classes and root position MIDI pitches, Chord.voicing(octave, inversion), degree_of, pitch_of_degree, nearest_in_key, note_name and key_root_name (flats for F, Bb, Eb, Ab, Db majors and relatives). Pentatonic keys use the chords of their parent major or minor scale. The wasm editor exposes ed_chords_json (theory.chords, params {key:{root,scale}} or flat {root,scale}, optional octave -1..8 default 4) returning triads and sevenths, and ed_pitch_json (theory.pitch {root,scale,pitch}) returning in_key, degree and nearest."
    rule: "additive only (D9): no existing Command, Change, wire shape or state_hash value changes; composer-commands gains a dependency on composer-theory"
    inspired_by: "own TransposeNotes plan (D15) and Key tables (D23); ui-plan command_api_gaps D23"
    open_points: ["daemon and MCP do not expose theory.chords yet (they get conform_notes_to_scale through the generic describe); needs daemon/composerd/src/methods.rs, outside the core lane", "chord quality names are English only"]
  - id: D26
    topic: master bus volume and one algorithmic reverb with a send per track (U28)
    status: accepted
    accepted_by: "owner, relayed by the orchestrator in the U28b task message"
    storage: "U28b: Project.master {volume 0..=2000, reverb_size 0..=1000 (default 500), reverb_mix 0..=1000 (default 0)} and Track.reverb_send 0..=1000, all permille integers. Wire fields master and reverb_send are skipped while default, and state_hash adds them (markers 0xF2, 0xF3) only when non default, so existing goldens and the demo hash are unchanged. FieldKey::Master and FieldKey::TrackReverbSend with FieldValue::Master and FieldValue::Permille carry the edits. Commands (additive, no existing signature changed): set_master_volume {volume}, set_master_reverb {size, mix}, set_track_reverb_send {track, send}; each plans at most one Change::Set, so one undo step and an exact inverse. Out of range is rejected by the command and by Project::validate (rule bus_range). Engine converts permille to f32 by one division (master_from_project, send_from_project); RenderSettings::with_project_mix and compile_project now read the bus from the project, so edits sound offline and in the browser blob."
    summary: "composer-engine mix.rs gets MasterBus {volume 0..=2 linear, reverb_size 0..=1, reverb_mix 0..=1} and a Reverb (4 damped feedback combs plus 2 allpasses per channel, mono input, left and right delay lengths offset for width, all buffers sized in Engine::new from the sample rate). Engine::set_master and Engine::set_send(track, send 0..=1) configure it after construction, so TrackSetup and EngineConfig keep their shape. Each frame: strip outputs are summed dry, strip output times send is added to the reverb input, master out = (dry + wet * reverb_mix) * volume. When reverb_mix is 0 the reverb is skipped, so default output is bit identical and costs nothing. Only add, multiply and compare are used, no libm, so native and wasm match bit for bit. Non finite or out of range parameters are clamped by MasterBus::new."
    rule: "no allocation in Engine::process (tests/no_alloc.rs runs with reverb on); demo hash 0x9234f99f24d6c39d and default render hashes unchanged; render uses RenderSettings.master and .sends, wasm uses blob v4, compared bit for bit in composer-wasm/tests/mix.rs"
    blob: "v4 = v3 layout plus, between the events and the bank section, a master section (f32 volume, f32 size, f32 mix, u32 zero) and track_count x u16 send permille; the bank section is always present in v4 (count may be 0). Written only when master is non default or any send is non zero; v1 to v3 blobs still decode with defaults. Out of range values fail closed (BlobError::Master). Version numbers: U06 (built in voices) added no blob version, it only widened the waveform byte to 0..=9, so v1 to v3 keep their meaning and v4 is free for this master section. A v4 blob also carries those waveform codes. Merge check: v1, v2, v3 (bank) and v4 all decode in composer-wasm tests."
    inspired_by: "classic Schroeder comb and allpass reverb structure (public domain DSP literature); D19 (mix resolution shared by render and wasm), D12 and D34 (blob layout)"
    open_points: ["reverb tail rings only as long as the render tail_seconds allows", "fixed damping, no pre delay, one room character", "editor_session.rs and ffi.rs expose no master or send getters yet (owned by another lane); the blob compile path already carries the values"]
  - id: D24
    topic: clip loop length and markers (U23)
    status: accepted
    accepted_by: "owner, relayed by the orchestrator in the U23 task message"
    summary: "Region gains loop_length (ticks, 0 means no loop). A midi clip with 0 < loop_length < length plays only the notes that start inside the first loop_length ticks, each cut at the loop end, and repeats that pass every loop_length ticks until the clip ends (the last pass is cut at the clip end). A loop of 0 or at least the clip length is the plain clip. Project gains markers (tick to name, at most 10000, name length as other names). Commands (additive, no existing signature changed): set_region_loop {region, loop_length} (midi clips only, 0 or at least a sixteenth note, 240 ticks), set_marker {tick, name} (adds or renames), remove_marker {tick}. Each plans one Change (Set RegionLoop, SetMarker) so undo is one step with an exact inverse. split_region rejects a looped clip (clear the loop first); duplicate_region keeps the loop."
    rule: "loop_length and markers are skipped in JSON while default and enter state_hash only when non default (markers 0xF5, loop 0xF4), so existing files, goldens and the demo hash 0x9234f99f24d6c39d are unchanged. Offline render and the browser blob both call compile_events, which expands the passes per tick (so tempo changes inside a clip are followed), so realtime equals offline bit for bit. Expansion is capped at MAX_LOOP_PASSES (100000) per clip."
    blob: "v5 = v4 layout (master section and bank section always present) plus after the bank section: u32 count, then per looped clip u32 track, u64 start_frame, u64 period_frames, u64 end_frame. Events stay expanded, so a reader may ignore the section. Written only when a clip loops; other projects keep v2 to v4 bytes. v1 to v4 still decode (existing blob tests). Bad track index, zero period or end before start fail closed (BlobError::Loop); a count larger than the bytes present is Truncated."
    inspired_by: "own SetKey and SetMeter entry pattern (D23), own D26 skip-default hashing; ui-plan U23 and finding F03"
    open_points: ["the blob does not store the loop as a compact repeat, events are expanded (a 60 minute project from one 8 bar clip renders at rtf 0.0004 in release)", "notes starting after the loop length are kept in the clip but are silent while the loop is on", "split_region on a looped clip is rejected rather than split into two loops", "editor_session.rs and ffi.rs expose no marker or loop getters yet (owned by U22 and U25)"]
  - id: D27
    topic: proposals channel for AI clients (U25)
    status: accepted
    accepted_by: "owner, relayed by the orchestrator in the U25 task message (D20, D32, D33 history, groups and source tags are merged)"
    summary: "An AI client posts a labelled command list; it changes nothing until a person accepts it. Methods: proposal.post {label, commands, note?, author?, dry_run?} plans the commands on a copy, so a list that cannot apply now is refused with the failing index; it stores the proposal with id p1, p2 and so on (a per session counter, deterministic for replays) and returns would_change, change_count, state_hash and state_hash_after. proposal.list {status?: pending (default), accepted, rejected, all} returns each proposal with its commands, base_hash, stale (project moved since posting) and, for pending ones, applies and change_count against the project as it is now. proposal.resolve {id, action: accept or reject, dry_run?}: accept applies the commands as one group with source ai and the proposal label (one undo step, one history entry), reject drops it. A pending proposal that no longer applies stays pending, the accept fails with the command error code and index and the project is untouched. Errors: proposal_not_found, proposal_resolved, proposal_too_large, proposals_full. State lives in the session, not in the project file and not in state_hash; session.new, project.load and wasm load clear it. The daemon pushes a proposals.changed {pending} notification to subscribed clients on post and resolve so a badge can refresh. Caps: COMPOSERD_MAX_PROPOSALS (pending, default 32; resolved history kept up to twice that) and COMPOSERD_MAX_PROPOSAL_COMMANDS (default 2000) in the daemon, DEFAULT_MAX_PROPOSALS and DEFAULT_MAX_PROPOSAL_COMMANDS in the wasm editor. The wasm editor exposes ed_proposal_post_json, ed_proposal_list_json and ed_proposal_resolve_json with the same shapes. MCP gets composer_propose and composer_proposals (read only) and deliberately no resolve tool: accepting is the person's act, so an agent cannot approve its own work. CLI gets composer propose LABEL JSON_ARRAY [--note] [--author], composer proposals [STATUS] and composer resolve ID accept|reject."
    rule: "additive only (D9): no Command, Change or wire shape changes; post and reject never change state_hash; accept adds exactly one history entry with source ai; the daemon and the wasm editor share one set of shapes (tests: composerd/tests/proposals.rs, composer-wasm/tests/proposals.rs, composer-cli/tests/scripts/proposals.jsonl, and the MCP parity test that posts through composer_propose and resolves through the daemon)"
    inspired_by: "D20 (source tags), D32 (groups), ui-plan command_api_gaps D27; own Editor::group_as"
    open_points: ["the daemon cannot tell an agent connection from a person connection, so proposal.resolve is reachable by any client of the daemon socket; the MCP server simply does not expose it (a per client role needs the auth work)", "the proposal store is duplicated in composerd and composer-wasm (about 150 lines each) because composer-commands is outside this lane; moving it into a core crate would remove the copy", "no expiry: proposals stay pending until resolved or the session is replaced"]
  - id: D35
