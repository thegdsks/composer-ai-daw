    status: accepted
    accepted_by: "owner, via the U40 task message ('start wiring the device list')"
    summary: "Model: Project.effects is a list of chains sorted by owner (Master, or Track {track}), never empty, skipped in JSON and in state_hash (tag 0xF7) while there is none, so goldens and the demo hash 0x9234f99f24d6c39d do not change. A chain is an ordered list of devices {id, kind, bypass (skipped while false), params}; params are i16 values in the order and ranges of EffectKind::params() (name, min, max, default; every range fits an i16 so automation can reuse them). Device ids live in the project id space (index Loc::Effect). Kinds and codes: stereo_tool 0, delay 1, crusher 2, gate 3, waveshaper 4, tidal 5. At most 16 devices per chain. New Changes (additive): InsertEffect, RemoveEffect, MoveEffect, SetEffectBypass, SetEffectParam, each with an exact inverse; DeleteTrack is refused by the model while the track has a chain, the delete_track command removes the devices first (last to first) so undo restores them in order. New rule effect_invalid. New commands (additive, describe and meta entries): add_effect {id, owner, kind, index?}, remove_effect {effect}, move_effect {effect, index}, set_effect_bypass {effect, bypass}, set_effect_param {effect, param (name), value}. add_effect refuses audio clip tracks (their clips are mixed outside the engine, see open points); the master and instrument tracks are accepted. Engine: enum dispatch (no dyn), per device state allocated in Engine::set_track_effects and set_master_effects (setup time), only add, multiply, divide, floor and the existing sin_turns in the audio path (same bits native and wasm), no allocation in process. A strip with a chain sums its voices first, runs the chain, then adds to the master sum and the reverb send (post chain); a strip without a chain keeps the old per voice summation, so existing renders keep their bits. The master chain runs after the reverb return and before the master volume. A bypassed device is skipped (bit identical to no device, state frozen). Devices: stereo_tool (volume, pan as balance, invert_left, invert_right, mono), delay (time_ms, feedback, filter, mix; stereo, integer frame time, one pole low pass in the feedback), crusher (bits, rate_reduction, mix), gate (threshold, attack_ms, release_ms; peak follower, hysteresis, smoothed gain), waveshaper (drive, shape between soft and hard clip, mix), tidal (rate_centihz, depth, shape, pan_depth; LFO volume and balance). Render and wasm: composer-render installs chains from the project; the wasm blob gets version 7 = v6 layout (loop and lane sections always present) plus an effects section: u32 chain_count, per chain u32 track (u32::MAX for the master), u32 effect_count, then per device a 20 byte record u8 kind, u8 bypass, u8 param_count, u8 zero, 8 x i16 params. Written only when the project has a chain, so every other project keeps its v2 to v6 bytes; all older versions decode."
    rule: "additive only (D9): no existing Command, Change, wire shape or state_hash value changes for a project without effects"
    inspired_by: "public DSP literature (bit and rate reduction, envelope gate, soft clip waveshaping, LFO tremolo and autopan, feedback delay), own D26 skip-default hashing, D36 lane pattern, D24 blob sections; the device list idea comes from the owner's goal. No reference repo code was read."
    open_points: ["automation of effect parameters (an AutomationTarget::EffectParam) is not done: it needs a range check against the device kind in SetAutomationPoint and a lane code in the blob, additive but left for wave B", "chains on audio clip tracks are refused: clips are mixed by the host outside the engine strips", "delay tempo sync and gate sidechain deferred", "param changes while playing need a new blob or Engine::set_effect_param (setup side, not yet exposed through ffi)"]
  - id: D46
    topic: "in-house web plugin host (WebCLAP, single .wclap file) (W01)"
    status: proposed
    accepted_by: "none: flagged for the owner. The owner decided to host web plugins in house; the design below is proposed"
    summary: "Host architecture: our own host loads one .wclap file (a 32-bit wasm CLAP module) and instantiates it inside the AudioWorklet next to the engine, as an insert after the master mix. Per 128 frame block the worklet copies the stereo mix into the plugin's own memory, calls the plugin process once, copies the result back. Param changes are timestamped events written into plugin memory at block start, sorted by (time, arrival number). Plugin facing surface is only its memory plus a WASI shim that implements random only; no host extensions are offered (no log, threads, timers, network, DOM)."
    determinism: "Plugin audio is NOT bit exact (the module may use floats, random_get and its own state). It is flagged nonDeterministic in the audio status and must be flagged in any render that includes it. The project, state_hash, goldens and the offline render never contain or depend on plugin output: the plugin is applied after the engine mix, in the realtime path only. Offline render with a plugin is out of the spike."
    file_travel: "The .wclap travels as an asset reference: content hash (SHA-256, D13 and D40 style) stored in the project, bytes beside the project in the asset store (D43). Size cap from env (VITE_WCLAP_MAX_FILE_BYTES, default 16 MiB). The hash of the file is part of the project, the plugin output is not."
    params: "Plugin params (id, name, min, max, default) are read from clap.params. Proposed: a set_plugin_param command (plugin instance, param id, value) so UI, CLI and MCP share one path, and a later automation target kind in the style of D36 (lane bound to a plugin param, values in the plugin's plain units, applied at control period boundaries as timestamped events). Not built: coordinate with the effect chain (U40) through this text only, no core files touched."
    state: "Plugin state is a blob saved through clap.state into the project (as an asset or an inline base64 field, size capped). Not in the spike (stateSupported is false). Restore calls state load before start_processing."
    threading: "Spike is single threaded inside the worklet. Plugins that need threads need SharedArrayBuffer and a main thread broker (an AudioWorklet cannot spawn workers); COOP and COEP are already on (T11). Refused for now: a plugin importing anything but one memory and WASI functions is rejected."
    security: "A plugin is untrusted code. Sandbox is wasm imports only: memory, plus WASI stubs that return not supported except random_get. No network, DOM or clock. Limits from env: file size, memory ceiling in pages (VITE_WCLAP_MAX_MEMORY_PAGES, declared minimum above it is refused, an imported memory is capped at the ceiling), events per block, CPU budget share and consecutive overrun count (VITE_WCLAP_BUDGET_SHARE, VITE_WCLAP_OVERRUN_LIMIT). A trap, a process error or repeated overruns bypass the plugin (audio passes through); Remove plugin in the Project menu is the kill switch. Known gap: an own (exported) memory cannot be capped after instantiation beyond its declared maximum, and a plugin that never returns blocks the audio thread (needs a worker plus shared buffer design to be killable)."
    licences: "WebCLAP spec repo and wclap-cpp are MIT; CLAP headers are MIT; the browser test host and wclap-js carry no licence file so they are treated as all rights reserved: read for behaviour only, nothing vendored. Our host is written from the CLAP ABI (MIT headers) and notes/ref-webclap.yaml. Struct layouts used are recorded in ref-webclap.yaml."
    inspired_by: "notes/ref-webclap.yaml (load sequence, memory import sizing, event ordering quirk, host callback table trick, arena lessons); D13, D36, D40, D43"
    open_points: ["one stereo in and out only, no sidechain or note ports", "worklet clock is coarse (Date), a short overrun can hide", "latency extension is read but plugin latency is not compensated in the transport", "plugin GUI (webview) not supported", "state, offline render, project asset storage and the set_plugin_param command are designs only", "real third party plugins are untested, only a generated fixture"]
  - id: D47
    topic: "edit cost independent of project size: segment table state hash cache (T29)"
    status: accepted
    accepted_by: "orchestrator, in the T29 task message"
    summary: "Measured first (target/release/edit_latency, native, 3 hash calls around one edit as the wasm editor does, median ms of add_note, load average 45): 1000 notes 0.119, 20000 notes 2.19, 150000 notes 44.7 (undo and redo the same). Cost is the full FNV walk in state_hash, repeated per call. Options: (a) combinable per note digest is impossible because state_hash is a sequential FNV-1a fold, so any order independent digest changes the value; (b) lazy hash alone does not help because every reply summary and every client store snapshot carries state_hash; (c) chosen, a hybrid that keeps the exact value: FNV-1a is almost affine. A step is h = (h xor b) * P and xor with a byte only touches the low 8 bits, which evolve independently of the high bits, so for a fixed byte string S of length n the map h to fold(S, h) equals pow * h + c[h mod 256] with pow = P^n and a 256 entry table c (c[l] = fold(S, l) - pow * l). Tables of consecutive segments apply to a concrete state in O(1), so the hash of the project is the result of walking the cached segments in order. Segments: header (everything before tracks, plus the track count), one per track head, one per region (region head plus the notes before the first boundary note), and one per run of notes that starts at a boundary note, where a note is a boundary when a fixed mix of its id has the low 6 bits clear (content defined, so an insert or delete moves no other boundary and a run has 64 notes on average; 8, 16 and 32 were slower because the walk dominates). Each segment keeps a memo (input state, output state) and builds its table only when it is valid but its input state changed; a segment dirtied by an edit is folded directly (one pass over its own bytes, no 256 fold) and stays table less until needed. Dirtiness comes from the applied Change records (new, delete, set, tempo, meter, key, marker, automation), noted in Editor after every project.apply including undo, redo, group rollbacks and the revert inside apply_all, so no command signature changes. Editor::state_hash(&self) returns the cached hash (RefCell, last value kept until the next change); Project::state_hash stays the from scratch reference and shares its byte writers with the cache so both produce the same stream. Cost per edit: one dirty run (about 64 notes) plus one table build per later dirty run plus a walk over the segments (tracks + regions + note runs, about n / 64), no per note work outside the touched run. After (same bench, ops 1000, median ms of add_note, undo, redo): 1000 notes 0.0057, 0.0025, 0.0024; 20000 notes 0.0357, 0.0066, 0.0064; 150000 notes 0.2725, 0.0454, 0.0426 (add_note was 0.119, 2.19 and 44.7 ms), a 160x gain at 150000. Not flat: 48x from 1000 to 150000 notes, from the region walk, so the claim is flat in notes per region and sub millisecond at 150000 notes, not constant. The first edit after a load costs 0.9, 8 and 39 ms (table builds, measured as first_edit_cold_ms)."
    rule: "state_hash values, summary shape, feed shape and every golden hash stay byte for byte as before (additive: Editor::state_hash is new, composer-commands signatures unchanged). The from scratch Project::state_hash is the oracle: a property test runs random command runs with undo, redo, groups and rollbacks and compares the cached hash with it after every step. Any Change variant the cache cannot map precisely must drop the whole cache, never guess."
    inspired_by: "own design from the structure of FNV-1a; no reference repo code was read. Content defined chunk boundaries are a standard technique."
    open_points: ["the first hash of a large project is one full pass, and the first edit near the front of a large project builds the tables of every later segment once (256 lanes each, measured 39 ms at 150000 notes, one time cost per project load)", "memory: about 2 KiB per segment that has a table (a segment gets one only after its input state changed)", "the walk is still O(regions + note runs), about 0.04 ms at 150000 notes; a track level table (compose region tables) would remove most of it, left for a later task", "Project.tracks is pub, so code that mutates a Project directly and bypasses Editor must not use Editor::state_hash"]
