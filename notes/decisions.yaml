  - id: D41
    topic: "bounded memory audio pipeline: composer-audio crate (T23)"
    status: accepted
    accepted_by: "orchestrator, in the T23 task message"
    summary: "New core crate composer-audio, host side only (std files, not used by the wasm session). (1) WavStream reads a WAV through Read and Seek without loading it: it walks the RIFF chunk headers (seeking over everything but fmt), validates PCM 8, 16, 24, 32 and float32 with 1 to COMPOSER_AUDIO_MAX_CHANNELS channels, and reads frames on request into f32 in caller sized chunks. A data size of 0 or 0xFFFFFFFF (writers that stream) means the rest of the file; a data chunk longer than the file is Truncated; frame count and byte size are checked against caps BEFORE any buffer is sized. No new dependencies: the decoder is our own, a second implementation next to composer-sampler's whole file decoder because that one holds the entire file in memory. (2) PeakCache: per block min and max as i16 over all channels at base block 256 frames and four further levels, each 4 times coarser (256, 1024, 4096, 16384, 65536 frames per block). Stored as a sidecar file named after the asset hash with a checked header (magic, version, frames, channels, level count) and an exact expected size, and rebuilt in one streaming pass when it is missing, the wrong size or fails the header check. A range query picks the coarsest level not coarser than the bin size and merges blocks; asks finer than the base level read the source for just that range (bounded by bins times base block). (3) Caps from env with defaults in code, in the sampler Limits style: COMPOSER_AUDIO_MAX_RESIDENT_BYTES (sum of decode chunk buffers alive at once in one render, default 64 MiB), COMPOSER_AUDIO_MAX_FILE_BYTES (default 16 GiB), COMPOSER_AUDIO_MAX_FRAMES (default 2^33), COMPOSER_AUDIO_MAX_CHANNELS (default 8), COMPOSER_AUDIO_MAX_PEAK_BINS (default 8192). (4) Traits AudioStream (info, read at a frame) and AudioProvider (open by hash, Debug, Send, Sync) are the seam between render and storage; DirStore implements the provider over a directory of <hash>.wav files and is the only file code. Fuzz safety: every prefix of valid files of each format is opened and read in tests with no panic, and header fields never size an allocation before the cap check."
    rule: "no unsafe, no panics on bad input (arithmetic on untrusted sizes is checked, u64 to usize through try_from), reads are sequential with at most one seek per chunk; none of this runs on an audio thread"
    inspired_by: "own composer-sampler wav.rs behaviour (formats accepted); D34 (size caps from env, fail closed); public RIFF WAVE and WAVE_FORMAT_EXTENSIBLE descriptions; no reference repo code was read for this task"
    open_points: ["only WAV in v0 (no FLAC, MP3, AAC, Ogg: each needs a licence and size review, the asset table already carries sample_rate and channels so adding a container later changes no file format)", "RF64 and W64 (files over 4 GiB) are refused with a clear code", "peak levels are i16 so values above full scale clip in the display only", "the sidecar has no signature, a tampered sidecar changes only the drawn waveform"]
  - id: D42
    topic: "offline render streams audio clips; Engine input hook (T23)"
    status: accepted
    accepted_by: "orchestrator, in the T23 task message"
    summary: "composer-render gains render_project_stream(project, settings, sink) that hands the output to the sink in blocks of at most 128 frames (interleaved stereo f32), and render_project becomes a collector on top of it, so the existing signature and bytes are unchanged. RenderSettings gains audio: Option<Arc<dyn AudioProvider>> and audio_limits (AudioLimits, default in code, the daemon and bench call from_env), both default off. For each Clip on a track the render computes start and end frames with the tempo clock, opens the asset lazily when the clip becomes active, reads it in chunks whose size is chosen so the chunks of all clips that overlap in time fit COMPOSER_AUDIO_MAX_RESIDENT_BYTES (minimum chunk 256 frames; a clip that cannot get a minimum chunk is skipped and reported), closes it at its end, converts sample rate by linear interpolation from an exact integer fraction (equal rates copy exactly), maps mono to both sides and the first two channels of wider files to left and right, scales by clip gain and the track strip (same pan law function as the engine, mute and solo through the existing mix) and hands the block to Engine::process_with, a new method that adds an external stereo block to the voice sum before the master volume and the clip counter. Engine::process is the same code with no input and adds nothing, so every render without audio is bit identical to before. Output length is the later of the last note off and the last clip end, plus the tail. Missing assets, decode errors and over budget clips never abort a render: the clip is silent and an AudioIssue (clip, code) is returned in Rendered.audio_issues, together with audio_resident_high_water (bytes of chunk buffers). Audio does not feed the reverb send in v0."
    rule: "determinism: offline output depends only on project, settings and asset bytes; chunk size changes (budget) must not change output bits, tested by rendering with two budgets and comparing; the realtime browser engine does not play clips (out of scope for T23), so there is nothing to compare against yet; proposed design for it: the worklet gets decoded chunks through a SharedArrayBuffer ring filled by the main thread, using the same chunk reader math and the same Engine::process_with"
    inspired_by: "own D26 mix chain and D24 clip expansion; bounded chunk streaming is a textbook disk streaming pattern, no reference repo code was read"
    open_points: ["browser playback of audio clips is not implemented (gap)", "audio tracks cannot use the reverb send yet", "no resampling filter better than linear (aliasing on large rate changes)", "no fades, so a clip that starts or ends mid waveform can click"]
  - id: D43
    topic: "daemon audio methods, asset store, MCP tools and CLI words (T23)"
    status: accepted
    accepted_by: "orchestrator, in the T23 task message"
    summary: "The session holds an AssetTable (composer-format) next to the project: not part of state_hash, not undoable, saved in the asst section by project.save and restored by project.load, cleared by session.new. Asset bytes live in <COMPOSERD_FILES_DIR>/assets/<hash>.wav (created on first import; names are built only from a validated 64 hex digit hash, so no client supplied path reaches that directory). Methods: audio.import {path, track?, start?, length?, id?, dry_run?} where path is a D16 relative name with extension wav inside the base directory (no absolute paths, no .., no symlink escape, size cap COMPOSER_AUDIO_MAX_FILE_BYTES): the file is hashed and copied with bounded buffers, its header checked, added to the asset table (importing the same bytes again returns the same asset), and when track is given one add_audio_clip is applied (start default 0, length default the file duration converted by the tempo map, id default random) as one undo step; the result gives asset {id, hash, name, sample_rate, channels, frames, seconds, bytes}, the clip id when placed, and the usual state fields. audio.assets {} lists the table with a present flag (is the file in the store) and the clips that use each asset. audio.peaks {asset (hash or asset id), from?, to?, bins?} returns {asset, from, to, bins, level_frames, min:[...], max:[...]} with floats in -1..1, bins capped by COMPOSER_AUDIO_MAX_PEAK_BINS, building the sidecar on first use. Errors: asset_not_found, asset_missing (in the table but the file is gone), audio_invalid (decoder code in the message), file_too_large, plus the D16 path codes. render.wav and meters.measure pass a DirStore provider, so clips are heard offline; render.wav keeps the COMPOSERD_MAX_RENDER_SECONDS cap. A dangling clip is refused: add_audio_clip through command.apply is checked against the asset table before it applies (error asset_not_found); project.load fails closed on a dangling clip through composer-format. MCP: composer_audio_import (writes, not idempotent), composer_audio_assets and composer_audio_peaks (read only). CLI: import-audio PATH [TRACK] [START], assets, peaks ASSET [FROM TO BINS]. The wasm editor is unchanged: it has no asset table and plays no audio."
    rule: "additive only (D9): no existing method, wire shape or state_hash value changes for a project without audio; the D16 rules apply to every path, the store directory is not reachable by name"
    inspired_by: "D13 (assets by hash), D16 (file safety), D17 (read methods), D28 (shared parse and report shapes)"
    open_points: ["assets are never garbage collected (a later asset.prune)", "audio.import copies the file, so a second copy exists on disk", "recording from a device is not part of this task", "TypeScript Backend methods for audio are not added (UI lane)"]
  - id: D44
    topic: "per track peaks and master soft clip (T27)"
    status: proposed
    accepted_by: "none: the per track peaks part is accepted by the orchestrator in the T27 task message; the always-on limiter part stays proposed, see rule"
    summary: "Engine::track_peaks() returns one f32 per track (larger of left and right absolute value over the last block, after fader, pan and automation, before reverb, master volume and clips), in blob track order, preallocated, no allocation in process. composer-wasm exports cw_track_peaks(handle, out_ptr, max_tracks) which copies up to max values and returns the track count. The worklet max-merges the peaks of the song and live engines per block and sends them as the optional trackPeaks field of the pos report (same cadence, VITE_POSITION_REPORT_FRAMES); the AudioEngine status exposes trackPeaks, and the Mix tab meter uses them when the report covers every project track, else keeps the old estimate (daemon-only case and older workers). Master limiter: Engine::set_ceiling(Option<f32>) and cw_set_ceiling(handle, f32) apply a transparent soft clip after the master volume: identity at or below the ceiling, then ceiling + room * t / (1 + t) with t = (abs - ceiling) / room, so the output stays below 1.0 and the curve is continuous with slope 1 at the ceiling. Plain f32 arithmetic, same code for offline render and wasm."
    rule: "the soft clip is OFF by default (ceiling None) because composer-render test overs_are_counted_not_clamped pins the plain sum contract (samples above 1.0, overs counted); turning it on by default changes that contract and every render of a loud project. The demo (hash 0x9234f99f24d6c39d) is below the ceiling and unchanged either way (determinism.mjs passes). To accept: owner decides the default ceiling (suggested DEFAULT_CEILING 0.99), the test above is rewritten, and the ceiling is passed through blob or render settings. Overs are counted before the clip."
    inspired_by: "D26 master bus chain, D36 deterministic control rate; no reference repo code was read"
    open_points: ["ceiling is not yet carried by the blob or RenderSettings, only by the setter and cw_set_ceiling", "a soft clip is not a look ahead limiter: sustained overs distort instead of ducking", "peaks are per block maxima merged by the worklet, not true peak (no oversampling)", "tracks beyond MAX_PEAK_TRACKS (1024) report no peak"]
