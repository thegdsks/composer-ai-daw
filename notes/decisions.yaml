  - id: D28
    topic: templates and recipes crate (U24)
    status: accepted
    accepted_by: "orchestrator, in the U24 task message"
    summary: "New core crate composer-recipes holds the bundled starter templates (templates/*.json, embedded at build time) and deterministic recipe generators. Methods, all additive: templates.list {} returns id, name, description, tempo, key, command_count and loop range per template; template.apply {template, seed?, dry_run?} resolves the $name placeholders to seeded ids that skip every id the project already uses, appends one set_key at tick 0 from the template key, and applies the list as one group labelled 'Template: NAME' with source template (a dry run returns the same report as recipe.plan); recipes.list {} describes each recipe with scope and typed parameters (min, max, default, choices); recipe.plan {recipe, params?, scope?, seed?} returns the command list without applying it, plus label, command_count, change_count, applies, state_hash and state_hash_after, and fails with the command error code and index when the list cannot apply now; recipe.apply {recipe, params?, scope?, seed?, dry_run?} applies the same list as one group with source recipe. scope is {track?, region?}. seed is a non negative integer, default 0. Recipes: extend_to_length {bars}, repeat_with_variation {copies, variation, root?, scale?}, bass_from_chords {style, window_beats, octave, into_track?}, pad_under_melody {bars_per_chord, octave, color, root?, scale?, into_track?}, soften_velocity {amount, ceiling}, calm_sections {minutes, tempo, mood, section_bars, root?, scale?}. A recipe reads the project and writes only ordinary commands, so a result replays command by command to the same state_hash, undoes in one step, and can be posted through proposal.post. Errors: invalid_params, unknown_template, unknown_recipe, no_target, no_key, nothing_to_do. Daemon and wasm editor share composer_recipes::api for parsing, planning, report and apply; MCP gets composer_templates_list, composer_template_apply, composer_recipes_list, composer_recipe_plan (read only) and composer_recipe_apply; the CLI gets templates, template, recipes, recipe and recipe-apply words; the wasm editor gets ed_templates_list_json, ed_template_apply_json, ed_recipes_list_json, ed_recipe_plan_json and ed_recipe_apply_json."
    rule: "additive only (D9): no Command, Change, existing method or wire shape changes; no state_hash value changes; recipe and template output is a pure function of project, params, scope and seed (no clocks, no OS randomness); music is generated from scale and chord tables, never quoted from a piece, preset or pack; planning allocates only on the control thread, nothing runs on the audio thread"
    inspired_by: "own Editor::group_as and D27 proposals (post commands as a list); D23 and D23b theory tables; templates from U03; ui-plan command_api_gaps D28. No reference repo code was read for this task"
    open_points: ["none of the recipe output is checked by ear", "recipes reason about the project key at the clip start only (no modulation inside a clip)", "bass_from_chords takes the lowest note of a window as the chord root, so inverted chords give a bass on the inversion", "calm_sections always adds new tracks, it does not extend an existing piece", "TypeScript Backend methods for these calls are not added in this task"]
  - id: D36
    topic: automation lanes (U37)
    status: accepted
    accepted_by: "owner, relayed by the orchestrator in the U37 task message (wire all the proposed components)"
    summary: "A project holds automation lanes, each a curve of points (tick to value and curve) bound to one target: master volume, track volume, track pan or track reverb send. Values are integers in the unit of the target (volume 0..2000 permille, pan -1000..1000, send 0..1000). A point's curve (hold, linear, smooth) says how the value travels to the next point; before the first point the first value applies and after the last point the value holds. A lane is created by its first point and dropped with its last; at most 10000 points per lane. Commands (additive, no existing signature changed): add_automation_point {target, tick, value, curve?}, move_automation_point {target, tick, new_tick, value} (keeps the curve, one undo step), set_automation_curve {target, tick, curve}, delete_automation_point {target, tick}, clear_automation_lane {target}. target is {kind: master_volume} or {kind: track_volume|track_pan|track_reverb_send, track}. One new Change, SetAutomationPoint {target, tick, old, new}, with its inverse. delete_track clears the lanes of the track in the same step first (the model refuses to delete a track that still owns lanes), so undo restores the track and then its lanes. Mute and solo still decide whether a track sounds; a volume lane replaces the static volume while it exists."
    rule: "lanes live in Project.automation (sorted by target), skipped in JSON while empty and hashed only when present (tag 0xF6), so existing files, goldens and the demo hash 0x9234f99f24d6c39d are unchanged. The engine re-reads every lane on frames that are a multiple of CONTROL_PERIOD (32) from the absolute frame counter, with plain f32 add, multiply and divide, so the value depends only on the frame and not on the host block size. Lanes are compiled to frames with the tempo map (compile_automation) and installed at setup (allocation), evaluation never allocates (tests/no_alloc.rs covers all curves). The offline render and the wasm session run the same Engine code, tested bit for bit at block sizes 128 and 37 over a two minute fade. Blob v6 = v5 layout (loop section always present) plus u32 lane count, then per lane u32 track (u32::MAX for master), u8 param, 3 zero bytes, f32 base, u32 points, then points of u64 frame, i16 value, u8 curve, 5 zero bytes; written only when the project has lanes, v1 to v5 still decode, counts are checked against the bytes left before allocation, a bad track, param, curve or unsorted frames fail closed (BlobError::Automation)."
    inspired_by: "own D26 skip-default hashing and D24 blob section pattern; ui-plan U37 and ui-components automation_lane_editor. No reference repo code was read for this task"
    open_points: ["a 32 frame control period steps the value every 0.67 ms at 48 kHz, fine for gain, pan and send but not for audio rate modulation", "only four targets; instrument and effect parameters need a later target kind", "values are in target units, not a normalized 0..1000, so the UI must scale per target", "editor_session.rs and ffi.rs expose no lane getters (read the lanes from the project JSON); daemon methods and MCP tools reach the commands through describe", "recording gestures into a lane (write mode) is not part of this decision"]
