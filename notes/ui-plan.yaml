# UI product plan for the composer web app (R03). Executable by parallel agents.
# Status: proposed. Gap entries become D20 to D31 in notes/decisions.yaml before any core change.
# This plan also serves as the T15 beginner flow design for the owner to react to.
meta:
  id: R03
  date: 2026-11-23
  author_lane: ui
  inputs:
    - CLAUDE.md
    - notes/handoff.yaml
    - notes/decisions.yaml (D9 to D19)
    - notes/tasks.yaml (T20, T21, T21a, T22, T23 queued by another session)
    - notes/ui-audit.yaml (F01 to F40, top_15_by_value_per_effort)
    - web/app/README.yaml and web/app/src
    - core/composer-commands/src/describe.rs (26 commands)
    - mcp/composer-mcp/src/tools.rs (26 command tools plus fixed tools)
    - notes/ref-opendaw-ui.yaml (R01, 25 lessons, folded in; see r01_folded_in)
  not_read: "No reference DAW UI code was read by this author; R01 facts come only from notes/ref-opendaw-ui.yaml."
  validity_rule: "Every U task lists needs (U ids only) and external_needs (T ids from notes/tasks.yaml). No other ids are referenced."

product_intent:
  summary: "A beginner first composer: get an idea out of your head onto the screen without confusion. Recreate a film or OST piece by ear, make cinematic music, make one hour of calm music for videos."
  owner_dislikes: [complex DAW chrome (Logic Pro, Cubase), stock sounding instruments]
  owner_likes: [Splice style sounds, fast smooth UI that scales, full AI control through the same command API]
  hard_constraint: "The UI never contains an edit that is not a command. CLI and MCP can do everything the UI can."

existing_code_to_reuse:
  - path: web/app/src/state/store.ts
    use: "Store, the single client of Backend; keep it, add the change feed mirror in U22"
  - path: web/app/src/state/commands.ts
    use: "pure command builders; every new gesture adds a builder here with a unit test"
  - path: web/app/src/state/actions.ts
    use: "Actions class; templates, clipboard and record land here as methods that emit one group"
  - path: web/app/src/backend/types.ts
    use: "Backend interface; transport, history, proposals and library methods are added here once, implemented by WasmBackend and DaemonBackend"
  - path: web/app/src/roll/RollController.ts
    use: "canvas input for the roll; drag commits one group on pointer up (keep this pattern everywhere)"
  - path: web/app/src/roll/ArrangementController.ts
    use: "arrangement canvas; region gestures extend it (T20 adds move and resize)"
  - path: web/app/src/roll/geometry.ts
    use: "hit testing and coordinate math; all new hit tests go here so vitest covers them"
  - path: web/app/src/ui/canvasHost.ts
    use: "dirty flag rAF loop; U27 splits it into layers, the API stays"
  - path: web/app/src/ui/palette.tsx
    use: "token probes so canvases share Tailwind tokens"
  - path: web/app/src/config.ts
    use: "every threshold from VITE_* env; all new numbers in this plan go here"
  - path: web/app/src/debug.ts
    use: "window.composerDebug; e2e scripts read it (U02 adds firstSoundMs, commandLog)"
  - path: web/app/src/index.css
    use: "Tailwind v4 @theme tokens with light-dark(); U01 extends, does not replace"
  - path: web/app/src/icons/index.tsx
    use: "@thesvg/ui-react plus local glyphs; new icons are added here only"
  - path: web/app/src/input/liveInput.ts
    use: "computer keyboard and Web MIDI; U14 records from it"
  - path: web/app/src/audio/offline.ts
    use: "offline WAV render; U29 moves it into a worker with progress"
  - path: sounds/catalogue.yaml
    use: "sound list for the picker (T21, U07)"

principles:
  - id: P1
    rule: "Every screen has one obvious next action, shown as the only filled button or the next action chip."
    test: "agent-browser snapshot of each screen state has exactly one element with data-primary=true"
  - id: P2
    rule: "Every edit is a command or a group of commands. Gestures preview locally and commit one group on release, so one gesture is one undo step."
    exempt: "view state (zoom, scroll, panel open), audition of a sound and live note playing; they change nothing saved"
    test: "e2e: every gesture script ends with undoDepth plus 1 and one undo restores the prior state_hash"
  - id: P3
    rule: "Sound within 10 seconds of opening the app, with at most 2 actions."
    test: "composerDebug.firstSoundMs under VITE_E2E_FIRST_SOUND_MS (default 10000) and actionsToFirstSound at most 2"
  - id: P4
    rule: "Plain words first: labels say what happens (Grid: eighth notes, Save to file, Loop this clip), jargon only in disclosed detail."
    test: "a lint list of banned visible labels (quantize, region, velocity, MIDI CC) checked in vitest against rendered chrome text; disclosed panels allowed"
  - id: P5
    rule: "Nothing is hidden behind a mode or a gesture. One smart pointer, no tool palette, and every gesture also has a visible button or menu item and a key (R01 lesson 16)."
    test: "no tool state in Store; vitest checks every gesture id in keymap.ts has a menu or button entry"
  - id: P6
    rule: "Big projects feel like small ones: a frame draws within VITE_FRAME_BUDGET_MS and an edit shows within VITE_INPUT_BUDGET_MS at the bench default size."
    test: "U27 stress e2e reads composerDebug draw stats at 300 tracks"
  - id: P7
    rule: "Everything is reachable by keyboard and every committed command is announced in plain words in a live region."
    test: "e2e keyboard only script completes hero flow F2; aria-live text matches the command label"
  - id: P8
    rule: "AI changes are visible before they land and are one undo step after."
    test: "proposal preview leaves state_hash unchanged; apply adds exactly one history entry with source ai"

personas:
  - id: mira
    who: "Beginner composer, 20s, laptop with headphones, Chrome. Hears film cues in her head, cannot read notation, tried Logic and gave up."
    goal: "Recreate the main motif of a film theme and then make her own cue in that style."
    fear: "Too many panels, sounds that sound like a toy."
  - id: dev
    who: "Video creator, no music theory, needs one hour of calm background music each week."
    goal: "Pick a mood, get a long calm track, export a WAV, done in 5 minutes."
    fear: "Learning anything, loops that sound obviously repeated."
  - id: agent
    who: "An AI agent (CLI or MCP) acting for Mira or Dev."
    goal: "Read the project, propose edits, have them shown and applied with undo."
    need: "Same commands and reads as the UI, compact summaries, proposals instead of silent edits."

hero_flows:
  - id: F1
    name: Recreate a piece by ear
    persona: mira
    steps:
      - "Start screen, choose 'Recreate a piece' (audio starts on this click, a soft piano and a click track play)"
      - "Tap tempo button 8 times along the reference playing in another tab; tempo is set (set_tempo)"
      - "Pick the key from the Key picker, or leave 'Not sure' (shows all rows)"
      - "Loop is on over bars 1 to 4 by default; press Record, count in 1 bar"
      - "Play the motif on the computer keyboard; on stop the notes land in the clip (one group)"
      - "Fix wrong notes by dragging; out of key rows are shaded"
      - "Copy bars 1 to 4 and paste at bar 5 (Ctrl C, click ruler at bar 5, Ctrl V)"
    target_actions_to_first_sound: 1
    target_seconds_to_first_sound: 5
    target_actions_to_first_4_bar_phrase: 15
    reference_audio_track: "covered by T23 (audio import) plus T22; until then the reference plays outside the app"
  - id: F2
    name: Make a cinematic cue
    persona: mira
    steps:
      - "Start screen, choose 'Cinematic idea' (template with strings pad, low piano, pulse, boom; plays at once, loop on)"
      - "Next action chip says 'Change the chords'; click a chord in the chord strip to replace bar 1"
      - "Open Sound tab, preview Strings, pick 'Warm strings' for track 1"
      - "Open Mix tab, lower the pulse, mute the boom"
      - "Repeat the 4 bar block 4 times (Repeat x N)"
      - "Export, WAV"
    target_actions_to_first_sound: 1
    target_seconds_to_first_sound: 8
    target_actions_to_export: 12
  - id: F3
    name: One hour of calm music
    persona: dev
    steps:
      - "Start screen, choose 'Calm hour' (plays at once)"
      - "Pick a mood (Warm, Night, Rain) and a key, or keep the default"
      - "Pick length 60 minutes; the recipe extends the piece with looping clips and sections (one undo step)"
      - "Preview by clicking sections on the ruler"
      - "Export WAV, progress with time left and cancel"
    target_actions_to_first_sound: 1
    target_seconds_to_first_sound: 8
    target_actions_to_export_start: 5
    render_budget: "60 minutes renders under COMPOSER_BENCH_MAX_RENDER_RTF times real time in the browser worker"

information_architecture:
  decision: "One workspace screen. Panels are a bottom dock with tabs, never floating windows. AI assist lives in the command palette, not in a side rail. Goal cards open as a non modal sheet over the workspace on first open."
  reason: "Beginners lose floating windows; one fixed layout makes screenshots, help text and agent-browser scripts stable, and the canvas area stays large."
  routes:
    - "#/start (goal sheet and project library, also reachable from the project name menu)"
    - "#/p/<project id> (workspace)"
  screens:
    - id: start
      purpose: "Pick a starting point and hear it at once, or reopen a project"
      first_open: "the workspace with the starter project sits behind a non modal sheet; primary button 'Play the starter' (audit good_to_keep instant start), goal cards secondary; Not now and Never show (R01 lessons 1, 25); returning users land on their last project"
      default_visible: [Play the starter (primary), three goal cards (Recreate a piece, Cinematic idea, Calm hour), Blank project link, recent projects (6)]
      disclosed: [all projects list with search, Open file (project or MIDI), connect to composerd]
      primary: the card under the pointer or first card when focused
      covered_by: "T22 executes this spec (U04)"
    - id: workspace_top_bar
      default_visible: [project name, Play, Stop, Record, Loop, Metronome, tempo, Key, position bars and beats, Undo, Redo, Export, help]
      disclosed: [time signature select, tap tempo, count in length, theme and density in settings, MIDI device]
    - id: arrangement
      purpose: "Clips on track lanes over time; the map of the song"
      default_visible: [track headers with name, sound, mute and solo, clip blocks with mini notes, ruler with loop brace and markers, playhead]
      disclosed: [track volume and pan (in Mix tab), track reorder handle on hover, section lane when markers exist]
    - id: dock_notes
      tab: Notes
      purpose: "Piano roll of the selected clip"
      default_visible: [keyboard with note names on C rows, key shading, grid select, chord strip collapsed to one row, vertical and horizontal scrollbars]
      disclosed: [velocity lane (thin strip, grows when notes are selected or on hover), quantize strength, triplet grids, note list view for screen readers]
    - id: dock_sound
      tab: Sound
      purpose: "Sound browser for the selected track"
      default_visible: [categories, search, sound cards with preview on press, licence line]
      disclosed: [all catalogue details, attribution text]
      covered_by: "T21 executes this spec (U07); samples from T21a"
    - id: dock_mix
      tab: Mix
      purpose: "Mixer strips"
      default_visible: [per track volume fader, mute, solo, meter, master fader]
      disclosed: [pan, reverb send, numeric dB readout]
    - id: export_sheet
      purpose: "Get the music out"
      default_visible: [WAV button, length choice (whole song, loop, section), progress with cancel]
      disclosed: [sample rate, MIDI export, attribution file]
    - id: command_palette
      purpose: "Ctrl K or the Ask button: one palette with verbs (Add, Change, Remove, Go to, Suggest) generated from describe() metadata (D33), word start matching, usage ranking; its Suggest section is the AI assist panel"
      default_visible: [Ask button in the top bar with a badge when an agent proposal waits]
      disclosed: [suggestion cards with Preview, Apply, Undo, raw commands of a card, proposal source]
    - id: history_panel
      purpose: "Undo history as plain steps, click to jump"
      default_visible: [none; opens from Undo long press or Ctrl Alt Z]
    - id: help_overlay
      purpose: "One screen of gestures and keys (Shift plus /)"
  layout:
    desktop: "top bar 48 px; arrangement and dock as a resizable split (default 40 and 60, remembered locally); arrangement never below VITE_MIN_ARRANGEMENT_ROWS lanes (R01 lesson 17); footer 28 px with autosave time, sample rate, latency and storage use with a warning threshold (R01 lesson 13)"
    narrow: "under 900 px the track header shrinks to icons; under 640 px the dock is full height and the arrangement becomes a tab"
  empty_states: "every empty area shows its next two actions as buttons plus a drop hint (empty project: Add a sound, Import MIDI; empty clip: Record, Draw a note) (R01 lesson 3)"
  add_track_rule: "adding a track creates a 4 bar empty clip (audit good_to_keep) and opens it in the Notes tab so there is no 'now what' moment (R01 lesson 2)"
  next_action_chip:
    rule: "A small chip under the top bar shows one suggestion from a fixed rule list (empty clip: draw or record; one clip: repeat it; no sound chosen: pick a sound; long project, nothing exported: export). It hides after 3 dismissals."

interaction_specs:
  region_move:
    - "Press on a clip body selects it; travel over config.dragThreshold starts a drag with a ghost; nothing is sent until release"
    - "Snap to bars when a bar is wider than VITE_SNAP_BAR_MIN_PX, else to beats; Shift held disables snap"
    - "Vertical travel moves between lanes; dropping below the last lane creates a track (group of add_track, move_region_to_track, move_region)"
    - "Alt held at release copies instead (duplicate_region with new ids)"
    - "Esc during drag cancels; release commits one group labelled 'Move clip' or 'Copy clip' (R01 lesson 9)"
    - "The cursor names the clip part under it (body moves, edge resizes); dropping onto another clip keeps the overlap (allowed by D9) and shows a toast with Undo (R01 lessons 8, 23)"
    - "Every drag has a visible equivalent: clip menu with Move to track, Copy, Split, Repeat (P5)"
  region_resize:
    - "Right edge zone of VITE_REGION_EDGE_PX resizes length (resize_region); notes past the new end are kept but shown faded only if the core allows, else the drag stops at the last note end"
    - "Left edge trim is a group of move_region plus move_notes by the opposite delta (needs D22); until then left edge does nothing and shows no resize cursor"
  region_split:
    - "S splits selected clips at the playhead; Alt click on a clip splits at the pointer (split_region with caller ids)"
  region_duplicate_and_repeat:
    - "Ctrl D duplicates the selection right after itself; Repeat x N (Ctrl Shift D) asks for N (1 to VITE_MAX_REPEAT) and emits one group of duplicate_region"
  region_loop:
    - "Loop this clip (L with a clip selected) sets the transport loop to the clip; a clip loop field (D24) lets one clip repeat its content over a longer length for the calm hour flow"
  keyboard_region_access:
    - "Arrangement canvas is focusable; arrows move between clips and lanes, Enter opens the clip in Notes, N adds a 4 bar clip at the cursor, Delete removes, the live region announces 'Pad, bars 5 to 8'"
  roll_select:
    - "Click selects one note, Shift click adds, drag on empty grid with Shift draws a marquee, Ctrl A selects all notes in the clip"
    - "Drag on empty grid without Shift draws a note (kept from M1, audit good_to_keep); double click on empty grid places a note with the last used length and loudness, double click on a note removes it (R01 lesson 6)"
    - "Drag a selected note moves all selected notes (move_notes, D22)"
    - "Alt drag copies selected notes (add_notes with new ids)"
  roll_quantize:
    - "Q quantizes selected notes, or all notes when none are selected, to the current grid at 100 percent; strength is disclosed in the grid menu (quantize_notes)"
    - "Grid menu: Auto (default, follows zoom with a minimum cell of VITE_GRID_MIN_CELL_PX, label names the current value, for example 'Grid: auto, eighth notes'), Off, quarter, eighth, sixteenth, triplets under More"
  scale_and_chord_helpers:
    - "Key picker in the top bar sets the project key (set_key, D23); default 'Not sure' shades nothing"
    - "Out of key rows are shaded with --color-roll-outkey; 'Stay in key' toggle snaps drawn and dragged pitches to the nearest in key pitch; clips follow the project key; a Fit to key button moves stray notes into the key (conform_notes_to_scale) (R01 lesson 7)"
    - "Chord strip shows the 7 chords of the key as plain names (C, Dm, Em, F, G, Am, Bdim) with roman numerals disclosed; click inserts the chord at the playhead for one grid length or replaces the notes of the selected bar (add_notes, delete_notes in one group)"
  velocity:
    - "Velocity lane shows bars for notes; drag on a bar sets that note; with a selection, drag anywhere sets all selected to the pointer value; Alt drag draws a ramp (set_notes_velocity, D22)"
    - "Values show as Soft, Medium, Loud labels with the number disclosed on hover"
  transport:
    - "Space toggles play only when focus is on body, a canvas or the transport group (fixes F29)"
    - "Play starts at the playhead; Stop once stops in place, Stop twice returns to the last start point"
    - "Click on the ruler seeks and keeps playing state; drag on the ruler draws the loop brace; L toggles loop"
    - "Metronome (M when focus is a canvas) clicks on beats with an accent on bar 1; count in length 0, 1 or 2 bars (default 1 from VITE_COUNT_IN_BARS) applies to Record and optionally to Play"
    - "All of this is session state set through transport.set (D21) so the agent sees and sets it too"
  record:
    - "Record arms the selected clip (creates one at the playhead if none); count in, then live notes from the computer keyboard or MIDI are captured with timing from the audio clock"
    - "On stop, captured notes are optionally quantized to the grid (toggle, default on at eighths) and committed as one add_notes group 'Record 12 notes'"
    - "With loop on, each pass adds notes (overdub); undo removes the last pass only"
  zoom_and_fit:
    - "Ctrl plus or minus and Ctrl wheel zoom around the pointer; pinch on trackpad zooms; Shift wheel scrolls horizontally"
    - "F fits the selection, Shift F fits the whole song, Home goes to the start (both arrangement and roll)"
    - "Zoom levels are view state, saved locally per project, not commands"
  copy_paste:
    - "Ctrl C copies selected notes or clips into a client clipboard of snapshots (relative ticks, pitches, velocities, source track)"
    - "Ctrl V pastes at the playhead snapped to the bar, into the selected clip for notes (add_notes with new ids, creating or growing the clip with resize_region if needed) or onto the source track for clips (duplicate_region)"
    - "Ctrl X is copy then delete in one group; paste across bars keeps beat offsets within the bar"
  sound_audition:
    - "Pressing a sound card opens a trial (group.begin, D32) and applies set_instrument live so playback uses it; each next pick replaces it inside the same trial; OK commits one undo step, Escape rolls back (R01 lesson 4). Agents use the same trial methods to try and revert"
  undo_history:
    - "Undo and Redo show the step label in the tooltip and in a toast ('Undone: Move 4 notes', with Redo)"
    - "History panel lists steps from history.get (D20) with source (you, AI, template), current position marked; click a step undoes or redoes to it in one call"
    - "Deleting a track shows a toast with Undo (fixes F06)"

visual_design:
  direction: "Calm studio paper by day, deep ink by night. Warm neutrals, one teal accent for action, muted instrument family hues for clips. Distinctive through clip shapes and color families, not through effects."
  avoid: [gradients on chrome, glass blur, rounded 2xl cards everywhere, emoji, rainbow text, symmetric feature grids]
  color:
    keep: "existing light-dark() tokens in web/app/src/index.css (surface, panel, line, ink, accent, roll-*)"
    add:
      - "--color-family-keys, -strings, -pads, -bass, -plucks, -choir, -bells, -perc: 8 muted hues at equal lightness (OKLCH L 0.62 light, 0.72 dark, chroma 0.08) for clip fill and track header stripe"
      - "--color-roll-outkey: row shade for out of key pitches, contrast 1.15 against roll-row"
      - "--color-loop: loop brace and loop region tint, amber at low chroma"
      - "--color-ghost: preview of drags and AI proposals, accent at 35 percent alpha with dashed outline"
      - "--color-record: record button and capture tint"
    contrast: "text 4.5 to 1, notes and clips against their background 3 to 1, both themes, checked by a vitest that reads the token pairs"
  theme: "system default, toggle in settings (system, light, dark) sets data-theme on html; color-scheme follows"
  type:
    family: "keep the system sans stack: zero bytes, crisp at small sizes, native feel; numbers use tabular-nums and the mono stack for positions"
    scale_px: [12, 13, 14, 16, 20, 28]
    usage: "13 body and controls, 12 only for ruler labels, 14 panel headings, 20 start screen card titles, 28 start screen heading"
  spacing: "4 px base: 4, 8, 12, 16, 24, 32; control height 36 comfortable, 32 compact"
  density: "comfortable default (track row 44 px), compact (32 px) in settings; both read from config so canvas and DOM stay aligned"
  shape: "radius 6 for controls, 4 for clips, 2 for notes; clips have a 3 px top stripe in the family hue and a soft fill"
  motion:
    tokens: "fast 90 ms, base 140 ms, slow 220 ms, ease out for enter, ease in for exit"
    rules: "only opacity and transform; canvases never animate except the playhead and drag ghosts; prefers-reduced-motion keeps the existing block"
  icons: "own set only: @thesvg/ui-react exports plus local glyphs in web/app/src/icons/index.tsx (new: loop, metronome, record, scissors, repeat, sparkle for AI, history); no Lucide or Phosphor"
  styling: "Tailwind only, shared class strings in web/app/src/ui/classes.ts, no inline styles"

performance:
  rules:
    - "Canvases draw outside React; React renders chrome only (D11)"
    - "Four canvas layers per editor: grid (redraw on view change), content (notes or clips, redraw on data or view change), overlay (selection, ghosts, AI preview), playhead (every frame while playing, a 2 px strip only)"
    - "Draw only what is in view: lanes and notes are culled by index ranges; region previews cap at config.regionPreviewMaxNotes and aggregate when closer than 2 px"
    - "Track header list is DOM virtualized with VITE_TRACK_OVERSCAN rows of overscan"
    - "Clip mini previews and audio peaks render in a worker into ImageBitmaps (OffscreenCanvas), keyed by clip id plus content hash"
    - "Offline render and long exports run in a worker with progress messages and cancel"
    - "The Store mirrors the project from the change feed (D25) and fetches the full state only on a hash mismatch; full refetch per edit is removed above VITE_FULL_REFRESH_MAX_NOTES"
    - "Gestures never send commands during a drag; one group on release. When the engine must hear a live value (fader, sound trial) the gesture uses a trial group (D32) and commits once"
    - "One frame service drives every canvas host and meter, coalesces invalidations and skips frames closer than VITE_MIN_FRAME_MS (default 16) so 120 Hz screens do not double UI work (R01 performance_tactics)"
    - "Budgets come from env: VITE_FRAME_BUDGET_MS (default 8), VITE_INPUT_BUDGET_MS (50), VITE_OPEN_BUDGET_MS (1500 for the bench default project), VITE_E2E_FIRST_SOUND_MS (10000)"
  large_project_behavior:
    - "Open shows the arrangement first with clip outlines, previews fill in from the worker"
    - "Above VITE_DETAIL_LOD_NOTES notes in view the roll drops note labels and edges"
    - "Undo history panel pages history.get results (limit 200)"
  measured_by: "composerDebug draw stats and edit timing, read by e2e scripts in U02 and U27"

accessibility_and_keyboard:
  model: "Modeless. Letters are shortcuts. The computer keyboard piano is on only while the Keys toggle (K) is on or while Record is armed, so letter shortcuts and piano keys never fight."
  focus_order: "top bar, arrangement canvas, dock tabs and active panel, footer; Ctrl K opens the palette from anywhere; F6 cycles these regions"
  announcements: "one aria-live polite region; after each committed command it reads the step label plus a short result ('Moved 4 notes one beat later'); note cursor moves read pitch, bar, beat and length (fixes F36)"
  canvas_alternatives: "Notes tab offers a note list view (table of pitch, start, length, loudness) editable by keyboard; arrangement offers keyboard clip access (F28)"
  keys:
    - "Space: play or pause (context rule above)"
    - "Enter: play from the last start; in arrangement opens the clip"
    - "R: record; L: loop on or off; M: metronome; K: keys piano on or off"
    - "Ctrl Z, Ctrl Shift Z: undo, redo; Ctrl Alt Z: history panel"
    - "Ctrl C, X, V, D; Ctrl Shift D: repeat x N"
    - "S: split at playhead; Q: quantize; Delete: remove selection"
    - "F, Shift F, Home: fit selection, fit song, go to start"
    - "Ctrl K: command palette listing every command from describe() in plain names, runs through the same Actions"
    - "Shift plus /: help overlay"
  shortcuts_as_data: "web/app/src/input/keymap.ts holds key to command id bindings with descriptions; tooltips, the help overlay and the palette read it so docs never drift (R01 lessons 11, 21)"
  checks: "fixing-accessibility and baseline-ui passes before each wave closes; e2e keyboard only run of F2"

command_api_gaps:
  rule: "Each gap becomes a decision entry before code, additive only (D9 rule): new commands or methods, optional fields skipped when default so existing files and state_hash values do not change."
  not_a_gap:
    - "Copy and paste of notes across clips is a group of add_notes with new ids; clip paste and repeat are groups of duplicate_region. No copy command is needed."
    - "Tap tempo computes BPM in the client and sends set_tempo."
  gaps:
    - decision: D20
      topic: history read
      adds: "history.get {limit, offset} returning entries {index, label, source, command_count} and cursor; undo and redo take optional steps; each group carries a source tag (user, ai, template, recipe) set by the client"
      needed_by: [U20, U21, U25, U26]
    - decision: D21
      topic: transport session state
      adds: "transport.set and transport.get gain loop {on, start, end}, metronome {on}, count_in_bars, follow; saved in the meta section of the project file (D13), not part of state_hash; wasm editor session implements the same methods"
      needed_by: [U09, U10, U14]
    - decision: D22
      topic: bulk note edits
      adds: "move_notes {region, notes, delta_tick, delta_pitch}, resize_notes {region, notes, delta}, set_notes_velocity {region, notes, value or ramp from to}, delete_notes {region, notes}; each plans to ordinary Change records, capped by MAX_BULK_NOTES"
      needed_by: [U16, U17]
    - decision: D23
      topic: key and theory
      adds: "set_key {tick, root 0..11, scale} and remove_key in the tempo map (skipped when empty); composer-theory crate with scale and chord tables; read method theory.chords {key} and command conform_notes_to_scale {region, notes}"
      needed_by: [U12, U13, U18, U19]
    - decision: D24
      topic: clip loop and markers
      adds: "region loop_length (content repeats until the clip length) via set_region_loop; markers add_marker, move_marker, rename_marker, delete_marker for named sections; render, engine blob and format handle both"
      needed_by: [U23, U29]
    - decision: D25
      topic: incremental change feed
