waves:
  - wave: 1
    goal: "A beginner hears music in one click, edits clips and notes directly, copies and repeats, picks real sounds, mixes, loops and records."
    tasks: [U01, U02, U03, U04, U05, U06, U07, U08, U09, U10, U11, U12, U13, U14, U15]
    order: "batch a U01 U02 U06 (plus T20 finishing); batch b U03 U09 U12 U15; batch c U04 (T22) U05 U08; batch d U07 (T21) U10 U13; batch e U11 U14"
  - wave: 2
    goal: "Piano roll power tools and history without slowdown."
    tasks: [U16, U17, U18, U19, U20, U21, U22]
  - wave: 3
    goal: "AI assist with preview and undo, long form engine features, scale pass."
    tasks: [U23, U24, U25, U26, U27, U28]
  - wave: 4
    goal: "Calm hour end to end, export, library."
    tasks: [U29, U30]

risks:
  - id: K1
    risk: "One workspace with a bottom dock may cramp the roll on 13 inch laptops"
    mitigation: "resizable split, Notes tab maximise on double click of the tab"
    measure: "split position users settle on; time spent scrolling the roll"
  - id: K2
    risk: "Keys piano behind a toggle changes M1 behavior where letters always played notes"
    mitigation: "the Keys toggle is on by default in the Recreate template and shows a hint"
    measure: "how often users press letters with Keys off and get a shortcut they did not expect (commandLog right after a letter, undone within 3 s)"
  - id: K3
    risk: "Built in synth voices may still sound stock to the owner"
    mitigation: "T21a sampler in parallel; picker hides unplayable entries"
    measure: "owner listening rating per voice; previews per pick before choosing"
  - id: K4
    risk: "Clip loop length (D24) touches model, engine, render, format and every client"
    mitigation: "optional field skipped by default, demo hash gate, wave 3 only"
    measure: "bench render RTF and format round trip in CI"
  - id: K5
    risk: "Change feed mirror (D25) can drift from the core"
    mitigation: "hash check after each change and fallback to full state"
    measure: "count of fallbacks in composerDebug per session"
  - id: K6
    risk: "In the browser alone there is no language model; the palette Suggest section shows recipes only until an agent connects through composerd and MCP"
    mitigation: "recipes are useful alone; Suggest copy says how to connect an agent"
    measure: "recipe accept rate and undo within 10 s after apply"
  - id: K7
    risk: "Transport state outside state_hash (D21) may surprise agents that diff by hash"
    mitigation: "transport.get documented in MCP tool descriptions as session state"
    measure: "agent test scripts that set loop then verify"
  - id: K8
    risk: "System font stack makes the product look generic"
    mitigation: "identity carried by family hues, clip stripes and the calm palette"
    measure: "owner reaction on screenshots at the end of wave 1"
user_testing:
  sessions: "5 beginners, think aloud, 30 minutes, tasks F1, F2, F3 in that order, Chrome on their own laptop"
  measure:
    - "seconds and actions to first sound (composerDebug.firstSoundMs, actionsToFirstSound)"
    - "seconds to a saved 4 bar idea"
    - "undo per minute and undo within 3 s (confusion signal)"
    - "panels opened before the first note"
    - "share of sessions that reach export"
    - "previews per sound pick"
    - "AI card apply then undo rate"
    - "p95 draw time on their machine"
    - "the step where each abandoned session stopped"
  storage: "local only, exported as JSON from the help menu by the tester; nothing sent anywhere"

r01_folded_in:
  borrowed: ["1 non modal tour with Not now and Never show", "2 open the new clip in the editor", "3 empty states with two actions", "4 trial audition (D32)", "5 verb palette (D33)", "6 double click place and remove", "7 scale mask, follow key, Fit to key", "8 and 9 part aware drags, one undo step, Escape cancels", "10 auto grid", "11 and 21 shortcuts as data", "13 footer with latency and storage", "14 and 20 plain environment dialogs", "15 progress with cancel (U29)", "22 plain sound names", "23 overlap toast with Undo", "24 history list", "25 one primary action on first open"]
  avoided: ["gesture only actions (P5)", "squeezed arrangement (minimum lanes)", "hidden scrollbars (visible scrollbars in U05 and U13)", "canvas without an accessible model (note list, keyboard clips, announcer)"]
  conflicts_with_audit:
    - topic: first screen
      audit: "keep instant start into the starter (good_to_keep), F01 first run card"
      r01: "short guided path with one primary action (lessons 1, 25)"
      chosen: "the workspace opens with the starter behind a non modal goal sheet whose primary is Play the starter; keeps 1 action to first sound and gives the guided path"
    - topic: grid default
      audit: "F40 fixed eighth default plus Off"
      r01: "lesson 10 snap follows zoom"
      chosen: "Auto with its current value named in plain words, plus Off; removes a choice and keeps the plain label the audit asked for"
    - topic: new clip length
      audit: "good_to_keep 4 bar clip on Add track"
      r01: "lesson 2 one bar clip"
      chosen: "4 bars (room for a phrase, matches config.defaultRegionBars) and open it in Notes as R01 suggests"
    - topic: AI assist location
      audit: "no position"
      r01: "palette is the natural home"
      chosen: "inside the palette, so no side rail chrome; agent proposals raise a badge on the Ask button"
