# UI component inventory and build order for the composer web app (R04, lane research).
# Source of facts about the reference: the openDAW studio UI (AGPL) read directly, plus notes/ref-opendaw-ui.yaml (R01).
# Source of facts about our app: web/app/src at wave/1 plus core/composer-commands/src/describe.rs (commands) and notes/ui-plan.yaml.
# Rule: behavior in our words only, no code copied. Our names live in glossary (we_call_it).
#
# Path shorthand: "ui/..." means packages/app/studio/src/ui/... inside <reference checkout>/opendaw.
# Other prefixes are written in full. Every component has ref_src (the entry's src: path and lines).
# Per component fields: we_call_it, purpose, behavior (states, edge cases), avoid (what not to copy),
# ref_src, ours {status have|partial|missing, files, note}, priority (P0 beginner blocker, P1, P2),
# needs_command_api, ui_plan_task (existing U id or null), tag (borrow|avoid|rethink).
meta:
  id: R04
  date: 2026-11-23
  author_lane: research
  owner_complaint: "The app lacks a left side bar for sounds and many other components."
  inputs_read: ["notes/ref-opendaw-ui.yaml", "notes/ui-plan.yaml", "notes/ui-audit.yaml (headings)", "notes/tasks.yaml", "notes/decisions.yaml (status of D19 to D34)", "web/app/src (ui, roll, state, mixer)", "openDAW ui/browse, ui/devices, ui/header, ui/timeline, ui/mixer, ui/components, ui/software-midi, ui/piano-panel, ui/dashboard, service/StudioMenu.ts, manual pages"]
  not_done: ["Did not run the reference app this time (R01 did, see its live: facts).", "Did not read the .sass files, so exact sizes, colors and spacing of the reference are not recorded (not needed, our tokens differ).", "Did not run our app; our status comes from reading source and the e2e script names."]
  reading_the_reference_gap: "In the reference the left browser holds ONLY Samples and Soundfonts (two tabs). Instruments and effects are chosen in a modal picker dialog, and presets sit behind a folder icon in each device header. So the reference does not have a left sound browser for instruments; our sidebar is a deliberate step beyond it (owner wants it, Splice style)."

glossary:
  # we_call_it map, reference name on the left.
  - ref: "browser panel (BrowserPanel, ResourceBrowser)"
    we_call_it: "library sidebar"
  - ref: "audio unit (one channel: instrument, effects, strip, tracks)"
    we_call_it: "track"
  - ref: "track inside an audio unit (notes lane, audio lane, value lane)"
    we_call_it: "lane (a track can later own an automation lane)"
  - ref: "region (timeline) and clip (launcher cell)"
    we_call_it: "clip (on the timeline) and launch slot (grid cell, not planned)"
  - ref: "device (instrument or effect), device panel, device dialog"
    we_call_it: "sound or effect, sound panel, sound picker"
  - ref: "preset, stock preset, user preset"
    we_call_it: "sound variation, built in variation, my variation"
  - ref: "sample, soundfont"
    we_call_it: "sample file, sound bank"
  - ref: "tape (audio track instrument)"
    we_call_it: "audio track"
  - ref: "spotlight"
    we_call_it: "command palette (U21)"
  - ref: "primary tracks (markers, tempo, signature, key, chords)"
    we_call_it: "timeline lanes"
  - ref: "capture MIDI"
    we_call_it: "catch what I just played"
  - ref: "screen / workspace layout"
    we_call_it: "view (we keep one workspace, panels are dock tabs and the sidebar)"
  - ref: "modulator"
    we_call_it: "movement (slow automatic parameter change)"
  - ref: "mastering panel, output unit"
    we_call_it: "master strip"

ranked_build_order:
  principle: "Order by beginner blocker first, then by how many other components wait on it. Left sounds sidebar first because the owner named it and because drag and drop, context menus and the sound panel all hang off it."
  steps:
    - rank: 1
      id: U31
      what: "Library sidebar (left), Sounds scope first, resizable and collapsible, Shift+B"
      why: "owner named blocker; sounds are today a bottom tab, away from the tracks they apply to"
    - rank: 2
      id: U32
      what: "Drag and drop kit plus context menu kit (sound to track, sound to empty lane area, right click on track, clip, note)"
      why: "makes the sidebar useful and removes hidden-gesture-only actions (principle P5)"
    - rank: 3
      id: U33
      what: "Dialog kit, toast stack with Undo, Project menu (New, Open, Save, Export, Templates), unsaved work guard"
      why: "today File actions are loose buttons, confirm and progress dialogs do not exist yet"
    - rank: 4
      id: U34
      what: "Sound panel for the selected track (sound name, previous and next sound, volume, pan, reverb send, mute)"
      why: "all needed commands already exist; fills the empty bottom area the reference calls the device panel"
    - rank: 5
      id: U35
      what: "Track header v2 (inline rename, reorder by drag, duplicate, color, record arm, menu)"
      why: "move_track and rename_track exist but have no UI; duplicate and arm are the usual beginner expectations"
    - rank: 6
      id: U36
      what: "On screen keyboard, chord pads, catch what I just played"
      why: "ideas out of the head with no MIDI device; idea 'I played something good, keep it'"
    - rank: 7
      id: "U37 then U38"
      what: "Automation: core commands first, then lane editor and right click Automate on a control"
      why: "swells and filter moves are central to cinematic and long ambient; no command exists today"
    - rank: 8
      id: U39
      what: "Timeline lanes (markers, tempo, key) and tap tempo"
      why: "film scoring needs tempo changes; sections lane is also the calm hour navigation (U29 uses it)"
    - rank: 9
      id: "U40 then U41"
      what: "Effect chain: core commands then UI in the sound panel"
      why: "more than reverb is needed for cinematic sound; large core work so later"
    - rank: 10
      id: "U42, U43, U44"
      what: "Guided tour, preferences page with shortcut remap, loudness readout"
      why: "polish, P2 except the tour (P1 for first run)"
  already_in_flight_or_planned_do_not_duplicate: ["U21 history panel and command palette (running)", "U14 record (running)", "U22 change feed (running)", "U11 clipboard", "U15 plain language", "U17 roll multi select and bulk", "U19 chord strip", "U23 loop and markers core", "U29 export sheet, master strip, sections lane", "U30 project library and Open"]

