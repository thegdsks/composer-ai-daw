# ---------------------------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------------------------
components:

  # ===================== Shell and layout =====================
  shell:
    - id: library_sidebar
      we_call_it: "library sidebar"
      purpose: "One always reachable place to find sounds (later samples, effects, projects) and put them on tracks."
      behavior:
        - "Reference: a side panel with two tabs (Samples, Soundfonts) switched through one shared scope value; each tab body is rebuilt when the scope changes and its subscriptions released. Fixed width 300 px, starts collapsed as a vertical side tab in the default layout."
        - "Reference body: a filter bar (location switch between online library and user folder, then a search box), a column header row (Name, Bpm, Sec), a scrolling list, a footer (license note, stored size link, audition volume in dB)."
        - "Folders expand and collapse and the open set is remembered for the session; a search query flattens the tree into a name sorted match list and hides trashed items."
        - "Our version: start OPEN on first run (the reference hides it, beginners miss it), width and open state remembered, collapses to a narrow icon rail, Shift+B toggles. Sounds scope lists categories with plain names (U07 rules), a Hear action on each row, drag out to tracks."
        - "States: loading (list not ready, show spinner row), failed (error with Retry, the reference makes the error line clickable to retry), empty search (say so and offer Show all), nothing selected track (using a sound creates a track)."
      avoid: ["starting collapsed", "brand names as the only label", "an online versus local switch the beginner has to understand (use Built in and Mine)"]
      ref_src: ["ui/browse/BrowserPanel.tsx:16-56", "ui/browse/ResourceBrowser.tsx:60-129", "ui/browse/ResourceBrowser.tsx:270-329", "ui/workspace/Default.ts:6-21"]
      ours:
        status: partial
        files: ["web/app/src/ui/SoundBrowser.tsx", "web/app/src/ui/Dock.tsx"]
        note: "The content (search, categories, cards, Hear and Use, licence line) exists as the Sound tab of the bottom dock. There is no left column, no width control and no collapse rail."
      priority: P0
      needs_command_api: "Existing: set_track_sound (D29), add_track, sounds.list. Nothing new for the Sounds scope."
      ui_plan_task: null
      proposed_task: U31
      tag: rethink
    - id: library_sidebar_samples_scope
      we_call_it: "samples tab of the library sidebar"
      purpose: "Browse, audition and drag audio files (loops, one shots, field recordings) onto the timeline."
      behavior:
        - "Rows show name, detected tempo and length in seconds. Double click auditions (states buffering, playing, error shown on the row); starting a drag stops any audition."
        - "Dropping a sample on a lane creates an audio clip; dropping several puts the first on the target track and gives each other its own new track. A sample with a known tempo is stretched to the project tempo automatically, one with none is placed unstretched."
        - "Row menu: create audio track, auto chop into pads, edit in sample editor, edit name and tempo (only for user files)."
        - "Audition volume control sits in the footer and is separate from project levels."
      avoid: ["auto stretch with no way to see or undo it in plain words (show a 'Matched to project tempo' chip)"]
      ref_src: ["ui/browse/SampleBrowser.tsx:40-122", "ui/browse/SampleView.tsx:34-95", "ui/browse/SampleSelection.ts:17-57", "ui/timeline/tracks/audio-unit/TimelineDragAndDrop.ts:41-122"]
      ours:
        status: missing
        files: []
        note: "Audio tracks and import are not built (T23 todo). Catalogue sample packs show as 'not ready yet' rows."
      priority: P1
      needs_command_api: "Gap: audio clips need an audio region model and import (T23). Until then the scope shows catalogue packs read only."
      ui_plan_task: null
      proposed_task: "U31 hosts the tab shell, T23 and T21a supply the data"
      tag: borrow
    - id: library_projects_scope
      we_call_it: "projects and templates tab of the library sidebar"
      purpose: "Reopen a project, start from a template or a demo without leaving the workspace."
      behavior:
        - "Reference lists these on a separate dashboard screen with tabs Projects, Templates, Demos. Opening a demo asks for approval and first asks about losing unsaved changes."
        - "Ours: Start sheet already has goal cards and recents. Keep the sheet for first open; mirror the lists in the sidebar so a returning user can switch without a modal."
      ref_src: ["ui/dashboard/Resources.tsx:60-72", "ui/dashboard/DemoProjectsList.tsx:23-50", "ui/dashboard/DemoProject.tsx:19-37"]
      ours:
        status: partial
        files: ["web/app/src/ui/Start.tsx", "web/app/src/templates/index.ts"]
        note: "Four templates and recents exist on the Start sheet; no sidebar tab, no user templates, no rename or delete."
      priority: P1
      needs_command_api: "library.list, rename, duplicate, delete (D30 proposed, task U30); templates.list (D28 proposed)."
      ui_plan_task: U30
      tag: borrow
