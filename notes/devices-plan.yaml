      do: "A swing or groove template in the project (list of tick offsets per position in a cycle), a MIDI effect that warps note ticks by it and clamps to the block. Do not start before the owner confirms swing as a model concept; today quantize and swing may be commands instead."
      exit:
        - "unit tests: swing 0 is identity; warped then unwarped positions agree"
  - id: DV57
    wave: E
    lane: interfaces
    size: M
    needs: ["DV40"]
    external_needs: []
    title: midi_out (daemon and shell only)
    inspired_by: "ref-opendaw-devices devices.instruments.midi_out"
    brief:
      files: ["daemon/composerd", "core/composer-engine (event tap)"]
      do: "Instrument kind that emits no audio; converts the unit notes to raw MIDI with frame accurate timing and optional clock, start, stop and song position; the host thread drains a queue. Needs a realtime host (Tauri or daemon) and a permission story for browsers. Offline render ignores it."
      exit:
        - "unit tests for message bytes and timing math; hash unaffected when disabled"
  - id: DV58
    wave: E
    lane: research
    size: M
    needs: []
    external_needs: []
    title: Scripted devices design (sandboxed, bounded)
    inspired_by: "ref-opendaw-devices devices.scripting_and_hosting.script_fx and framework.scripted_devices_warning (rethink)"
    brief:
      files: ["notes/ref-script-devices.yaml (new)", "notes/decisions.yaml"]
      do: "Design only. The reference runs user JavaScript in the audio worklet, which cannot be deterministic, bounded or the same offline. Options to evaluate: user code compiled to a restricted wasm module with fuel metering and fixed memory, a small expression language for effects and MIDI effects, or no scripting (AI writes a device description instead and the engine interprets a closed set of blocks). Recommend one with its cost and what determinism it keeps."
      exit:
        - "notes file with options, a recommendation and a threat list (infinite loop, memory, time)"
  - id: DV59
    wave: E
    lane: core
    size: XL
    needs: ["DV04", "DV20", "DV40"]
    external_needs: []
    title: Web plugin host (WCLAP) as a device kind
    inspired_by: "ref-opendaw-devices devices.scripting_and_hosting.web_plugin_host; notes/ref-webclap.yaml; notes/ref-clap-host.yaml"
    brief:
      files: ["web/app (host glue)", "core/composer-model (plugin device: bundle hash, plugin id, state bytes, parameter list)", "core/composer-engine (bridge slot)"]
      do: "Device kind web_plugin with bundle by content hash, plugin id, state as a bytes field (never base64), parameter list copied from the plugin with id, min, max, default, flags so automation uses DX3. Missing bundle: the project loads and the device is silent with a stable code until the user resolves it. Plugin instances run behind the loader notes in ref-webclap; their output is marked non deterministic, excluded from bit for bit goldens, and offline render uses the same plugin only when present. Latency from the plugin latency extension feeds DX5 alignment. Native CLAP hosting is the daemon tier and follows notes/ref-clap-host.yaml."
      exit:
        - "a bundled test plugin loads, renders a note, and its parameter automates; project save and load keeps state bytes; missing bundle case covered"
        - "hash of a project with a plugin device is stable for the model, and render tests mark plugin tracks excluded from the bit for bit test with a visible flag"

waves:
  - wave: A
    goal: "Device framework: chain per track and master, bypass, parameter ids, automation targets, state hash rules, catalogue for UI, CLI and MCP; plus the six cheapest effects."
    tasks: ["DV01", "DV02", "DV03", "DV04", "DV05", "DV06", "DV07", "DV08", "DV09", "DV10", "DV11", "DV12", "DV13", "DV14"]
    order: "DV01 then DV02 and DV03 in parallel; DV04; then DV05 and DV06 to DV11 in parallel; DV12 after DV06; DV13 after DV12; DV14 after DV07."
    exit: "A project with chains on three tracks and the master renders identically native and wasm under 5 block sizes; demo hash unchanged; no_alloc passes; MCP can build the chain; the UI panel edits it; bench budgets set."
  - wave: B
    goal: "Dynamics, EQ and space: sidechain and latency alignment, compressor, limiter, equalizer with analyser, gate sidechain, wave folder with oversampler, room and plate reverb."
    tasks: ["DV20", "DV21", "DV22", "DV23", "DV24", "DV25", "DV26", "DV27"]
    order: "DV20 first; DV21, DV22, DV23, DV25, DV26, DV27 in parallel; DV24 after DV20 and DV09."
    exit: "A mix with kick sidechained compressor, EQ on the bus and a limiter on the master sums aligned and renders identically native and wasm; all existing reverb goldens unchanged."
  - wave: C
    goal: "Instruments: slot and voice kit, analog style synth, phase synth, sampler, drum pads, soundfont node, layers, optional acid bass."
    tasks: ["DV30", "DV31", "DV32", "DV33", "DV34", "DV35", "DV36", "DV37"]
    order: "DV30 first; DV31, DV32, DV33, DV35 in parallel; DV34 after DV32; DV36 after DV34; DV37 last and optional."
    exit: "The owner hears six synth presets and a drum kit and rates them above the stock voices; old projects play byte identical."
  - wave: D
    goal: "MIDI effects: chain runtime, transpose, velocity, note filter, scale snap, arpeggiator, chords, UI row."
    tasks: ["DV40", "DV41", "DV42", "DV43", "DV44", "DV45"]
    order: "DV40 first; DV41, DV42 in parallel; DV43 and DV44 after DV42; DV45 after DV41 and DV43."
    exit: "A held chord through arpeggiator into the synth renders identically native and wasm and never leaves a stuck note across seek, loop wrap and edits."
  - wave: E
    goal: "Heavy and later: convolution, vocoder, pitch correction, neural amp (feasibility first), composites, groove, MIDI out, scripting design, web plugin host."
    tasks: ["DV50", "DV51", "DV52", "DV53", "DV54", "DV55", "DV56", "DV57", "DV58", "DV59"]
    order: "DV53 and DV58 research any time; DV50, DV51, DV52, DV55 after wave B; DV54 only after DV53 says go; DV59 last."

risks:
  - id: R1
    risk: "Hash and file compatibility: every wave touches the model."
    mitigation: "skip default hashing for empty chains and defaults, demo hash gate in every core task, fail closed loads with stable codes"
    measure: "demo hash and existing goldens in CI, round trip tests"
  - id: R2
    risk: "Bit for bit determinism breaks when someone calls a std math function or the compiler fuses operations."
    mitigation: "composer-dsp is the only math source; a grep test; a native versus wasm fingerprint test per device; no fma flags"
    measure: "fingerprint tests in composer-wasm per device"
  - id: R3
    risk: "Control period of 32 frames steps fast parameter moves; some devices zipper (filter cutoffs, delay time)."
    mitigation: "interpolate coefficients and delay offsets across the period inside devices; keep the period a constant from D36"
    measure: "sweep discontinuity tests in DV23 and DV07"
  - id: R4
    risk: "Latency alignment complexity hides in the engine and makes sums wrong."
    mitigation: "zero latency assertion in wave A, alignment built in DV20 with a latent test device and a byte identical zero latency regression"
    measure: "alignment tests"
  - id: R5
    risk: "Memory per instance of reverbs, delays and convolvers times many tracks."
    mitigation: "size from the sample rate at setup, report bytes per device in tests, env budgets, cap chain length and heavy device count"
    measure: "bench memory budget"
  - id: R6
    risk: "Instruments built here may still sound stock to the owner."
    mitigation: "preset review by ear after DV31 and DV33; sampler and soundfont path stays available (D34, D37)"
    measure: "owner rating per preset"
  - id: R7
    risk: "Licence contamination from fitted tables or ported sources."
    mitigation: "DX7 rule, inspired_by on every device task, no renders from commercial plugins stored"
    measure: "review of each device PR against the licence_notes list"
  - id: R8
    risk: "Hosted plugins (WCLAP) are not deterministic and not reproducible offline."
    mitigation: "flag plugin devices in the model, exclude from bit for bit tests, state bytes by hash, missing bundle handling"
    measure: "plugin load failure rate in a session log"

