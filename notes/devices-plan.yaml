  - "Should the existing master reverb become a normal device (DV26) or stay a built in return? The plan keeps old files identical either way."
  - "Is a scripting feature wanted at all (DV58), or should AI describe devices through commands and presets instead?"
  - "Neural amp: is a guitar amp model in scope for a composition app or is it a niche to drop?"
  - "Do you want sample accurate swing as a model concept (groove) before wave E, or as commands only?"
  - "Pay for a commercial licence of the reference (D2) so ideas could be reused more directly, or stay clean room?"

unverified:
  - "Exact set of hash tags free in composer-model hash.rs (0xF0 to 0xF6 are used per the grep; confirm 0xF7 and above at implementation)."
  - "Whether composer-wasm can host the device crate size within the web size limit (notes/web-limits.yaml); measure after DV04."
  - "Cost of per sample processing for the eight tasks marked L or XL on a mid range phone; unknown until benchmarked."
  - "The compressor upstream licence and the neural amp licences (see ref-opendaw-devices unverified)."
