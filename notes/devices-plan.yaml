# Device system build plan for the composer engine (R05). Executable by parallel agents, same shape as notes/ui-plan.yaml.
# Status: proposed. The DX decision placeholders become real D numbers in notes/decisions.yaml before any core change.
# Facts about the reference come only from notes/ref-opendaw-devices.yaml (and the refs notes it builds on).
# No reference code was read by the author of this plan beyond what those notes record.
meta:
  id: R05
  date: 2026-11-23
  author_lane: research
  inputs:
    - CLAUDE.md
    - notes/ref-opendaw-devices.yaml
    - notes/ref-opendaw.yaml
    - notes/ref-opendaw-ui.yaml
    - notes/ref-webclap.yaml
    - notes/ref-clap-host.yaml
    - notes/decisions.yaml (D9, D12, D14, D19, D26, D29, D34, D36, D37, D40 to D44)
    - notes/ui-plan.yaml (shape, U task ids referenced only for UI hooks)
    - core/composer-engine (math.rs rules, automation.rs CONTROL_PERIOD, mix.rs master bus, tests/no_alloc.rs)
  validity_rule: "needs lists only DV ids from this file. external_needs lists only T ids from notes/tasks.yaml. decides lists DX placeholders from this file."

owner_goal: "A device system like the reference stock devices: instruments, audio effects, MIDI effects, hosting later. Same in the browser and native, bit for bit, no allocation while rendering, every edit a command."

what_exists_today:
  - "Per track mix (volume, pan, mute, solo, reverb send) and a built in master reverb (D14, D26). This is a fixed chain, not a device chain."
  - "Built in voices and a sampler bank with SF2 and SFZ zones (D29, D34, D37). Soundfont playback therefore exists, as a track sound, not as a device node."
  - "Automation lanes for four targets (master volume, track volume, pan, reverb send) evaluated every 32 frames from the absolute frame (D36)."
  - "Audio clips offline only (D40 to D42). Browser playback of clips is a known gap."
  - "Engine math uses only add, multiply and floor so native and wasm agree (composer-engine math.rs)."
  - "A no allocation test and a bench with env budgets (core/composer-engine/tests/no_alloc.rs, bench/budgets.env)."

principles:
  - "One engine, three clients: every device edit is a command; the device catalogue is data a client can read (types, parameters, ranges, units, defaults), so the UI panel, CLI and MCP tools are generated from it."
  - "Model stays free of floats (D14 rule): each parameter is stored as an integer in a unit its spec declares (centi dB, permille, cents, microseconds, steps). The engine converts to f32 at the control period with a defined rule."
  - "Deterministic DSP: only add, subtract, multiply, divide, floor and square root in audio code, plus our own kit functions built from those (sin, exp2, log2, tanh, pow, tan for filter coefficients). No std transcendentals, no fused multiply add, no fast math, no hash map iteration in audio order, fixed summation order."
  - "No allocation in process: every buffer and ring is sized at setup from the sample rate and the project, state lives in preallocated blocks, large state is built in place, voices come from fixed pools."
  - "Same code native and wasm: devices live in a core crate used by composer-render, composer-wasm and later the daemon. No per target DSP."
  - "Parameter ids are stable small integers per device type, never reused; types have a schema version; defaults are skipped in JSON and in state_hash (D26 pattern), so projects without devices hash exactly as before."
  - "Bypass is defined: clearing state on disable plus a short crossfade, so it depends on nothing in the past."
  - "Latency is a first class number per device with alignment at sums, but wave A asserts zero latency everywhere until the first latent device ships."
  - "Plain names in the UI (we_call_it), never brand names."
  - "Licence safety: only public algorithms and our own tuning; nothing from GPL or commercial excluded sources (see licence_notes)."

decisions_to_record_first:
  note: "Placeholders. The orchestrator assigns real D numbers. Each needs an owner accept or an orchestrator accept in the task message, as D36 and D40 did."
  items:
    - id: DX1
      topic: "device model: chains, slots and ids"
      summary: "Track gets an ordered audio effect chain and, later, an instrument slot and an ordered MIDI effect chain. The master has an audio effect chain. A device is {id, type, enabled, params}. Ids are caller supplied like every other id (D9). Chains skip in JSON and hash while empty. Hash tag proposal 0xF7 for chains (0xF0 to 0xF6 are used in composer-model hash.rs, confirm at implementation)."
      inspired_by: "ref-opendaw-devices framework.device_kinds"
    - id: DX2
      topic: "parameter schema and units"
      summary: "Every device type exposes a static table: parameter id (u16), name, storage unit and scale, min, max, default, curve for UIs (linear, exp, bent), and kind (automatable, or setting that rebuilds state). Values are i32. A setting never appears in automation. A type has a version number. New parameters append."
      inspired_by: "ref-opendaw-devices framework.parameters, settings_vs_parameters, parameter_ids (rethink: automation in real units, not unit space)"
    - id: DX3
      topic: "automation targets for device parameters"
      summary: "AutomationTarget gains Device{owner (track id or master), device id, param id}. Points store real integer values in the parameter unit, evaluated at the 32 frame control period (D36 rule). Hold and linear curves interpolate in the integer unit space with the existing integer rule; smooth uses the existing curve. A set_param command and a lane never disagree: a lane wins while it has points."
      inspired_by: "ref-opendaw-devices framework.automation_clock (rethink)"
    - id: DX4
      topic: "DSP determinism kit and device test rules"
      summary: "New crate composer-dsp: pure functions and small structs (smoother, linear ramp, biquad from tan approximations, delay ring, peak follower, noise from a seeded 32 bit generator, half band oversampler, radix 2 FFT). Rules from principles. Every device ships a golden fingerprint test (native) and a wasm parity test (bytes of the first N seconds), plus tests that process never allocates."
    - id: DX5
      topic: "bypass and latency"
      summary: "Disabling a device resets its state and crossfades dry and wet over 5 ms (frames from the sample rate, a constant in code). Devices report latency in frames at setup and on setting changes. The engine inserts alignment delay only at track sums and sends. Wave A has no latent devices and asserts latency 0."
      inspired_by: "ref-opendaw-devices framework.bypass (rethink), framework.latency (borrow)"
    - id: DX6
      topic: "MIDI effect chain runtime"
      summary: "MIDI effects transform a block of note events in tick positions before the instrument. Notes carry ids; a device rewrites on and replays the rewrite on off by id; out of range drops, never clamps; at equal tick off before on; chance is a hash of note identity and cycle, never a running random stream. State in preallocated tables with fixed capacities and a documented overflow rule (drop the new note on, pass its off)."
      inspired_by: "ref-opendaw-devices framework.midi_events, devices.midi_effects"
    - id: DX7
      topic: "licence gate for devices"
      summary: "Any device whose reference is GPL, commercial excluded, or fitted to a commercial plugin is built from public algorithms only, with our own constants and listening tests; no fixture renders from commercial plugins are kept in the repo. Plugins hosted at run time keep their own licence and are never bundled without a licence field."
      inspired_by: "ref-opendaw-devices licence_summary"

licence_notes:
  stays_out:
    - "Compressor as a port: the reference lists it as a ported plugin excluded from its commercial licence; upstream licence not verified (believed copyleft). Do not port or transcribe. DV21 designs our own from the public feed forward structure."
    - "Tubular (six operator FM): derived from Dexed (GPL-3.0). Not planned."
    - "Mastering (Matchering, GPL-3.0). Not planned."
  own_tuning_only:
    - "pd_synth: the reference constants are fitted to a commercial emulation. DV33 uses only the public concept (bent cosine phase map, knee moved by one amount, 8 stage envelopes) and our own tuning."
    - "acid_bass: the reference is a transcription of an outside private project fitted to a commercial plugin. DV37 is optional and our own design."
  public_algorithms_ok:
    - "Freeverb (public domain), Dattorro plate (published), YIN and TD-PSOLA (published), Gardner partitioned convolution (published), Linkwitz-Riley crossover, RBJ biquad cookbook, PolyBLEP, half band oversampling, mid side width."
  needs_review_before_shipping:
    - "neural amp: NAM model file format and any inference core licence, and Tone3000 service terms (third party account, API terms). DV53 starts with this review."
    - "web plugin catalogue: per plugin licence data. CLAP itself is MIT."
    - "if the product goes AGPL (D2) the whole reference could be reused with notices; this plan stays clean room so both outcomes work."

ranked_waves:
  - {rank: 1, wave: A, why: "Without a chain model and parameter schema nothing else can land; the cheap effects prove it end to end (command, hash, render, wasm, UI, MCP) at low risk."}
  - {rank: 2, wave: B, why: "Dynamics and EQ are what makes a mix usable; needs sidechain routing and latency alignment, so it follows the framework."}
  - {rank: 3, wave: C, why: "Instruments change what the product sounds like (owner dislikes stock sounding voices); heavier model change (instrument slot) so it follows a proven chain."}
  - {rank: 4, wave: D, why: "MIDI effects need the event chain runtime and the instrument slot; high value for beginners (arpeggio, transpose, chords)."}
  - {rank: 5, wave: E, why: "Heavy DSP, scripting and hosting: each one is a project; WebCLAP hosting depends on the browser plugin work in ref-webclap and breaks bit for bit determinism by nature."}

