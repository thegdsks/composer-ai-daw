tasks:
  # ---------------- Wave A: framework and the cheapest effects ----------------
  - id: DV01
    wave: A
    lane: core
    size: S
    needs: []
    external_needs: []
    decides: ["DX1", "DX2", "DX3", "DX4", "DX5"]
    title: Record the device decisions
    inspired_by: "ref-opendaw-devices framework (device_kinds, parameters, bypass, latency)"
    brief:
      files: ["notes/decisions.yaml"]
      do: "Add DX1 to DX5 as proposed entries with real D numbers, each with summary, rule (demo hash 0x9234f99f24d6c39d and every existing golden unchanged for projects without devices), inspired_by and open_points. Ask for owner or orchestrator accept in the task message."
      exit:
        - "notes/decisions.yaml parses; entries present; no existing entry edited"
  - id: DV02
    wave: A
    lane: core
    size: L
    needs: ["DV01"]
    external_needs: []
    title: Device chains in the model, commands and hash
    inspired_by: "ref-opendaw-devices framework.device_kinds; own D26 skip default hashing"
    brief:
      files: ["core/composer-model/src/project.rs", "core/composer-model/src/hash.rs", "core/composer-model/src/change.rs", "core/composer-model/src/rules.rs", "core/composer-model/src/validate.rs", "core/composer-model/src/id.rs", "core/composer-commands/src/command.rs", "core/composer-commands/src/describe.rs", "core/composer-format (project section)"]
      do: "Types Device{id, kind, enabled, params} and DeviceKind (a closed enum of type ids, a catalogue lookup in composer-catalogue style, not strings). Track.devices (audio chain) and Project.master_devices, both skipped while empty. Commands: add_device {owner, id, kind, index, params?}, remove_device, move_device, set_device_enabled, set_device_param {device, param, value}, set_device_params (one group). Validation: ranges from the parameter table, chain length cap from env, unknown param id rejected, duplicate id rejected. Change variants carry old values so undo is exact. Chains hash after tracks only when present, in chain order, params sorted by id with defaults skipped."
      exit:
        - "cargo test -p composer-model -p composer-commands pass; demo hash 0x9234f99f24d6c39d and all existing goldens unchanged"
        - "round trip: add, set, move, remove, undo all, redo all, state_hash equals recorded values at every step"
        - "describe() lists the new commands and the conformance test between describe and command meta passes"
        - "load fails closed with a stable code on a project that names an unknown device kind or out of range value"
  - id: DV03
    wave: A
    lane: core
    size: M
    needs: ["DV01"]
    external_needs: []
    title: composer-dsp kit (deterministic math and small blocks)
    inspired_by: "ref-opendaw-devices framework.determinism_observations, framework.smoothing_and_first_delivery (rethink: own math, no transcendental std calls)"
    brief:
      files: ["core/composer-dsp (new crate)", "core/composer-engine/src/math.rs (reuse sin_turns)", "Cargo.toml (workspace member, ask first)"]
      do: "Pure functions using only add, multiply, divide, floor, square root: sin, cos, exp2, log2, tanh, pow by exp2 and log2, db to gain and back, tan for filter design (rational approximation), a seeded 32 bit generator. Structs with no heap: one pole smoother, linear ramp (snaps to target on the last step, no op when already there), RBJ biquad with coefficient set, delay ring over a caller supplied slice (pow2 size, fractional read), peak follower, denormal flush. Accuracy targets in tests (for example exp2 and tanh within 1e-5 relative over the used range)."
      exit:
        - "cargo test -p composer-dsp pass; a fingerprint test of each function over a fixed sweep (hash of the bit patterns) is identical native and wasm (run in composer-wasm tests)"
        - "no function in the crate calls f32 sin, cos, exp, ln, powf, tanh, tan (grep gate in a test)"
  - id: DV04
    wave: A
    lane: core
    size: L
    needs: ["DV02", "DV03"]
    external_needs: []
    title: Device runtime in the engine (chain, bypass, control period, blob)
    inspired_by: "ref-opendaw-devices framework.reset, bypass, latency, no_alloc, smoothing_and_first_delivery"
    brief:
      files: ["core/composer-engine/src/devices.rs (new)", "core/composer-engine/src/engine.rs", "core/composer-engine/src/mix.rs", "core/composer-wasm/src/blob.rs", "core/composer-render/src/lib.rs", "core/composer-engine/tests/no_alloc.rs"]
      do: "Trait Device in composer-engine: spec table (params), set_param(id, value) called only on change at the control period, process(left, right, frames) in place on stereo, reset(), latency() in frames, setup(sample_rate) allocating everything. Engine builds the chains at setup (allocation allowed there only). Order per track: instrument, track chain, fader and pan, sends, master chain, master volume. Bypass: reset on disable plus 5 ms dry wet crossfade. Chains run at the render quantum split on control period boundaries so parameter changes land on a frame that depends only on the absolute frame. Blob v5 adds a devices section (counts validated against remaining length before any allocation, as D34). No devices means the old path is taken (demo hash unchanged)."
      exit:
        - "cargo test -p composer-engine -p composer-render -p composer-wasm pass; tests/no_alloc.rs runs with a 3 device chain on every track"
        - "offline render equals wasm session output bit for bit for a project with a chain (a test like composer-wasm/tests/mix.rs)"
        - "block size independence: rendering with block sizes 1, 32, 100, 128, 4096 gives identical bytes"
        - "demo hash 0x9234f99f24d6c39d unchanged; bench master chain off by default"
  - id: DV05
    wave: A
    lane: core
    size: M
    needs: ["DV04"]
    external_needs: []
    decides: ["DX3"]
    title: Automation targets for device parameters
    inspired_by: "ref-opendaw-devices framework.automation_clock; own D36"
    brief:
      files: ["core/composer-model/src/automation.rs", "core/composer-commands/src/command.rs", "core/composer-engine/src/automation.rs", "core/composer-wasm/src/blob.rs", "notes/decisions.yaml"]
      do: "AutomationTarget::Device {owner, device, param}; lanes hold integer values in the parameter unit; compile to frames with the tempo map as D36 does; evaluate at control period; a setting parameter is refused as a target. Existing add_automation_point family gains the new target (additive, no signature change)."
      exit:
        - "cargo test -p composer-model -p composer-commands -p composer-engine pass; existing lane tests and goldens unchanged"
        - "a lane on a delay feedback parameter renders identically in offline and wasm, and under four different block sizes"
        - "tests/no_alloc.rs covers a device lane with all curves"
  - id: DV06
    wave: A
    lane: sound
    size: S
    needs: ["DV04"]
    external_needs: []
    title: stereo_tool (balance, width, polarity, swap)
    inspired_by: "ref-opendaw-devices devices.effects_cheap.stereo_tool"
    brief:
      files: ["core/composer-devices (new crate, one module per device) or core/composer-engine/src/devices/stereo_tool.rs", "core/composer-devices tests"]
      do: "Parameters per the reference note: volume (centi dB, minimum means silence), balance, width (negative to mono, positive wide), invert left, invert right, swap, pan law setting (linear or equal power). One 2x2 matrix per control period, glided over 5 ms, first delivery jumps. Own design of the matrix algebra from mid side theory."
      exit:
        - "unit tests: unity passes through exactly; full mono gives equal channels; swap and invert behave; equal power at centre is minus 3 dB per side"
        - "golden fingerprint of 2 s of a fixed signal, identical native and wasm"
  - id: DV07
    wave: A
    lane: sound
    size: M
    needs: ["DV04"]
    external_needs: []
    title: stereo_delay (tempo synced echo with cross feedback and filter)
    inspired_by: "ref-opendaw-devices devices.effects_cheap.stereo_delay (borrow, minus the avoid items)"
    brief:
      files: ["core/composer-devices/src/stereo_delay.rs", "core/composer-engine/src/tempo.rs (read tempo per control period)"]
      do: "Time in note fractions (index table from off to one bar) plus milliseconds, pre delay per side, feedback, cross, tilt filter (bypass at zero, high pass positive, low pass negative), wet and dry in dB, slow wobble depth and speed. Ring sized at setup for one bar at the slowest allowed tempo (env) plus margin. Time changes glide over 250 ms with fractional read. Own limiter on the return with explicit times in seconds. Tail survives seeks and loop wraps, clears on transport stop and on bypass."
      exit:
        - "impulse test: echoes at the expected frame for sync 1/8 at 120 bpm, decaying by the feedback"
        - "tempo change mid render keeps the tail continuous (no discontinuity above a stated threshold)"
        - "tests/no_alloc.rs passes with the delay at maximum time; memory per instance reported in a test and under the env budget"
  - id: DV08
    wave: A
    lane: sound
    size: S
    needs: ["DV04"]
    external_needs: []
    title: bit_crusher
    inspired_by: "ref-opendaw-devices devices.effects_cheap.bit_crusher"
    brief:
      files: ["core/composer-devices/src/bit_crusher.rs"]
      do: "Sample rate reduction with a fractional hold phase and an anti alias low pass that follows the reduced rate, bit depth 1 to 16, boost with half compensation at the output, mix. The rate target is applied per control period and glides, never per block."
      exit:
        - "bits = 1 snaps outputs to the three levels; mix 0 and boost 0 is bit exact pass through"
        - "golden fingerprint native and wasm"
  - id: DV09
    wave: A
    lane: sound
    size: S
    needs: ["DV04"]
    external_needs: []
    title: noise_gate (internal detector)
    inspired_by: "ref-opendaw-devices devices.effects_cheap.noise_gate; sidechain input comes in DV20"
    brief:
      files: ["core/composer-devices/src/noise_gate.rs"]
      do: "Threshold, return (hysteresis), attack, hold, release, floor (with a true off at the minimum), inverse. Detector: peak follower with fixed decay. One mapping per parameter lives in the parameter table (no second mapping elsewhere). Starts closed and silent after reset."
      exit:
        - "test: loud then quiet detector opens then closes within release plus hold; inverse flips it; floor minimum gives exact silence"
        - "golden fingerprint native and wasm"
  - id: DV10
    wave: A
    lane: sound
    size: S
    needs: ["DV04"]
    external_needs: []
    title: waveshaper
    inspired_by: "ref-opendaw-devices devices.effects_cheap.waveshaper"
    brief:
      files: ["core/composer-devices/src/waveshaper.rs"]
      do: "Curve setting (hard clip, soft cubic, tanh, sigmoid, arctan, asymmetric; an enum index, not a string), input gain, output gain, mix, all gains glided at the control period. Curves built from the DSP kit functions. Offer an optional 2x oversampling setting once DV25 (half band) exists (note in the task, not a dependency)."
      exit:
        - "hard clip clamps; mix 0 is exact dry; golden fingerprint native and wasm for each curve"
  - id: DV11
    wave: A
    lane: sound
    size: S
    needs: ["DV04"]
    external_needs: []
    title: auto_pan (tempo synced tremolo and pan)
    inspired_by: "ref-opendaw-devices devices.effects_cheap.auto_pan"
    brief:
      files: ["core/composer-devices/src/auto_pan.rs"]
      do: "Rate as a fraction index, depth, slope, symmetry, phase offset, channel offset. Phase from the song position in ticks (sample accurate from the tempo clock), so a seek lands on the right phase. One pole smoothing of each channel gain. Shape function from the DSP kit pow."
      exit:
        - "depth 0 is exact unity; channel offset 180 degrees alternates left and right; phase after a seek equals phase of continuous play at the same tick"
        - "golden fingerprint native and wasm"
  - id: DV12
    wave: A
    lane: interfaces
    size: M
    needs: ["DV02", "DV06"]
    external_needs: []
    title: CLI, daemon and MCP surface for devices
    brief:
      files: ["cli/", "daemon/composerd/src/methods.rs", "mcp/composer-mcp/src/tools.rs", "core/composer-commands/src/describe.rs"]
      do: "A read method device.types returning the catalogue (kind, we_call_it ui name, parameter table with unit, range, default, curve, automatable flag, version), device.list for a chain, and the new commands as tools through describe (parity rule: no UI only action). Tool descriptions state units so an agent does not guess scales. Proposals (D28) can contain device commands."
      exit:
        - "cargo test -p composerd -p composer-mcp pass; MCP tool count test updated"
        - "parity test: add a stereo_tool through MCP, read it through the daemon, state_hash equal"
  - id: DV13
    wave: A
    lane: ui
    size: M
    needs: ["DV06", "DV12"]
    external_needs: []
    title: Device chain panel generated from the catalogue
    brief:
      files: ["web/app/src/ui/Devices.tsx (new)", "web/app/src/state/commands.ts", "web/app/src/backend/types.ts", "web/app/src/model.ts"]
      do: "Per track and master: ordered list of device cards with enable switch, remove, drag to reorder, and a parameter row per automatable parameter generated from device.types (slider or knob by curve, unit label, double click to default, right click add automation lane). Plain names. One undo step per gesture (group on pointer up). Keyboard operable sliders with role slider."
      exit:
        - "vitest: unit scaling and curve mapping round trips for each curve kind within one integer step"
        - "e2e devices: add Echo to track 1, change feedback, undo, redo, state matches; automation lane appears"
  - id: DV14
    wave: A
    lane: perf
    size: S
    needs: ["DV04", "DV07"]
    external_needs: []
    title: Device scale budgets in bench
    brief:
      files: ["bench/composer-bench", "bench/budgets.env", "bench/baseline.yaml"]
      do: "Generated stress project with COMPOSER_BENCH_DEVICE_TRACKS tracks each with a chain of COMPOSER_BENCH_DEVICE_CHAIN effects (stereo tool, delay, crusher, gate, waveshaper, auto pan in rotation), 48 kHz render of N seconds. Budgets from env: render real time factor, state_hash ms with devices, apply ns for set_device_param, memory per delay instance."
      exit:
        - "cargo run --release -p composer-bench with the env set reports and enforces the new budgets; baseline.yaml updated with measured values and headroom"
        - "thresholds only from env, none hard coded"

  # ---------------- Wave B: dynamics, EQ and space ----------------
  - id: DV20
    wave: B
    lane: core
    size: L
    needs: ["DV04"]
    external_needs: []
    title: Sidechain routing and latency alignment
    inspired_by: "ref-opendaw-devices framework.sidechain, framework.latency"
    brief:
