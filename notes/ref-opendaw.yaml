# Verified reference map of openDAW. Paths in src: are relative to the clone root
# <reference checkout>/opendaw. Facts only from reading code or docs. Behavior is described, not copied.
# Reimplement from understanding; the source is AGPL-3.0-or-later (see meta.license).

meta:
  clone_commit: 363e54eacd25e85535b33bbb0c722e594da6f6d5
  license:
    value: AGPL-3.0-or-later
    src: [LICENSE, package.json (license field), README.md:6-12]
    note: Copyleft. Copying code into a closed product is not allowed; ideas and formats are free.
  languages:
    - TypeScript (npm workspace, turborepo): packages/lib, packages/studio, packages/app
    - Rust (cargo workspace, compiled to WebAssembly): crates/
    - Sass (UI styling), homebrew JSX runtime (no React, no virtual DOM)
  src_languages: introduction.md:1-60
  layout:
    src: introduction.md:1-60
    layers: "config -> lib/* (DAW-agnostic) -> studio/* (DAW domain) -> app/* (web apps)"
    rust_side: "leaf crates (math, dsp, value) -> infra (engine-env, processors, transport, voicing, abi) -> cdylibs (engine, stock-devices/*, stretch-wasm, sine)"
    generated_gitignored:
      - packages/studio/boxes/src/** (TS box classes, from forge-boxes schema)
      - crates/studio-boxes/src/registry.rs (Rust registry, same generator run)
      - packages/studio/adapters/src/index.ts, packages/studio/scripting/src/api.declaration.d.ts
    src_generated: introduction.md (section Generated Code)
  default_engine: "WASM (Rust) engine is default since mid 2026; TS engine (core-processors) still exists as fallback"
  src_engine: [introduction.md (core-wasm section), packages/studio/sdk/README.md:22-45]
  repo_posture:
    - AI-assisted code allowed if contributor understands every line; AI process documented in /plans
    - plans/*.md hold design docs written during implementation (this is where intent lives)
    - docs/error-triage.md triages production error reports
  src_posture: [README.md (Looking for Contributors), docs/error-triage.md]
  wasm_contract_markers: "About 70 files carry the comment tag WASM CONTRACT where TS and Rust must stay byte-identical (PPQN, serializer layout, update tags, sync-log commit layout). Grep for it before changing any shared format."
  src_wasm_contract: [packages/lib/box/src/serializer.ts:5-8, packages/lib/box/src/updates.ts:7, packages/lib/dsp/src/ppqn.ts:11, packages/studio/core/src/sync-log/Commit.ts:6-10]

document_model:
  summary: "Whole project is one typed object graph (BoxGraph). Everything (tracks, regions, notes, devices, automation, selection, even UI view state) is a box in it. Edges are pointer fields. All edits are transactions that emit a stream of 4 update kinds. That stream drives undo, engine sync, collab, and scripting."
  concepts:
    box:
      what: "Typed record with a UUID and a fixed set of fields addressed by small integer keys. Subclass of abstract Box. Has a name (class name) and pointerRules (what may point at it, and whether at least one incoming pointer is mandatory)."
      src: packages/lib/box/src/box.ts:35-60
      resource_types: "A box may be flagged resource: preserved (UUID kept on copy/paste, content addressed audio files), internal (UUID regenerated), shared (regenerated and incoming edges not followed)."
      src_resource: packages/lib/box/src/box.ts:35-41
    field:
      what: "Slot inside a box keyed by an int16. Kinds: primitive (int32, float32, boolean, string, bytes), plain container field (holds children and acts as pointer target), pointer, array, object."
      src: [packages/lib/box-forge/src/schema.ts:45-110, packages/lib/box/src/field.ts, packages/lib/box/src/primitive.ts]
      constraints: "Primitive fields carry constraints (min, mid, max, scaling such as decibel or linear, index, non-negative, or explicit values list) plus a unit string in the schema. Automation value mappings live in the adapters (createParameter), not the schema."
      src_constraints: [packages/studio/forge-boxes/src/schema/std/AudioUnitBox.ts:12-19, introduction.md (studio-adapters section)]
      keys_are_stable_ids: "Field keys are persisted ids. Deprecated fields stay in the schema with deprecated flag and are skipped on write. Pointer enum values are ordinals and APPEND ONLY."
      src_stable: [packages/lib/box/src/serializer.ts:11-14, packages/studio/enums/src/Pointers.ts:62]
    pointer:
      what: "Directed edge from a pointer field to a target vertex (a box or a field), typed by an enum member of Pointers. A target declares pointerRules.accepts (allowed pointer types), mandatory (needs at least one incoming), exclusive (at most one incoming)."
      src: [packages/lib/box/src/pointer.ts, packages/lib/box/src/pointer-hub.ts, packages/studio/forge-boxes/src/schema/std/AudioUnitBox.ts:33-45]
      mandatory_pointer_semantics: "A mandatory pointer means the owning box cannot live without its target. Deleting the target cascades: the owning box is deleted in the same transaction. Deleting a box also follows outgoing pointers downstream and mandatory incoming pointers upstream (graph.dependenciesOf)."
      src_cascade: docs/graph.md (sections Box Deletion and Cascade)
      containment_idiom: "Containment is modelled as child -> parent pointers with mandatory true. Example: a NoteRegionBox points to a TrackBox via regions (mandatory) and to its NoteEventCollection via events (mandatory). Order is an explicit int index field, not array order."
      src_containment: [packages/studio/forge-boxes/src/schema/std/timeline/NoteRegionBox.ts:10-14, packages/studio/forge-boxes/src/schema/std/timeline/TrackBox.ts:9-14]
    address:
      what: "UUID of a box plus a path of field keys. Used for every update and for linking TS and Rust (device parameters are bound by field-key path like [16,10], never a packed id)."
      src: [packages/lib/box/src/address.ts, crates/engine/src/param_automation.rs:17-21, crates/stock-devices/device-nano/src/lib.rs:35-46]
  schema_declaration_and_codegen:
    how: "Each box is a TS object (BoxSchema) in packages/studio/forge-boxes/src/schema/{std,devices}/**. Fields keyed by int. A generator (lib-box-forge, uses ts-morph) writes TS box classes plus a Rust registry. The schema file is the single source of truth for both languages."
    src: [packages/lib/box-forge/src/schema.ts, packages/lib/box-forge/src/ts-class-writer.ts, packages/lib/box-forge/src/rust-registry.ts, introduction.md (studio-forge-boxes section)]
    gotcha: "Generated outputs are gitignored, so a fresh clone does not type-check until the build runs."
    src_gotcha: introduction.md (Generated Code)
    legacy_parity: "Adding fields must keep old projects loading; devices test that schema defaults reproduce old behavior (legacy_parity tests)."
    src_parity: [crates/stock-devices/device-nano/src/lib.rs:11-12, crates/stock-devices/device-nano/tests/legacy_parity.rs]
  transactions:
    modify_flow: "BoxEditing.modify wraps a closure in begin/end transaction. End validates affected boxes (rolls the whole transaction back by applying inverse updates if validation fails), fires deferred pointer-hub notifications, then transaction observers, then editing observers. Nested modify just runs inline in the outer transaction."
    src: [docs/graph.md:1-40, docs/live-collab-conflict-resolve.md:1-40, packages/lib/box/src/editing.ts:240-275]
    invariant: "The graph is valid at every transaction end; failed validation rolls back everything."
    pointer_deferral: "Pointer changes inside a transaction are recorded and applied only at end, so code watching pointer hubs sees changes after all mutations."
    src_defer: docs/graph.md:24-48
  update_types:
    kinds: "Exactly four: new (uuid, class name, serialized fields), delete (same, enough to undo), pointer (address, old target, new target), primitive (address, type, old value, new value). Forward-only sync variants add update-bytes (range splice of a bytes field when cheaper than resending)."
    src: [packages/lib/box/src/updates.ts:7-50, packages/lib/box/src/sync-source.ts:55-80, crates/boxgraph/src/updates.rs:1-25]
    optimization: "optimizeUpdates collapses a transaction's update list before it becomes an undo step."
    src_opt: packages/lib/box/src/editing.ts:22,265
  undo_redo:
    model: "History is a list of marked steps; each step is a list of Modification (a set of Updates). Undo applies inverses (needs old values, which is why updates carry old and new). Redo replays forward."
    src: [packages/lib/box/src/editing.ts:20-50,63-76,178-240]
    marking: "modify(..., mark=true) seals a step. Unmarked pending changes (selection, edit pointers, gesture in progress) fold into the next marked edit instead of being their own undo entry. append() extends the previous step. beginModification and checkpoint give interactive drags with approve/revert and rollback/commit/discard."
    src_marking: [packages/lib/box/src/editing.ts:262-275, packages/lib/box/src/editing.ts:333-335]
    outside_history: "BoxEditing takes a predicate to exclude boxes (UI view state, selection) from history."
    src_outside: packages/lib/box/src/editing.ts:63-84
    saved_marker: "History index tracks the saved position so hasUnsavedChanges works across undo/redo; splicing away the saved state sets it to -1."
    src_saved: packages/lib/box/src/editing.ts:71-102
  serialization:
    box_wire_format: "Per box: magic FLDS, field count, then per field key (short), byte length (int), payload. Reader skips unknown keys, so it is forward compatible. Deprecated fields skipped on write."
    src: packages/lib/box/src/serializer.ts:5-36
    graph_checksum: "BoxGraph.checksum folds every box's write into a hash; used to prove a mirror (engine, collab peer, script origin) equals the source."
    src_checksum: packages/lib/box/src/graph.ts:251-255
    project_file: "ProjectSkeleton.encode: magic 0x4F50454E, format version int, length, then the whole box graph bytes."
    src_project_file: packages/studio/adapters/src/project/ProjectSkeleton.ts:36,99-108
    migration: "ProjectMigration runs per-box migrations on load (migration directory); loading tolerates unknown fields."
    src_migration: [packages/studio/core/src/project/ProjectMigration.ts, packages/studio/core/src/project/migration]
  sync:
    ts_to_ts_and_rust: "SyncSource subscribes to a graph and, on each committed (not rolled back) transaction, sends the update list over a messenger channel. SyncTarget applies forward tasks (createBox, setValue, splice bytes, retarget pointer) inside a transaction the caller owns. Initial state is one 'new' task per box."
    src: [packages/lib/box/src/sync-source.ts:9-50, packages/lib/box/src/sync-target.ts:12-54]
    rust_mirror: "Rust crate boxgraph parses the same byte stream and maintains a live mirror; it can revert an aborted transaction. The engine rejects an invalid transaction and reports an error."
    src_rust: [crates/boxgraph/src/updates.rs:1-25, packages/studio/core-wasm/src/processor.ts:632-636]
    integrity: "Main thread sends the source graph's 32 byte checksum; the worklet compares it with the engine's rolling checksum and errors on divergence."
    src_integrity: packages/studio/core-wasm/src/protocol.ts:11-19
  adapters:
    what: "Adapters wrap a raw box to give behavior: parameter value mappings (automatable parameters), sorted child collections, note and clip sequencing, engine addresses, validation. They are the shared vocabulary of UI, TS engine and WASM engine. A box is dumb data; the adapter is the object the UI binds to."
    src: [introduction.md (studio-adapters), packages/studio/adapters/src/BoxAdapter.ts:1-8]
    lookup: "BoxAdapters.adapterFor(box, typeCheck) returns a cached adapter per box UUID, created via a visitor over box classes; adapters are Terminable and die with their box."
    src_lookup: packages/studio/adapters/src/BoxAdapters.ts:246
    device_adapter_shape: "A device adapter exposes type (audio-effect, midi-effect, instrument), accepts (audio or midi), a ParameterAdapterSet built via createParameter per automatable field (with value mapping and string mapping), host pointer, index/label/enabled/minimized fields, and deviceHost()."
    src_device: packages/studio/adapters/src/devices/audio-effects/DelayDeviceBoxAdapter.ts:26-60
  domain_shape_of_a_project:
    root: "RootBox points mandatory to a TimelineBox and a Groove, holds users, the audio unit collection, base frequency 440 Hz (range 400 to 480)."
    src: packages/studio/forge-boxes/src/schema/std/RootBox.ts:7-19
    audio_unit: "AudioUnitBox is the channel strip. type string: instrument, bus, aux, output. Fields: index, volume (dB, -96 to +6), panning, mute, solo. Containers: tracks, midi-effects, input (instrument host or audio output), audio-effects, aux-sends, plus output pointer and capture pointer."
    src_unit: [packages/studio/enums/src/AudioUnitType.ts:1-5, packages/studio/forge-boxes/src/schema/std/AudioUnitBox.ts:5-60]
    track: "TrackBox lives under an AudioUnitBox. type: 0 undefined, 1 notes, 2 audio, 3 value (automation). Holds regions and clips collections; target pointer says what it controls (a unit's note input or an automatable field)."
    src_track: [packages/studio/forge-boxes/src/schema/std/timeline/TrackBox.ts:7-20, packages/studio/adapters/src/timeline/TrackType.ts:3]
    region: "NoteRegionBox, AudioRegionBox, ValueRegionBox: position, duration, loop-offset, loop-duration (all PPQN), mute, label, hue, optional groove pointer. Content lives in a separate collection box (NoteEventCollectionBox etc.) so regions can share or loop content."
    src_region: packages/studio/forge-boxes/src/schema/std/timeline/NoteRegionBox.ts:8-22
    time_unit: "PPQN with Quarter = 960, Bar (4/4) = 3840. Same constants mirrored in Rust."
    src_time: packages/lib/dsp/src/ppqn.ts:11-15
    selection_in_graph: "Selection and view state are boxes too (SelectionBox with mandatory pointers selection and selectable), so they sync, can be excluded from undo, and cascade-delete with the selected object."
    src_sel: [docs/graph.md (SelectionBox Cascade), packages/studio/forge-boxes/src/schema/std/SelectionBox.ts]

engine_flow:
  topology:
    summary: "Main thread owns the authoritative box graph. A SyncSource streams transaction bytes over a typed message channel to an AudioWorklet that hosts engine.wasm (Rust). The worklet applies them to the Rust BoxGraph mirror, reconciles processors, and renders 128 frame quanta. Devices are separate position independent wasm side modules linked into the same linear memory and function table."
    src: [docs/wasm-audio-engine-flow.svg, introduction.md (Runtime Topology, core-wasm), packages/studio/core-wasm/src/protocol.ts:1-26]
    channels: "lib-runtime Communicator over MessagePort, one direction each. engine-sync-bytes (applyUpdates, checksum), engine-commands (play, stop, setPosition, recording prep, clip schedule, note signals, wclap relay, querySignalGraph), engine-to-client (state about 30 Hz, heap stats about 1 Hz, errors), engine-preferences."
    src_channels: [packages/studio/core-wasm/src/processor.ts:116,192,245-260, packages/studio/adapters/src/protocols.ts:46-90, docs/wasm-audio-engine-flow.svg (labels)]
    telemetry_up: "LiveStream (lib-fusion) carries meters, spectra, note activity from audio thread to UI lock-free."
    src_live: [introduction.md (Runtime Topology), packages/lib/fusion/src/live-stream/README.md]
    memory_model:
      current_code: "Engine linear memory is NON-shared, created inside the worklet or offline worker, starts at 16 MB (256 pages), grows on demand via the talc allocator. Every grow detaches JS views, so views are rebuilt after allocation. Audio frames are copied into engine memory through allocate/set calls (click sound, frozen audio, samples)."
      src: [packages/studio/core-wasm/src/engine-modules.ts:64-70, packages/studio/core-wasm/src/processor.ts:296-326]
      discrepancy: "The 2026-06-25 flow diagram and the sdk README describe SharedArrayBuffer and cross-origin isolation (COOP/COEP). Code and plans/wasm-audio/memory-ceiling.md say non-shared memory. Treat the diagram as older; confirm before relying on SAB. Control flags still use a SharedArrayBuffer Int32Array."
      src_disc: [docs/wasm-audio-engine-flow.svg, packages/studio/sdk/README.md:22-30, plans/wasm-audio/memory-ceiling.md:34-40, packages/studio/core-wasm/src/processor.ts:165]
  worklet_shell:
    what: "processor.ts is a thin TS AudioWorkletProcessor: creates memory, instantiates engine and device modules, wires channels, calls engine render each process(), feeds meters/peaks/analysers, and on any wasm trap invalidates the processor and reports so the main thread offers a restart."
    src: [packages/studio/core-wasm/src/processor.ts:376-480,632-640, plans/wasm-audio/memory-ceiling.md:45-60]
    boot_and_linking: "boot.ts and device-linker.ts instantiate engine.wasm (shared function table, 512 slots reserved) then link every device_*.wasm into the same memory and table; devices are looked up by device BOX TYPE name."
    src_boot: [packages/studio/core-wasm/src/boot.ts:15,57, packages/studio/core-wasm/src/engine-modules.ts:72-80, packages/studio/core-wasm/src/protocol.ts:5-10]
    offline_render: "The same engine runs in a worker (offline-worker.ts) for mixdown, stems, freeze; OfflineEngineRenderer abstracts it."
    src_offline: [packages/studio/core-wasm/src/offline-worker.ts, introduction.md (studio-core section)]
    engine_variant: "EngineFacade and EngineVariant let the app pick WASM or TS engine; WasmEngine.install, ensureReady, setEnabled (persists opt-out)."
    src_variant: [packages/studio/sdk/README.md:22-45, packages/studio/core/src/EngineVariant.ts]
  block_processing:
    quantum: "RENDER_QUANTUM = 128 frames. A quantum is split into blocks at tempo change grid (TEMPO_CHANGE_GRID = 80 pulses) and loop boundaries; every processor receives the list of blocks (ProcessInfo). A block carries pulse range p0..p1, sample range s0..s1, bpm, anchor, discontinuity flag."
    src: [crates/transport/src/transport.rs:1,14-17,188-213, crates/engine-env/src/process_info.rs:1-8]
    fixed_bpm_fast_path: "With fixed bpm and no events a quantum is exactly one block."
    src_fast: crates/transport/src/transport.rs:202-215
    render_paths: "render_quantum while playing, render_paused when stopped (position advances free-run so audition and live notes still sound); output bus summed to L/R; metronome mixed per moving block, delayed by master arrival."
    src_paths: [docs/wasm-audio-engine-flow.svg (labels), plans/delay-compensation.md:48-52]
    graph_build: "On apply_updates the engine reconciles its processor graph from boxes: units, device chains, topological sort (cycle check would_cycle). The graph is a DAG, no feedback routes."
    src_graph: [docs/wasm-audio-engine-flow.svg, crates/engine-env/src/topological_sort.rs, plans/delay-compensation.md:21]
    no_alloc_in_render: "Allocator rule: no allocation in process; buffers sized during reconcile. Voices live in pre-zeroed fixed pools."
    src_alloc: [plans/delay-compensation.md:112-114, crates/stock-devices/device-nano/src/lib.rs:25]
  scheduling:
    time_domain: "Notes and automation are scheduled in PPQN pulses; sample offsets are resolved last via host_pulse_to_offset inside the block."
    src: [docs/wasm-audio-engine-flow.svg (PROCESSOR GRAPH), crates/abi/src/lib.rs:158]
    notes: "Per audio unit, NoteSequencer is a pull source: for a block's pulse range it reads note regions through a content source, resolves region looping (locate_loops), emits globally positioned note-on events, and keeps held notes in one retainer so it can emit note-complete at span end or immediately on transport stop or loop wrap. Chance rolls use a seeded PRNG never reseeded. Live and audition notes are emitted before the transport gate so they sound while stopped."
    src_notes: crates/engine-env/src/note_sequencer.rs:1-30
    midi_fx_chain: "MIDI effects are pull sources chained before the instrument (instrument <- fx <- sequencer). Each device pulls its upstream for [from,to) via host_pull_events."
    src_midi: [crates/stock-devices/device-pitch/src/lib.rs:1-4, crates/abi/src/lib.rs:157]
    audio_regions: "AudioRegionPlayer is the unit's source for audio tracks: per quantum it range-queries sorted regions, resolves source sample, renders no-stretch at native speed with a free-running read head reseated from the tempo map only at discontinuities (region entry, loop wrap, locate); linear interpolation across rate mismatch; gain and fade envelope plus boundary declick. Time-stretch and pitch-stretch live in time_stretch.rs. Clips (launch) play a virtual region via a shared ClipSequencer; timeline regions play only in clip-free sections."
    src_audio: [crates/engine/src/audio_region_player.rs:1-20, crates/engine/src/time_stretch.rs]
    tempo_map: "Tempo is a step function sampled on the TEMPO_CHANGE_GRID from a live ValueCurve (tempo automation) or constant nominal bpm. interval-to-seconds integrates over the grid so no-stretch audio stays correct under tempo ramps."
    src_tempo: [crates/engine/src/tempo_map.rs:1-30, crates/transport/src/transport.rs:17]
    automation: "Each automatable parameter binds 1:1 to a Value TrackBox (field-key path to track). Value regions are loopable spans over value-event collections; the value is read live at a pulse: take the region at or before position, read its loop-local curve, otherwise hold the boundary value. Devices poll host_update_parameters on a shared update clock grid (host_first/next_update_position)."
    src_auto: [crates/engine/src/param_automation.rs:1-20, crates/abi/src/lib.rs:164-166, crates/engine-env/src/update_clock.rs]
    groove: "Groove warps note positions through host_groove_warp and unwarp; the groove effect pulls upstream over the unwarped range then maps positions."
    src_groove: [crates/stock-devices/device-zeitgeist/src/lib.rs:1-4, crates/abi/src/lib.rs:179-180]
    other_tracks: "Marker track, signature track, harmony track (chord and key events), modulation and param-automation each have an engine module."
    src_other: [crates/engine/src/marker_track.rs, crates/engine/src/signature_track.rs, crates/engine/src/harmony_track.rs, crates/engine/src/modulation.rs]
  delay_compensation:
    plan_status: "Phases 0 to 6 done as of 2026-10-20; phase 7 (monitoring) and playhead subtraction open."
    src: plans/delay-compensation.md:60-70
    algorithm: "Each node reports own latency (default 0). After every reconcile (or when a latency changes) the engine walks the existing topological order once and computes arrival(n) = own(n) + max(arrival of data predecessors). At every junction where signals meet (bus sources, aux sends, sinks, Playfield or composite slot sums, effect composite dry/wet, sidechain ports, metronome) each input gets a delay line of max(arrival) minus arrival(input). Delay lines live on junction inputs, not on plugins, so no new graph nodes and no rewiring. Sidechain edges are order-only edges that never raise a consumer arrival."
    src_algo: plans/delay-compensation.md:21-53,90-100
    zero_cost: "A project with no latent device computes zero everywhere, has no delay line and renders bit-identical."
    src_zero: plans/delay-compensation.md:52
    latency_reporting: "ABI import host_set_latency(frames) callable from init and parameter_changed. Compressor and Maximizer report look-ahead (measured 240 frames at 48 kHz), Fold reports oversampling latency, Autotune reports PSOLA delay. WCLAP plugins report via the CLAP latency extension. Scripts declare latency (Werkstatt: @latency directive or this.latency)."
    src_lat: [plans/delay-compensation.md:60-86, crates/abi/src/lib.rs:182]
    automation_alignment: "Automation and modulation of a latent node are evaluated at position minus arrival through playhead_history (exact across tempo changes and loops); a lagged update clock keeps step edges sample aligned."
    src_auto_align: [plans/delay-compensation.md:60-68, crates/engine/src/playhead_history.rs]
    recording_and_offline: "Recorded takes and MIDI out shift by total PDC; offline render renders extra frames and drops the first total; stems delayed by total minus tap arrival; frozen buffers trimmed by own chain latency."
    src_rec: plans/delay-compensation.md:104-112
    cap: "Compensation delay capped at MAX_COMPENSATION_SECONDS = 0.1; no PDC on/off switch."
    src_cap: plans/delay-compensation.md:155-160
  bridges_back_to_host: "ABI host imports let side modules reach JS-hosted things: NAM neural amp (host_nam_*), WCLAP plugin hosting (host_wclap_*), user scripts (host_script_*), sample and soundfont resolution, panic reporting."
  src_bridges: crates/abi/src/lib.rs:156-234

devices:
  common_pattern:
    summary: "Each stock device is its own cdylib crate producing a tiny position independent wasm module (about 2 KB after pruning), depending only on abi, math, dsp (and voicing for instruments). It implements one of three ABI traits and the engine calls it through the shared function table. Parameters are bound by field-key path; samples and soundfonts by observed pointer fields; state is a fixed block assigned by the engine, no heap."
    src: [introduction.md (Compiled artifacts), crates/abi/src/lib.rs:1623-1700,1789-1830,1880-1900]
    traits:
      Instrument: "process_audio(state, stereo out, block), handle_event (note on/off/choke), optional generate_events, init(sample_rate), parameter_changed, field_changed, sample_changed, soundfont_changed, reset, finish."
      AudioEffect: "process_audio in place stereo, init, parameter_changed, reset; may bind a sidechain and report latency."
      MidiEffect: "transform(input events, output events) returns count; pull-source variants pull upstream for [from,to)."
      src: crates/abi/src/lib.rs:1623,1789,1880
    params: "bind_parameter(field path) at init gives an id; the engine pushes ParamValue (float, int, bool) via parameter_changed, including automated values on the update clock. Value mappings (dB, linear, exponential) are applied inside the device using math::value_mapping, matching the TS adapter mapping."
    src_params: [crates/stock-devices/device-nano/src/lib.rs:28-50, crates/abi/src/lib.rs:160-166]
    voices: "voicing crate gives poly, mono and unison allocation shared by instruments; voices are a fixed pool, oldest stolen when full (Nano MAX_VOICES 64); mono, choke, one-shot behaviors consistent with the Playfield slot."
    src_voices: [crates/stock-devices/device-nano/src/lib.rs:1-12,25, docs/wasm-audio-engine-flow.svg (voicing note)]
    presets: "Presets are box-graph subtrees bundled with their resources (PresetBundle, PresetStorage, PresetMeta in studio-core; files with .odp suffix). Parameters live in boxes, so a preset is serialized boxes. A cloud preset catalog exists (FactoryCatalog)."
    src_presets: [packages/studio/core/src/presets/PresetBundle.ts, packages/studio/core/src/presets/PresetStorage.ts, packages/studio/core/src/opfs/AssetCache.ts:10, plans/preset-folders.md]
    port_discipline: "Most Rust devices are documented as faithful ports of earlier TS processors and must match them float for float (dsp crate says operation order matters); parity tests compare against TS."
    src_port: [introduction.md (Leaf crates, dsp row), crates/stock-devices/device-delay/src/lib.rs:1-3]
    to_add_a_device: "Touch: schema in forge-boxes, adapter in studio-adapters, effect or instrument factory in studio-core, Rust crate, crate list in core-wasm/build-wasm.sh. Five places."
    src_add: introduction.md (end, Where To Start Reading)
