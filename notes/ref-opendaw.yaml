  - "Whether any streaming or partial loading of long audio exists anywhere (searched docs and loaders, found only full decode); engine-side sample requests (Route F, drainResourceRequests) not read in detail."
  - "Exact SharedArrayBuffer usage today: sdk README and flow diagram say SAB plus COOP/COEP, code says non-shared engine memory; controlFlags is SAB. Which parts still require cross-origin isolation is unconfirmed."
  - "Whether openDAW-headless (external repo) or console commands (docs/error-triage.md:86 mentions read-only console commands) expose any command API; not in this clone."
  - "Extent to which UI-only gestures bypass ProjectApi (the app tree packages/app/studio/src/ui was only sampled, not audited)."
  - "How device presets are named and versioned in the cloud catalog (FactoryCatalog) and the exact .odp binary layout."
  - "Ephemeral box flag semantics (BoxSchema.ephemeral) and the modular synth runtime state (plans say modular effects are inaudible in the engine)."
