    - {theirs: "AudioUnit (AudioUnitBox)", meaning: "channel strip: input instrument or bus, fx chains, lanes, fader, pan, sends, output", we_call_it: channel, src: "packages/studio/forge-boxes/src/schema/std/AudioUnitBox.ts"}
