conventions:
  note: "Only their rules that matter when reading or borrowing. Ours differ where flagged."
  theirs:
    - rule: "Absolutely minimal comments: rare, one short line, never design rationale (belongs in commit message)."
      vs_ours: "Ours allow 1 to 3 lines explaining why. Their source is nonetheless comment heavy in places (plans, WASM CONTRACT notes)."
      src: CLAUDE.md:5
    - rule: "No blank lines inside method bodies; compact destructuring; no single-letter lambda names."
      vs_ours: "Not in our rules."
      src: CLAUDE.md:6-8
    - rule: "Use lib-std types: Optional<T>, Nullable<T>, isDefined, isAbsent; never write inline null or undefined unions; never use falsy checks for null."
      vs_ours: "Ours bans any and console.log; no equivalent type vocabulary mandated."
      src: CLAUDE.md:9-16
    - rule: "No definite assignment, no as any, no try/catch (use tryCatch from lib-std), no 'in' type checks."
      vs_ours: "We ban any too; try/catch not banned by us."
      src: CLAUDE.md:17-21
    - rule: "UUID.Bytes must use UUID.newSet or UUID.newMap (sorted), not Set or Map."
      vs_ours: "Project specific."
      src: CLAUDE.md:22
    - rule: "Option<T> for fallible returns; no ad hoc structural types; complex field initialisers in constructor; tsc with --noEmit."
      vs_ours: "Not in our rules."
      src: CLAUDE.md:23-26
    - rule: "Use .hidden CSS class instead of style.display."
      vs_ours: "We forbid inline styles entirely (Tailwind only); they use Sass."
      src: CLAUDE.md:12
    - rule: "Workflow: analyze bugs and propose fixes, wait for approval before editing; never commit unless explicitly asked; never Write over existing files, always Edit."
      vs_ours: "We commit and push branches on request; no per-edit approval."
      src: CLAUDE.md:28-32
    - rule: "AGENTS.md is only an auto-generated turborepo block telling agents to read the installed turbo docs before changing turbo config."
      vs_ours: "No equivalent."
      src: AGENTS.md:1-9
    - rule: "Contribution policy: small focused PRs, contributor must understand every line, AI process documented in /plans, schema field keys append only, WASM CONTRACT comments on shared formats."
      vs_ours: "Ours: fewer bigger commits, one PR per initiative."
      src: [README.md (Looking for Contributors), packages/studio/enums/src/Pointers.ts:62]
  other_conventions_seen: "Terminable and Subscription lifecycle objects everywhere, Option and Attempt instead of exceptions for fallible results, observable values and notifiers instead of a UI framework, no virtual DOM."
  src_other: [introduction.md (lib-std row, lib-jsx row)]

lessons:
  - tag: borrow
    item: "One typed object graph for the entire project, with per-field integer keys as persisted ids and deprecated-not-removed fields."
    why: "Forward compatible files; one schema for UI, engine and collab."
    src: [packages/lib/box/src/serializer.ts:11-36, packages/studio/forge-boxes/src/schema/std/timeline/NoteRegionBox.ts:14]
  - tag: borrow
    item: "Everything edit-related reduces to 4 invertible update records with old and new values; transactions validate at end and roll back by inverse."
    why: "Undo, redo, rollback, engine sync, collab and scripting all fall out of one mechanism."
    src: [packages/lib/box/src/updates.ts:7-50, docs/live-collab-conflict-resolve.md:1-45]
  - tag: borrow
    item: "Graph checksum compared across main thread, engine and script origin."
    why: "Cheap proof that mirrors have not diverged; also refuses stale script apply."
    src: [packages/lib/box/src/graph.ts:251, packages/app/studio/src/ui/pages/CodeEditorPage.tsx:85]
  - tag: borrow
    item: "Whole script applied as one undo step guarded by an origin checksum."
    why: "Safe pattern for AI or CLI batch edits: compute off-thread against a snapshot, apply atomically only if the base is unchanged."
    src: [packages/studio/scripting/src/ScriptHostProtocol.ts:8-10, packages/app/studio/src/ui/pages/CodeEditorPage.tsx:81-92]
  - tag: borrow
    item: "Plugin delay compensation by delay lines at junction inputs computed in one topological pass, zero cost when latency is zero."
    why: "No graph rewiring, bit-identical for simple projects, handles sidechains and automation alignment."
    src: plans/delay-compensation.md:21-53
  - tag: borrow
    item: "Selection and view state stored as boxes but excluded from history by predicate; unmarked edits fold into the next marked step."
    why: "Avoids phantom undo steps from selection changes while keeping state syncable."
    src: [packages/lib/box/src/editing.ts:63-84,262-275, docs/graph.md]
  - tag: borrow
    item: "Allocation-free render, buffers sized at reconcile, fixed voice pools, side modules sharing one memory."
    why: "Predictable audio thread; no GC pauses or surprise traps."
    src: [plans/delay-compensation.md:112, crates/stock-devices/device-nano/src/lib.rs:25]
  - tag: rethink
    item: "Imperative ProjectApi plus direct field writes as the editing surface, with the caller expected to wrap in modify."
    why: "Not serializable, no uniform undo wrapping, not drivable by an agent. We want a semantic command layer that compiles to patch ops."
    src: packages/studio/core/src/project/ProjectApi.ts:142-150,748-770
  - tag: avoid
    item: "Duplicating every device in TS and Rust and requiring float-for-float parity between them."
    why: "Doubles the work and creates a hand-maintained contract (about 70 WASM CONTRACT markers). Pick one DSP implementation."
    src: [introduction.md (dsp row), crates/stock-devices/device-delay/src/lib.rs:1-3]
  - tag: avoid
    item: "Decoding all audio fully into engine linear memory with no streaming and (so far) no fallible allocation."
    why: "Out-of-memory during loading is their top documented failure; the engine traps and must restart."
    src: [plans/wasm-audio/memory-ceiling.md:25-70, packages/studio/core-wasm/src/processor.ts:296-326]
  - tag: rethink
    item: "CRDT (Yjs) over a graph with referential invariants."
    why: "They needed a custom deterministic reconcile with a documented limitation. If we collaborate, decide the conflict model first."
    src: docs/live-collab-deterministic-reconcile.md:1-60
  - tag: avoid
    item: "Five-place change to add one device (schema, adapter, factory, Rust crate, build list) and gitignored generated code that breaks fresh clones until a full build."
    why: "High friction for contributors and agents; generate more from one device descriptor."
    src: [introduction.md (Where To Start Reading), introduction.md (Generated Code)]
  - tag: borrow
    item: "Multi-stage peak pyramid stored beside each asset, regenerated if corrupt, produced in a worker."
    why: "Fast waveform drawing at any zoom without touching audio data."
    src: [packages/lib/fusion/src/peaks/Peaks.ts:15-40, packages/studio/core/src/samples/SampleStorage.ts:80-90]

