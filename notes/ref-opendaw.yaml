scale_and_performance:
  facts:
    - fact: "Peak pyramid stored beside each sample; waveform drawing never touches raw frames."
      src: packages/lib/fusion/src/peaks/Peaks.ts:15-40
    - fact: "Heavy work off the main thread: OPFS worker, peak worker, BPM and material analysis workers, ONNX inference worker (lib-inference), script worker, stretch-wasm analysis module."
      src: [introduction.md (Runtime Topology), packages/lib/inference]
    - fact: "Engine render is allocation free; buffers sized in reconcile, fixed voice pools, side modules about 2 KB; release profile size-optimised with hot DSP crates at opt-level 3."
      src: [introduction.md (Rust workspace), plans/delay-compensation.md:112]
    - fact: "Update stream is delta based and byte-splices large bytes fields, so big edits do not resend full state."
      src: packages/lib/box/src/sync-source.ts:55-72
    - fact: "Undo optimizes update lists; selection and view state excluded from history via predicate."
      src: packages/lib/box/src/editing.ts:22,63-84
    - fact: "Per-device benchmark page renders each device offline with the real engine and reports marginal cost per quantum; JIT warmup first."
      src: docs/performance.md:1-20
    - fact: "Micro-optimisations logged: bitmask ring buffers instead of modulo, hoisted lookup tables, no per-block allocation in hot paths, AnimationFrame throttled to about 60 fps. docs/performance.md is a changelog of these, not a scaling guide."
      src: docs/performance.md:21-105
    - fact: "A DSP load measurement plan exists."
      src: plans/dsp-load-measurement.md
    - fact: "Engine heap meter broadcast and UI footer item shipped; engine starts at 16 MB and grows."
      src: plans/wasm-audio/memory-ceiling.md:36-42
  known_ceilings:
    - what: "Memory: all sample data is decoded into engine wasm memory. Out-of-memory is hit mostly while LOADING samples. A running engine that fails allocation traps; the worklet invalidates and the app offers restart. Plan: make per-asset allocation fallible so one asset goes silent instead of the engine dying."
      src: plans/wasm-audio/memory-ceiling.md:25-70,100-108
    - what: "Chrome per-process wasm address space is small on Android; N parallel projects or exports each hold an engine memory. Advice there: serialize exports, suspend background projects."
      src: plans/wasm-audio/memory-ceiling.md:46-58,75-80
    - what: "Large soundfonts (261 MB seen) are slow to read and zip for P2P transfer; concurrent peers multiply reads."
      src: docs/live-collab-fixes.md:1-30
    - what: "AudioWorklet construction can throw DataCloneError out of memory after importing a large mp3 (open triage entry, ChromeOS)."
      src: docs/error-triage.md:62
    - what: "OPFS quota: createWritable skews estimate; storage over 2 GB flagged red in the planned footer."
      src: plans/opfs-quota.md:111-160
    - what: "Compensation delay lines capped at 0.1 s."
      src: plans/delay-compensation.md:155
    - what: "Whole graph lives in main-thread memory and every edit validates affected boxes; no documented limit or benchmark for huge track counts was found (see unverified)."
      src: packages/lib/box/src/graph.ts:96-134
    - what: "No lazy loading of project regions or paged project file was found: project.od is read whole and the graph built eagerly."
      src: [packages/studio/adapters/src/project/ProjectSkeleton.ts:99-120, packages/lib/box/src/graph.ts:587-660]

collaboration_and_sync:
  live_room:
    model: "A Yjs doc mirrors the box graph (YMapper maps boxes and fields to Y.Maps; bytes via YBytes). Local transactions become Yjs ops, remote ops become graph transactions. Server is stock y-websocket (packages/server/yjs-server)."
    src: [packages/studio/core/src/ysync/YSync.ts, packages/studio/core/src/ysync/YMapper.ts, packages/server/yjs-server/package.json:10-19]
    core_problem: "Yjs converges documents but does not know graph invariants (pointers must resolve, exclusive targets, mandatory pointers, no cycles). Two valid edits can merge into an illegal graph."
    src_problem: docs/live-collab-deterministic-reconcile.md:1-15
    fix: "deterministicReconcile repairs violations as a pure function of the converged document (lowest-addressed incoming pointer wins on exclusive overflow; a mandatory pointer that must drop deletes its owning box). It runs only on the failure path and on room join, so peers converge. Documented limitation: repair edits are not written back into the Yjs doc, sound only while exclusive attachments are append only."
    src_fix: docs/live-collab-deterministic-reconcile.md:17-60
    tests: "Multi-peer harness with offline divergence and a 12-seed fuzz asserting convergence by BoxGraph.checksum."
    src_tests: [docs/live-collab-deterministic-reconcile.md:35-48, packages/studio/core/src/ysync/YSyncCollab.test.ts, packages/studio/core/src/ysync/LiveRoomFuzz.test.ts]
  rollback_invariant: "Every transaction end validates; failure applies recorded updates in reverse. Used for both local edits and remote batches."
  src_rollback: docs/live-collab-conflict-resolve.md:1-45
  p2p_assets: "studio-p2p moves samples, soundfonts, wclap bundles between peers over WebRTC data channels with chunking, backpressure and signaling (AssetSignaling, AssetServer, AssetPeerConnection). Known bug class: channel closing mid transfer."
  src_p2p: [packages/studio/p2p/src, docs/live-collab-fixes.md]
  sync_log: "Hash chained commit log (CommitType Init, Open, Updates, NewVersion; payload plus previous hash) with reader and writer; layout shared with Rust."
  src_log: [packages/studio/core/src/sync-log/Commit.ts:6-25, packages/studio/core/src/sync-log/SyncLogWriter.ts]
  more_plans: [plans/live-room-selections.md, plans/live-room-local-edits.md, plans/room-awareness.md]

extension_surface:
  honest_answer_on_command_api:
    is_every_editor_action_a_serializable_command: "NO. There is no command registry or command bus. UI code mutates the project by calling imperative TS methods (ProjectApi, adapter methods, direct box.field.setValue) inside editing.modify(...). The caller, not the API, is responsible for wrapping in modify (a ProjectApi doc comment says so for duplicateNotes), and some ProjectApi methods write directly with no wrapper (setBpm)."
    src: [packages/studio/core/src/project/ProjectApi.ts:142-150,748-770, packages/studio/core/src/project/Project.md]
    what_is_serializable: "Every mutation, however it was invoked, ends as a list of 4 box-level Update records (new, delete, pointer, primitive) with old and new values. That stream is serializable, invertible, replayable, checksummable. It is a data-level log, not a semantic command log: there is no verb like 'create region on lane X', you get 'new AudioRegionBox with these fields' plus pointer updates."
    src_updates: [packages/lib/box/src/updates.ts:7-50, packages/lib/box/src/sync-source.ts:55-80]
    semantic_api_surface: "ProjectApi (about 800 lines) holds many named operations: createAnyInstrument, insertEffect, copyEffects, moveEffects, createNoteTrack, createAudioTrack, createAutomationTrack, createTimeStretchedRegion, createNoteRegion, createTrackRegion, createNoteEvent, quantiseNotes, deleteAudioUnit, wrapInstrumentIntoComposite and more. This is the closest thing to a verb set, but the methods take live box and adapter objects, not JSON, and many editor gestures live in UI code under packages/app/studio/src/ui instead."
    src_api: packages/studio/core/src/project/ProjectApi.ts:182-770
    keyboard_shortcuts: "Shortcuts are declarative definitions (key plus description) per context (regions, note editor, device panel, piano panel, common) validated by ShortcutValidator and bound to UI handlers. They are names plus keys, not an action registry an agent can invoke."
    src_shortcuts: [packages/app/studio/src/ui/shortcuts/RegionsShortcuts.ts:1-20, packages/lib/dom/src/shortcut-manager.ts]
    engine_commands: "EngineCommands is a typed RPC to the audio thread (play, stop, setPosition, clip schedule, note signal, etc.). Transport and engine control only, not project editing."
    src_engine_cmds: packages/studio/adapters/src/protocols.ts:46-90
  scripting_api:
    what: "Closest AI-drivable surface. User JS or TS runs in a worker with global openDAW; it builds a new project (openDAW.newProject) or loads the open one (await openDAW.getProject()), edits through typed facades (project.bpm, addInstrumentUnit, noteTracks[0].addRegion, addEvent, device parameters), then project.openInStudio() hands it back. Also addSample, listSamples, renderMixdown, showInfo, saveFile."
    src: [packages/studio/scripting/README.md:1-22, packages/studio/scripting/docs/index.md:1-20, packages/studio/scripting/src/Api.ts:2889-3023, packages/studio/scripting/src/ScriptHostProtocol.ts:6-18]
    how_it_works: "Facades are thin wrappers over a real BoxGraph (ProjectSkeleton) inside the worker; every getter reads a field and every setter writes one. Guard validates every write against schema constraints (clamps ranges, throws on bad enum or type). A parity test asserts every automatable field of every device is reachable through the facade."
    src_how: [packages/studio/scripting/README.md:8-18, packages/studio/scripting/src/impl/Guard.ts, packages/studio/scripting/src/test]
    apply_path: "The script collects UpdateTasks (forward update list) plus the graph checksum it started from. The host compares that checksum with the live project; if the project changed meanwhile it refuses ('Run it again'); otherwise it replays the tasks inside one editing.modify, so the whole script is ONE undo step."
    src_apply: [packages/studio/scripting/src/ScriptHostProtocol.ts:8-10, packages/app/studio/src/ui/pages/CodeEditorPage.tsx:81-92, packages/lib/box/src/sync-target.ts:12-20]
    gaps: "Not covered: modular audio effects, neural amp models, recording capture settings, MIDI controller mappings, UI state. A create script replaces the open project instead of editing it."
    src_gaps: packages/studio/scripting/README.md:19-22
    typings: "api.declaration.d.ts is generated from Api.ts so Monaco gets completions; also a good LLM prompt context."
    src_typings: [packages/studio/scripting/README.md:8-10, introduction.md (Generated Code)]
  sdk_and_headless:
    sdk: "@opendaw/studio-sdk is a meta package (no code) pulling lib-*, studio-boxes, adapters, core, core-wasm so another app can embed the engine; WasmEngine.install and ensureReady, offline render and latency calibration (RoundTrip) are documented."
    src: [packages/studio/sdk/README.md:1-60, packages/studio/sdk/package.json]
    headless: "README links external repos openDAW-headless and a fork with more docs; their contents are NOT in this clone."
    src_headless: [README.md:178-180, introduction.md (studio-sdk)]
  other_hooks:
    - "Project profile and storage APIs plus ProjectBundle encode/decode for file-level automation. src: packages/studio/core/src/project/ProjectBundle.ts"
    - "OfflineEngineRenderer for headless rendering (mixdown, stems). src: packages/studio/core/src/OfflineEngineRenderer.ts"
    - "docs/error-triage.md:86 mentions read-only console commands; not investigated."
  mcp_or_cli: "None found in this clone. No MCP server, no CLI that edits projects, no JSON command schema."
  implication_for_us: "For an AI or CLI driven DAW, do not copy their model of imperative methods. Take their box-level Update stream (serializable, invertible, checksummed) as the bottom layer, and define our own semantic command layer on top that compiles to it, so every editor action is a serializable command by construction."

naming_glossary:
  note: "we_call_it is a PROPOSAL for consistent plain DAW names in our agents and docs."
  terms:
    - {theirs: BoxGraph, meaning: "whole project object graph", we_call_it: project graph, src: "packages/lib/box/src/graph.ts:52"}
    - {theirs: Box, meaning: "typed record node", we_call_it: node, src: "packages/lib/box/src/box.ts:50"}
    - {theirs: Field, meaning: "addressed slot in a box", we_call_it: property, src: "packages/lib/box/src/field.ts"}
    - {theirs: "Pointer, PointerHub, Pointers enum", meaning: "typed edge and its receiving side", we_call_it: reference, src: "packages/lib/box/src/pointer.ts"}
    - {theirs: Address, meaning: "box uuid plus field key path", we_call_it: path, src: "packages/lib/box/src/address.ts"}
    - {theirs: "Update (new, delete, pointer, primitive)", meaning: "one low level graph mutation", we_call_it: patch op, src: "packages/lib/box/src/updates.ts:10"}
    - {theirs: "BoxEditing.modify and mark", meaning: "transaction plus undo step", we_call_it: edit transaction and undo step, src: "packages/lib/box/src/editing.ts:240"}
