# R05 device level reference map of openDAW (stock devices). Facts come from reading code and plans in
# <reference checkout>/opendaw (clone commit in notes/ref-opendaw.yaml meta). Paths in src: are relative to that clone.
# Source is AGPL-3.0-or-later with a commercial licence offer. Behavior is described in our words; nothing is copied.
# Tags: borrow (take the idea), avoid (do not repeat), rethink (idea is good, their way does not fit our rules).
# Our rules that decide most tags: deterministic, bit for bit native and wasm, no allocation in the audio path,
# one command API, state_hash, plain names in the UI (no brand names).

meta:
  id: R05
  date: 2026-11-23
  scope: "every stock device in the owner list that exists in the clone, plus the shared device contract they run on"
  builds_on: ["notes/ref-opendaw.yaml (engine_flow, devices.common_pattern)", "notes/ref-opendaw-ui.yaml", "notes/ref-webclap.yaml"]
  how_to_read: "framework section first (shared rules), then devices grouped by slot kind. Each device lists purpose, parameters, signal flow, chain position, automation and storage, state, edge cases, avoid, licence, tag."
  param_notation: "name = default, range, unit, curve. Curves: lin, exp (log feel), pow (bent), db (volume style bend), idx (integer index into a table), bool. Real ranges come from the box schema constraints, but automation mapping in the device code is the truth (see framework.parameters)."
  src_schema_root: packages/studio/forge-boxes/src/schema/devices
  src_device_root: crates/stock-devices
  src_dsp_root: crates/dsp/src
  not_found_in_refs:
    - "Chord device: no chord MIDI effect exists. Chords appear only as arpeggiator input (follow chord track) and as the harmony track (key and chord events). Wave D chord device is our own design."
    - "Tape character DSP: the Tape instrument schema carries flutter, wow, noise and saturation parameters (defaults 0.2, 0.05, 0.02, 0.5) but no DSP using them was found in crates or the engine. Treated as reserved fields (unverified)."
    - "Stereo Split has no device crate: it is a registration of the generic effect composite with a per channel distributor."
    - "Mastering (extra, not in owner list) exists but is GPL-3.0 (Matchering), studio only. Korpus and Tubular also exist (extras, see extras section)."

