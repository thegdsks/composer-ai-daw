    - id: arpeggiator
      theirs: Arpeggio
      kind: MIDI effect, stateful pull source
      purpose: "Turn held or sequenced notes into a stream of notes on a rate grid, with 18 walks, step lanes, ratchets, hold, retrigger and chance."
      params:
        - "mode (18 walks, first three up, down, up down), octaves 1..5, rate (17 fractions 1/1..1/128), gate 0..2 of the rate, repeat 1..16, velocity magnet bipolar"
        - "order (played or pitch), hold, retrigger (off, note, bar, beat), offset 0..15, seed 0..999999, follow chords"
        - "seven step lanes of 64: kind (rest, tie, chord, normal), velocity 0..100 percent, gate 0..200 percent, transpose -12..12, octave -2..2, chance 0..100, ratchets 1..7; pattern length 1..64"
      signal_flow: "Pool of covering notes (ordered by start then pitch, or by pitch), expanded by octaves, a walk picks an index for the grid step, the step lanes decide rest, tie, chord, ratchet and modify gate, velocity, transpose, chance. Emitted notes have fixed durations of rate times gate and ignore the release of their source note."
      chain_position: "MIDI effect list, before the instrument"
      automation_and_storage: "mode, octaves, rate, gate, repeat, velocity, order, hold, retrigger, offset, follow are parameters; seed, lanes, pattern length are plain fields (int arrays). Version field exists."
      state: "32 source notes, 256 retained notes, 256 events per block, ratchet hits scheduled in later blocks use their own buffer. Absolute grid phase: steps land on index times rate of the song grid, so nothing restarts when a key goes down."
      edge_cases:
        - "A discontinuity (seek, loop wrap) releases every emitted note."
        - "Note on before note off at an equal tick."
        - "Walk and random other sum over all earlier steps, cached and recomputed after a jump back, so output never depends on playback history."
        - "Stopped transport arpeggiates live notes on a free running grid."
        - "Changing a note mid cycle re indexes the walk (step mod count)."
        - "Pitches above 127 pass through in the legacy path; our rule drops them."
      licence: "Own work. Their plan cites other products for ideas only (mode lists are common knowledge). Do not copy their walk names or lane layout; derive our own set."
