        - "q start = 20, q end = 2 (exp 1..60): Q across the band range"
        - "envelope attack = 5 ms (0.1..100 exp), envelope release = 30 ms (1..1000 exp)"
        - "gain = 0 dB, -20..20 lin; mix = 1.0"
        - "band count = 16 (setting; 8, 12 or 16); modulator source = pink noise (setting; white, pink, brown noise, self, or external sidechain)"
      signal_flow: "Carrier is the main input. Up to 16 band pass filter pairs (carrier side and modulator side) with geometrically interpolated coefficients every sub block; modulator band envelope follower scales the carrier band; band count changes fade in."
      chain_position: "audio effect on a channel; modulator via sidechain or built in noise"
