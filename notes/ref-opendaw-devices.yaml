      kind: audio effect
      purpose: "Dense plate reverb (Dattorro topology)."
      params:
        - "pre delay = 0 ms, 0..1000 ms lin"
        - "bandwidth = 0.9999, input diffusion 1 = 0.75, input diffusion 2 = 0.625, decay = 0.75, decay diffusion 1 = 0.7, decay diffusion 2 = 0.5, damping = 0.005, excursion rate = 0.5, excursion depth = 0.7 (all 0..1 lin)"
        - "wet = -6 dB, dry = 0 dB"
      signal_flow: "Mono sum, pre delay, input low pass, four input diffusion allpass, then a figure of eight tank with two modulated (excursion LFO, cubic interpolated) delay lines, damping low passes and decay diffusion allpass; stereo out from 14 taps."
