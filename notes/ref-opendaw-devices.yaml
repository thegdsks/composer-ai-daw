    - id: impulse_reverb
      theirs: Convolver
      kind: audio effect
      purpose: "Zero latency convolution with an impulse response sample (reverb, cabinets, rooms)."
      params:
        - "file = none, pointer to an audio asset"
        - "wet = -3 dB, dry = 0 dB, db curve"
        - "pre delay = 0, 0..0.5 s, power curve centered at 50 ms (reaches true zero)"
        - "normalize = true (setting), reverse = false (setting)"
      signal_flow: "Stereo input, stereo IR (mono IR copied to both). Non uniform partitioned convolution: a 128 tap direct FIR head (zero latency), then uniform partitions of 128 up to 8192 samples with FFT 256, then partitions of 8192 with FFT 16384 running once per 64 quanta, pipelined so big partitions never spike one quantum. IR is resampled to the engine rate, transformed over many quanta (a budget of a few partitions per block) so a swap does not stall."
      chain_position: "any audio effect"
      state: "IR spectra and input spectrum delay lines, worst case 12 to 16 MB per instance (8 s IR at 48 kHz limit, longer is truncated). Latency 0."
      edge_cases:
        - "IR load is distributed: the head is audible first and the tail fades in over tens of ms (not bit equal to a full load for the first moments)."
        - "Needs SIMD for speed; they measured and decided partition layout by benchmark."
        - "Reverse and normalize retransform the IR."
      licence: "Own work (Gardner partition scheme is published). Our design: pick partition sizes by bench, keep deterministic summation order."
