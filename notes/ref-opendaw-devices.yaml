what_to_avoid_summary:
  - "Replicating bugs for float parity with an older engine (truncated half band table, delay return limiter time unit)."
  - "Dead parameters in the schema (room reverb filter, tape character, synth noise)."
  - "Parameter ranges that live in two places and disagree (gate floor)."
  - "Automation stored as unit values (range changes need migrations)."
  - "Reverb and delay rings sized for 48 kHz only."
  - "Bypass without clearing state."
  - "UI cadence coupling inside DSP (analyser decay armed by the reader)."
  - "Scripts in the audio thread."
  - "Calibration against commercial plugin renders and copying fitted tables."
  - "Porting the compressor from its third party source."

licence_summary:
  openDAW: "AGPL-3.0-or-later or commercial licence by agreement. Copying code into a closed product is not allowed. Ideas are free."
  excluded_in_commercial_licence_by_their_own_list: ["Compressor (ported)", "Mastering (GPL-3.0)"]
  gpl_inside_repo: ["Tubular (Dexed host and output code, GPL-3.0)", "Matchering (GPL-3.0-or-later)"]
  permissive_inside_repo: ["time stretch library Signalsmith (MIT, licences/signalsmith-stretch-MIT.txt)", "CLAP (MIT)"]
  needs_review: ["upstream licence of the compressor source", "licence of the neural amp C++ core and of the model files from the third party service", "Tone3000 service terms for browser integrations"]

unverified:
  - "Tape character DSP (flutter, wow, noise, saturation): fields exist, no DSP found. May live in an unread file or be reserved."
  - "Subtractive synth per oscillator volume defaults: schema default is minus infinity, factories probably set values; not checked."
  - "Compressor upstream licence (README implies copyleft, not read at source)."
  - "Neural amp core licence (believed MIT)."
  - "Delay return limiter: coefficients use 50 and 250 as seconds in the exponent, which makes it near inert; not confirmed against the older TS version or by a listening test."
  - "Whether Freeverb and plate reverb at rates above 48 kHz sound wrong; deduced from fixed sizes only."
  - "Whether the lookahead toggle crossfade in limiter and compressor hides all latency discontinuities when alignment inserts a compensation delay."
