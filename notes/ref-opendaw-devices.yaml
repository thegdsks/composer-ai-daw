  instruments:
    - id: subtractive_synth
      theirs: Vaporisateur
      kind: instrument
      purpose: "Two oscillator subtractive synth with filter, ADSR, LFO, unison, glide, mono or poly."
      params:
        - "volume = -6 dB (db curve), octave, tune (cents)"
        - "oscillators: two, each waveform (sine, triangle, saw, square by index), octave -3..3, tune -1200..1200 cents, volume (db curve; default minus infinity for oscillator volume in the schema, factories set real values)"
        - "filter: cutoff = 8000 Hz (20..20000 exp), resonance = 0.1 (0.01..10 exp as Q), filter order 1..4 (idx), envelope amount bipolar (the amp ADSR also drives cutoff), keyboard tracking bipolar"
        - "amp ADSR: attack 5 ms, decay 1 ms (min), sustain 1.0, release 500 ms (times 1 ms..5 s exp)"
        - "glide time 0..1 unipolar; voicing mode (mono or poly); unison count 1, 3, 5; unison detune 30 cents (1..1200 exp); unison stereo spread 1.0"
        - "LFO: waveform, rate 0.0001..30 Hz exp, tempo sync flag, three bipolar targets (tune, cutoff, volume)"
        - "a noise generator exists in the schema but is unused in DSP"
      signal_flow: "Per voice: glide frequency buffer times unison detune, LFO optionally multiplies pitch, two band limited (PolyBLEP) oscillators mixed, a modulated multi section low pass (cutoff = base + keyboard + envelope times amount + LFO times target) with Q divided by order to the 1.25, times amp envelope times velocity gain, panned by unison spread (linear law). Whole mix goes to a brick wall limiter."
      chain_position: "instrument slot, MIDI fx before, audio fx after"
      automation_and_storage: "around 25 parameters; voices read the live parameters each quantum and the envelope at note on, so editing ADSR affects the next note."
      state: "16 poly voices times unison 5, mono stack 16, shared scratch workspace; release tails."
      edge_cases:
        - "Filter coefficients are quantised in cutoff to a fixed number of exponential steps and recomputed only on step change (cheap, slightly steppy)."
        - "Unison gain is energy normalised."
        - "The cutoff is mixed in unit space so keyboard tracking, envelope and LFO all add before the exponential map."
        - "Voice finishes when envelope is complete and VCA below a silence threshold of minus 80 dB."
      avoid: "Unused noise params; the filter envelope sharing the amp ADSR (a real design would give the filter its own)."
      licence: "Own work; PolyBLEP is public technique."
      tag: borrow
      we_call_it: subtractive_synth
