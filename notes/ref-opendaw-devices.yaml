framework:
  summary: "Every stock device is the same small contract: a fixed state block, a list of registered parameters pushed by id, optional watched settings, an event or audio process call per block, a reset on transport stop, and optional latency. The engine owns the chain wiring, bypass, sidechain and alignment, the device owns its DSP and its own value mappings."
  device_kinds:
    what: "Three kinds: instrument (events in, audio out), audio effect (audio in, audio out, optional sidechain), MIDI effect (events in, events out, a pull source ahead of the instrument)."
    chain_shape: "Per channel: one instrument slot, then a MIDI effect list in front of it (pulled by the instrument), then an audio effect list after it, then the channel strip. Master is the same minus the instrument."
    common_fields: "Every device has enabled (default true), minimized (UI only), label, and a position index among siblings. Instruments have an icon instead of an index."
    src: ["packages/studio/forge-boxes/src/schema/std/DeviceFactory.ts:10-45", "crates/abi/src/lib.rs:1623-1900"]
    tag: borrow
    note: "Our equivalent: a Device node per chain slot with id, kind, enabled, order index and a typed parameter list. Plain data, no UI fields in the hash."
  parameters:
    two_value_spaces: "A parameter reaches a device as a unit value (0..1, used by automation) or as a real value (what a knob stores). The device maps unit to real itself with its own mapping (linear, exponential, power, decibel bend, integer, table, bool). A modulated form carries a base plus a modulation sum."
    consequence: "Automation lanes are stored in unit space, so widening a range or inserting an enum entry silently changes old automation. They needed a version field and a migration pass (arpeggio mode range widening)."
    src: ["crates/abi/src/lib.rs:160-166", "crates/math/src/value_mapping.rs", "plans/arpeggio-enhanced.md:112-135", "crates/stock-devices/device-delay/src/lib.rs:56-75"]
    tag: rethink
    our_rule: "Store automation points in real units of a stable parameter id plus a parameter schema version. A range change ships a migration. Keep unit mapping as a UI concern only."
    mapping_drift_trap: "Schema ranges and the device mapping can disagree (gate floor is a bent decibel curve in the device but a plain linear range in the schema). Whoever reads the schema alone is wrong."
    src_drift: ["crates/stock-devices/device-gate/src/lib.rs:44-56", "packages/studio/forge-boxes/src/schema/devices/audio-effects/GateDeviceBox.ts"]
    tag_drift: avoid
  parameter_ids:
    what: "Parameters are bound by a short path of integer keys at init and get a small id back. Keys are persisted, deprecated keys are kept and never reused with another type. A device checks its ids by position, so bind order is a compatibility contract (the parity probe maps ids in bind order)."
    src: ["packages/lib/box/src/serializer.ts:11-14", "crates/stock-devices/device-stereo-tool/src/lib.rs:55-62", "plans/arpeggio-enhanced.md:112-120"]
    tag: borrow
    our_rule: "A parameter id is a stable small integer per device type, never reused, plus a name. New parameters append. The id is what lands in automation targets, commands and the state hash."
  settings_vs_parameters:
    what: "Some fields are plain settings the device only watches (waveshaper curve name, fold oversampling factor, stereo pan law, limiter lookahead flag, vocoder band count, filter order). They are not automatable, a change rebuilds internals."
    src: ["crates/stock-devices/device-waveshaper/src/lib.rs:8-10", "crates/stock-devices/device-fold/src/lib.rs:5-7"]
    tag: borrow
    note: "Good split: anything that resizes state or changes latency is a setting, everything else a parameter."
  smoothing_and_first_delivery:
    what: "Gain like parameters glide (linear ramp about 5 ms, one pole about 3 ms) so edits do not click, but the first value after load or reset jumps, not glides (a processed flag). Parameters that only select a table index or a mode jump."
    src: ["crates/dsp/src/ramp.rs:1-60", "crates/stock-devices/device-waveshaper/src/lib.rs:70-120", "crates/dsp/src/smooth.rs"]
    tag: borrow
    detail: "Ramp set is a no-op if already at target (does not restart a glide). The ramp snaps exactly to target on the last step to avoid error build up."
  automation_clock:
    what: "Devices see automated values on a fixed musical grid (UPDATE_CLOCK_RATE = 10 pulses at 960 per quarter), not per sample. Blocks are split at update positions. With latency alignment the grid is read at position minus arrival so a latent device stays aligned."
    src: ["crates/dsp/src/ppqn.rs:9-21", "crates/engine-env/src/update_clock.rs", "plans/delay-compensation.md:60-68"]
    tag: rethink
    our_rule: "We already use a frame based control period (32 frames, D36) derived from the absolute frame counter, which is independent of tempo and block size. Keep it. Document that tempo synced devices read tempo per block, and that latent devices read automation at frame minus their latency."
  reset:
    what: "Transport stop calls reset: tails, envelopes, filter memories, detectors cleared, delay lines zeroed (only if they were ever written), processed flag cleared so the next first delivery jumps."
    src: ["crates/stock-devices/device-delay/src/delay_dsp.rs:84-103", "crates/stock-devices/device-gate/src/lib.rs:150-160"]
    tag: borrow
    determinism_note: "Offline render must start from reset state, so render of the same project is identical regardless of what played before."
  bypass:
    what: "A disabled effect is skipped in the chain wiring only. Its state is kept, parameters are not re-pushed, and nothing resets. It does not process while bypassed, so on re enable its tail memory is stale (old delay content, old reverb ring)."
    src: ["crates/engine/src/audio_unit/mod.rs:103-105", "1342-1347"]
    tag: rethink
    our_rule: "Define bypass precisely: either clear state on disable (cheap, deterministic) or keep processing silently. Pick clear on disable, plus a short crossfade (about 5 ms) between dry and wet path to avoid clicks. A bypass toggle is an edge in the state hash and must not depend on history."
  latency:
    what: "A device reports its latency in frames (lookahead limiter, compressor lookahead, fold oversampling, pitch corrector). The engine computes arrival times over the graph and inserts compensation delays only at junctions (sums, sends, sidechain, composite dry/wet), capped at 0.1 s, zero cost when nothing is latent."
    src: ["plans/delay-compensation.md:21-100", "155-160", "crates/abi/src/lib.rs:182"]
    tag: borrow
    lookahead_toggle: "Toggling lookahead changes latency by a few ms. They crossfade between the immediate and the delayed path over 15 ms instead of jumping."
    src_toggle: ["crates/stock-devices/device-maximizer/src/lib.rs:36-38", "crates/stock-devices/device-compressor/src/lib.rs:70-74"]
    our_rule: "Wave A framework carries a latency field per device and alignment at sum points. Until a latent device exists, assert latency 0 and have a test that the engine output is unchanged."
  sidechain:
    what: "A device may declare a sidechain input (optional pointer to another output). Inputs are resolved by port id: main through signal first, sidechain next. Absent sidechain means detect on the main input. Sidechain edges order the graph but never raise the arrival time of the consumer."
    users: ["compressor", "noise_gate", "vocoder"]
    src: ["crates/stock-devices/device-gate/src/lib.rs:5-12", "194-198", "plans/delay-compensation.md:48-52"]
    tag: borrow
  telemetry:
    what: "Devices write small meter slots (levels, reduction, spectrum, LFO phase) into shared memory that the UI reads only while a view subscribes. The analyser and meter work is skipped when nobody listens."
    src: ["crates/stock-devices/device-revamp/src/lib.rs:176-190", "crates/stock-devices/device-maximizer/src/lib.rs:117-130"]
    tag: borrow
    our_rule: "Meter feed is output only, never an input to audio, never in state_hash. Gate it behind a subscribed flag so offline render pays nothing and stays identical."
  voices:
    what: "Instruments use a shared voice allocator: fixed pool, poly or mono mode switchable at runtime, oldest voice stolen when full, stolen voice fades out in a small spare area (about 3 ms) so a steal does not click, mono keeps a stack of held notes with legato glide, unison fans N detuned voices with equal power gain 1/sqrt(N)."
    src: ["crates/voicing/src/lib.rs:1-100", "208-215", "293-320", "462-490"]
    tag: borrow
    caps_seen: "Subtractive synth 16 poly voices, mono stack 16, unison widths 1/3/5; single sampler 64 voices; drum pad 16 voices per pad."
    gotcha: "Retriggering a mono voice that is still releasing must start on a fresh slot and let the old one finish its fade, else the envelope reset clicks."
  midi_events:
    what: "MIDI effects work in tick (pulse) positions. Each note on carries an id, pitch, cent, velocity; the matching note off carries the same id. Devices that rewrite a note remember the rewritten pitch by id and replay it on the off, so editing a parameter mid note never leaves a stuck note. A shifted pitch outside 0..127 drops the note (never clamps). Output order at equal tick is off before on (keeps mono synths legato at gate 100 percent)."
    src: ["crates/stock-devices/device-pitch/src/lib.rs:1-15", "40-85", "crates/stock-devices/device-note-filter/src/lib.rs:1-4", "plans/arpeggio-enhanced.md:46-60", "plans/midi-composite.md:12-35"]
    tag: borrow
    chance_note: "Chance (probability) must be deterministic per note identity (hash of note id and cycle), not a running random stream, so every branch and every re read agrees."
    tag_chance: borrow
  determinism_observations:
    findings:
      - "Math goes through libm on every target (native and wasm), because std transcendentals differ. Their cubed device says this explicitly."
      - "Control math often f64, audio f32, filters f64 coefficients. Order of operations is pinned because the Rust port must match an older TS version float for float."
      - "A fast exp2/log2 polynomial is used in hot paths (compressor dB conversion) with identical literals on both engines."
      - "Several devices keep a free running phase or random state; random sources are seeded (mulberry style 32 bit)."
    src: ["crates/stock-devices/device-cubed/src/lib.rs:12-14", "crates/dsp/src/ctagdrc.rs:8-20", "crates/dsp/src/vocoder.rs:9-12", "crates/stock-devices/device-velocity/src/lib.rs:10-12"]
    tag: borrow
    our_rule: "Use our own libm style pure Rust math (no std tanh, exp, sin in audio code), no fast_math tables with platform variance, f32 audio, integer or f64 control, and a per device golden hash test."
  no_alloc:
    what: "Device state is one zeroed block sized by the device for the sample rate; large state is initialised in place (no stack temporaries bigger than a few hundred KB); rate sized buffers use a flexible tail sized as a function of sample rate."
    src: ["crates/stock-devices/device-delay/src/lib.rs:5-11", "crates/dsp/src/freeverb.rs:55-70", "crates/dsp/src/dattorro.rs:55-70"]
    tag: borrow
    note: "Their Freeverb and plate reverb are sized for 48 kHz and clamped, so higher rates detune or shorten. Avoid: size from sample rate at setup."
  versioning:
    what: "Devices whose parameter semantics changed carry an integer version field (delay, arpeggio, subtractive synth, acid bass at key 99) and a migration runs on project load and preset load. Defaults of every new field reproduce the old behavior (legacy parity test)."
    src: ["packages/studio/forge-boxes/src/schema/devices/audio-effects/DelayDeviceBox.ts:56", "plans/arpeggio-enhanced.md:112-135", "crates/stock-devices/device-nano/tests/legacy_parity.rs"]
    tag: borrow
  composites:
    what: "A composite device hosts child chains in parallel. Three families share one engine mechanism: effect composite (broadcast input), stereo split (entry 0 reads left only, entry 1 right only, untouched sum is bit exact input), frequency split (entry i reads band i from crossover filters with allpass phase compensation, untouched sum is a flat allpass). Each entry has its own chain and a strip (gain dB, pan, mute, solo); the composite has dry and wet gain (dry default minus infinity). A missing entry reads silence. Nesting is unlimited."
    src: ["crates/engine/src/effect_composite.rs:1-60", "crates/engine-env/src/composite_mix.rs:36-110", "packages/studio/forge-boxes/src/schema/devices/audio-effects/FrequencySplitBox.ts", "plans/effect-stack.md:1-20"]
    tag: borrow
    edge_cases:
      - "Mute is a gate at the strip; the child keeps running so unmute is instant and in phase."
      - "A stray extra entry in a corrupt project must read silence, not double a channel."
      - "Frequency split band count change reconfigures the crossover cascade and must fade in click free."
      - "Entry order in the chain is an explicit index, not array order."
  presets:
    what: "A preset is a device (or chain) subtree serialised with its resources and a version, loaded through the same migration as projects."
    src: ["packages/studio/core/src/presets/PresetBundle.ts", "plans/preset-folders.md"]
    tag: borrow
  build_effort_hint: "Adding a device touched five places in their repo (schema, adapter, factory, DSP crate, build list). For us it is one device module in core plus one describe entry; the UI generates its panel from the parameter list."
  scripted_devices_warning: "Script devices run user JavaScript in the audio worklet: unbounded time, no determinism, cannot run native or offline the same way. See script_fx entry."

devices:
  effects_cheap:
    - id: stereo_tool
      theirs: StereoTool
      kind: audio effect
      purpose: "Volume, balance, width (mono to wide), per channel polarity invert, left right swap."
      params:
        - "volume = 0 dB, -72..+12 dB, db curve with mid at 0 dB"
        - "panning = 0, -1..+1, lin bipolar"
        - "stereo width = 0, -1 (full mono)..+1 (wide), lin bipolar"
        - "invert left = false, bool"
        - "invert right = false, bool"
        - "swap = false, bool"
        - "pan law = linear (setting, not automatable), choices linear or equal power"
      signal_flow: "One 2x2 matrix built from the parameters, applied per sample. Pan gains first (linear law: each side stays unity toward the center, so the louder side is unity and the other attenuates; equal power: cosine and sine), times gain, polarity flips, then a mid side width stage (negative folds toward mono, positive raises side and lowers mid), then optional channel swap."
      chain_position: "any audio effect slot, also usable on master"
      automation_and_storage: "6 automatable params, 1 setting. Matrix recomputed only when something changed; the matrix glides over 5 ms, but the first delivery jumps."
      state: "matrix coefficients and the processed flag. No tail, no latency."
      edge_cases:
        - "Mono fold at stereo = -1 sums both channels equally: left only input yields equal output on both sides."
        - "Linear pan law means centered gain is unity per channel (louder than equal power at center by design)."
        - "Volume at the bottom of the range maps to minus infinity gain (db curve), plan for an exact silence at the minimum."
      avoid: "Nothing. Smallest good first device and a good test of the framework."
      licence: "Own work, textbook mid side."
      tag: borrow
      we_call_it: stereo_tool
      src: ["crates/stock-devices/device-stereo-tool/src/lib.rs:1-140", "crates/dsp/src/panning.rs:1-100", "crates/dsp/src/ramp.rs:67-130"]
    - id: stereo_delay
      theirs: Delay
      kind: audio effect
      purpose: "Stereo delay, tempo synced or in milliseconds, with feedback, cross feedback, a combined low or high pass in the feedback path, a slow wobble (LFO) on the read position, an input pre delay per side, a limiter on the return."
      params:
        - "delay time (musical) = index 13 of 21, idx; table starts at off then 1/128 up to 1/1 (a bar); this sets the main delay along with the next"
        - "delay time (ms) = 0, 0..1000 ms, lin; added on top of the musical value"
        - "pre delay left musical = index 8, idx; pre delay left ms = 0, 0..1000 ms, bent so 100 ms is mid"
        - "pre delay right musical = 0 (off); pre delay right ms = 0, same bend"
        - "feedback = 0.5, 0..1 lin"
        - "cross = 1.0, 0..1 lin (how much of each return feeds the other side)"
        - "filter = 0, -1..+1 lin bipolar: 0 bypass, positive high pass, negative low pass, cutoff exponential over 20..20000 Hz"
        - "wet = -6 dB, dry = 0 dB, default volume dB curve (-72 mid -12 max 0)"
        - "lfo speed = 0.1, 0.1..5 Hz exp; lfo depth = 0, 0..50 ms, power curve exponent 4"
      signal_flow: "Input goes through the per side pre delay into a circular line per channel. Read position = write position minus (main offset plus smoothed LFO depth minus triangle LFO), fractional read by linear interpolation. The return is peak limited (envelope above 1.0 divides), cross mixed by cross amount, scaled by 0.96, passed through one shared biquad, then written back with feedback gain. Output = input times dry plus return times wet. The cell after the write head is cleared so stale data never returns on wrap."
      chain_position: "any audio effect slot; typically send style or insert"
      automation_and_storage: "Sync indices are stored as float indices; automated unit values snap to the index. Delay time changes glide over 0.25 s (interpolation length) once running; before the first block they jump. A version field exists for a past migration."
      state: "Four ring buffers sized as the next power of two of (one bar at 30 bpm + 1 s + 50 ms) at the sample rate, so large (about 2 MB per instance at 48 kHz in f32). Tail survives loop wraps and seeks, cleared only on transport stop."
      edge_cases:
        - "Time glide over 250 ms makes tempo changes pitch bend the repeats (tape like); is the stated intent."
        - "The return limiter envelope coefficients are built from 50 and 250 used as if they were seconds (they read as milliseconds), giving time constants of tens of seconds, so the limiter barely follows the signal and is effectively inert. Treat as a bug, do not replicate."
        - "A strange add and subtract of a tiny constant is a denormal guard; use our own flush to zero rule."
        - "Max delay is capped by buffer size: tempo below 30 bpm clamps."
        - "Delay lines are not cleared on discontinuity (seek or loop wrap), so the echo tail crosses the boundary on purpose."
      avoid: "Limiter envelope time unit bug (return limiter nearly inert); the 1e-18 dither trick; per sample f64 inner loop cost."
      licence: "Own work."
      tag: borrow
      we_call_it: stereo_delay
      src: ["crates/stock-devices/device-delay/src/lib.rs:1-260", "crates/stock-devices/device-delay/src/delay_dsp.rs:1-200", "crates/stock-devices/device-delay/src/delay.rs", "crates/stock-devices/device-delay/src/fractions.rs", "packages/studio/forge-boxes/src/schema/devices/audio-effects/DelayDeviceBox.ts"]
    - id: bit_crusher
      theirs: Crusher
      kind: audio effect
      purpose: "Sample rate reduction and bit depth reduction."
      params:
        - "crush = 0, 0..1 lin; internally inverted: 1 means maximum reduction. The crushed sample rate runs exponentially from Nyquist down to 20 Hz"
        - "bits = 16, 1..16, integer"
        - "boost = 0 dB, 0..24 dB lin (drive into the quantiser, compensated at the output by half the boost)"
        - "mix = 1.0, 0..1 lin"
      signal_flow: "Stereo low pass (Butterworth) at the crushed rate to limit aliasing (cutoff floor 1 kHz), then sample and hold at the crushed rate with a fractional phase counter, held value is multiplied by boost, rounded to 2^bits - 1 steps and clamped, then dry wet mix, then output gain of minus half the boost in dB."
      chain_position: "any audio effect"
      automation_and_storage: "4 params. A crush change glides the crushed rate over 20 ms after the first block, else jumps."
      state: "two biquads, held samples, phase counter, rate ramp state. No tail beyond the filter, no latency."
      edge_cases:
        - "Crush ratio is fixed per block while the rate glides (rate steps once per quantum in the hold step, filter moves every sample)."
        - "bits = 1 snaps outputs to -1, 0, 1 steps (tested)."
        - "Mix 0 passes dry exactly but still applies the output gain compensation; check that boost 0 is unity."
        - "The anti alias filter cutoff follows the rate, so at low crush values it is a Nyquist filter and is nearly transparent."
      avoid: "Rate fixed per block quirk (pick per sample or per 32 frame control period); rounding with libm round (use our own deterministic round half away)."
      licence: "Own work, textbook."
      tag: borrow
      we_call_it: bit_crusher
      src: ["crates/stock-devices/device-crusher/src/lib.rs:1-110", "crates/dsp/src/crusher.rs:1-180"]
    - id: noise_gate
      theirs: Gate
      kind: audio effect with optional sidechain
      purpose: "Close the signal below a threshold with hold and smooth open and close, optional external detector, optional inverse (duck when loud)."
      params:
        - "threshold = -6 dB, -80..0 dB lin"
        - "return (hysteresis) = 0 dB, 0..24 dB: the close threshold is threshold minus return"
        - "attack = 1 ms, 0..1000 ms lin"
        - "hold = 50 ms, 0..500 ms lin"
        - "release = 100 ms, 1..2000 ms lin"
        - "floor = -72 dB, -72..0 dB, three point db curve (mid -12 dB) in the device, linear in the schema"
        - "inverse = false, bool"
        - "side chain = none, optional input pointer"
      signal_flow: "Detector level = max of absolute left and right of the sidechain, or of the main input when none. A peak follower with 10 ms decay. State machine: level at or above open threshold opens and reloads the hold counter; while open and counting, the counter runs down; below return threshold and hold finished closes. Target is 1 when (inverse xor open), smoothed by one pole attack when rising, release when falling. Gain = floor + (1 - floor) * envelope applied to the main signal."
      chain_position: "any audio effect slot; sidechain port reads another output"
      automation_and_storage: "7 params plus sidechain reference; derived coefficients recomputed only when a parameter is dirty. Three values broadcast for the UI (input dB, output dB, envelope dB)."
      state: "detector peak, open flag, hold counter, envelope. Starts closed and silent after reset. No latency (no lookahead), so the first transient after silence is clipped by the attack time."
      edge_cases:
        - "A zero attack produces coefficient zero (instant)."
        - "Hold counter resets on every above threshold sample, so chatter near the threshold keeps it open (that is the hysteresis intent)."
        - "Floor at minus 72 dB still leaks; floor to minus infinity needs a special case if we want true silence."
        - "Gate state is derived from the sidechain; with sidechain connected and silent, the main signal stays gated."
      avoid: "Schema versus device mapping disagreement for floor; keep one mapping in our parameter table."
      licence: "Own work, textbook."
      tag: borrow
      we_call_it: noise_gate
      src: ["crates/stock-devices/device-gate/src/lib.rs:1-250", "packages/studio/forge-boxes/src/schema/devices/audio-effects/GateDeviceBox.ts"]
    - id: waveshaper
      theirs: Waveshaper
      kind: audio effect
      purpose: "Nonlinear distortion by a selectable transfer curve."
      params:
        - "equation = hard clip, a name from six (hard clip, soft cubic, tanh, sigmoid, arctan, asymmetric); a setting, unknown name falls back to tanh"
        - "input gain = 0 dB, 0..40 dB lin"
        - "output gain = 0 dB, -24..+24 dB lin"
        - "mix = 1.0, 0..1 lin"
      signal_flow: "per sample: input times smoothed input gain, curve, times smoothed output gain on the wet path, then crossfade with the untouched dry by the smoothed mix (dry = 1 - mix)."
      chain_position: "any audio effect slot"
      automation_and_storage: "3 params + 1 string setting. All three glide over 5 ms; the first delivery jumps."
      state: "three ramps only. No tail, no latency."
      edge_cases:
        - "No oversampling, so high drive aliases; the wave folder offers oversampling, waveshaper does not."
        - "Curves: hard clip clamps; soft cubic is 1.5x - 0.5x^3 on a clamped input; sigmoid is sign times one minus exp of minus abs; asymmetric is rational for positive input and a smoothed knee to a hard floor of -1 for negative input."
        - "Output of tanh or sigmoid at gain 1 is below full scale, so loud input stays under 1 but output gain can exceed it."
      avoid: "String equation names as a stored id (store an enum index plus name map)."
      licence: "Own work, public math."
      tag: borrow
      we_call_it: waveshaper
      src: ["crates/stock-devices/device-waveshaper/src/lib.rs:1-150", "crates/dsp/src/waveshaper.rs:20-60"]
    - id: auto_pan
      theirs: Tidal
      kind: audio effect
      purpose: "Tempo synced tremolo and auto pan with a shaped waveform."
      params:
        - "rate = index 3 of 17, idx into fractions from 1/1 down to 1/128 (includes triplets and dotted values)"
        - "depth = 1.0, 0..1 lin"
        - "slope = -0.25, -1..+1 lin bipolar (curve skew; sign mirrors the shape)"
        - "symmetry = 0.5, 0..1 lin (where in the cycle the peak sits)"
        - "offset = 0 degrees, -180..180 (phase of the left channel)"
        - "channel offset = 0 degrees, -180..180 (extra phase of the right channel; this is what pans)"
      signal_flow: "Phase = song position in ticks divided by the period of the chosen fraction, plus offsets over 360. A shaped envelope function maps phase to a gain between (1 - depth) and 1 using a power law whose exponent is 2^(10 * abs(slope)), with two segments split at the symmetry point. One pole smoothing of 3 ms on each channel gain, then multiply."
      chain_position: "any audio effect slot"
      automation_and_storage: "6 params; depth, slope and symmetry recompute the shape lazily next block. Phase is derived from the transport position, so it is locked to the grid and identical after a seek."
      state: "two smoothers; the exposed LFO phase is UI only. No tail, no latency."
      edge_cases:
        - "Depth 0 returns unity gain exactly."
        - "Symmetry is nudged off 0 and 1 to keep reciprocals finite."
        - "Phase advances only while the transport plays (UI phase), but the audio phase uses position, so it also runs while paused if the engine feeds a free running position."
        - "Tempo changes mid block use the block tempo for the whole block."
        - "Uses f64 and libm exp2/log2 for the power law because it is the hot spot."
      avoid: "Rate stored as a float index; store an integer enum."
      licence: "Own work."
      tag: borrow
      we_call_it: auto_pan
      src: ["crates/stock-devices/device-tidal/src/lib.rs:1-215", "crates/dsp/src/tidal.rs:1-60", "packages/studio/forge-boxes/src/schema/devices/audio-effects/TidalDeviceBox.ts"]
    - id: wave_folder
      theirs: Fold
      kind: audio effect
      purpose: "Wave folding distortion with anti aliasing by oversampling."
      params:
        - "drive = 0 dB, 0..30 dB lin"
        - "volume = 0 dB, -18..0 dB lin"
        - "oversampling = 2x (setting), choices 2x, 4x, 8x"
      signal_flow: "Upsample with a polyphase half band filter (31 tap), then per oversampled sample: scale by drive into 0.25 x + 0.25, triangle wrap by absolute value of the distance to the nearest integer, rescale by 4 times (wrapped minus 0.25), multiply by volume, then downsample with the half band."
      chain_position: "any audio effect slot"
      automation_and_storage: "2 params + 1 setting; both gains glide at the oversampled rate; a factor change rebuilds resampler and ramps."
      state: "resampler history, two ramps. Reports latency from the resampler (frames), so the device is latent."
      edge_cases:
        - "The fold function is odd symmetric and periodic, so it never exceeds the unit range."
        - "Their half band coefficients were truncated by a JS typed array bug that the Rust port replicated on purpose to match audio; the real filter is shorter than its table suggests."
        - "Changing oversampling changes latency, so alignment must be re run."
      avoid: "Replicating the truncated table; design our own half band (or reuse a clean FIR) and test passband flatness."
      licence: "Own work; half band coefficients are generic but do not copy the table."
      tag: rethink
      we_call_it: wave_folder
      src: ["crates/stock-devices/device-fold/src/lib.rs:1-130", "crates/dsp/src/resampler.rs:1-60"]
  effects_dynamics_eq:
    - id: limiter
      theirs: Maximizer
      kind: audio effect
      purpose: "Brick wall limiter with automatic makeup so the output sits just under 0 dBFS."
      params:
        - "threshold = 0 dB, -24..0 dB lin; smoothed over 10 ms"
        - "lookahead = true (setting)"
      signal_flow: "Per sample peak of both channels goes into a sliding window maximum (window = lookahead plus one frames, monotonic queue), then a fast attack release follower (instant up, 200 ms release), then reduction in dB = min(0, threshold - envelope dB), smoothed by three cascaded moving averages that together span the lookahead window. Gain = reduction gain times a fixed makeup of minus (threshold) minus 0.001 dB. With lookahead the input is delayed by 5 ms and hard clamped to +-1 after gain; without it gain applies directly. Toggling lookahead crossfades over 15 ms."
      chain_position: "last effect on master, or any channel"
      automation_and_storage: "1 param + 1 setting. Reduction and input peak meters broadcast."
      state: "5 ms delay ring, peak window, three moving averages, follower. Latency 240 frames at 48 kHz (5 ms) when lookahead is on, reported to the engine."
      edge_cases:
        - "Makeup is tied to threshold, so lowering the threshold raises output by the same amount: the limiter is also a loudness maximiser. The output ceiling is therefore fixed near 0 dB, not settable."
        - "The final hard clamp can still distort on extreme overshoot; no true peak (no oversampling)."
        - "Smoothing window sizes divide the lookahead by three: at high sample rates the ring is capped (960 frames, enough for 192 kHz)."
        - "While the threshold is moving, makeup is recomputed per sample (costly), static otherwise."
      avoid: "Coupling makeup to threshold without an explicit ceiling control; add a ceiling parameter."
      licence: "Own work (the listing says it is not a ported plugin)."
      tag: borrow
      we_call_it: limiter
      src: ["crates/stock-devices/device-maximizer/src/lib.rs:1-300", "packages/studio/forge-boxes/src/schema/devices/audio-effects/MaximizerDeviceBox.ts", "crates/dsp/src/simple_limiter.rs"]
    - id: compressor
      theirs: Compressor
      kind: audio effect with optional sidechain
      purpose: "Feed forward dynamics compressor, soft knee, crest factor based automatic attack and release, automatic makeup, optional 5 ms lookahead, parallel mix, external sidechain."
      params:
        - "input gain = 0 dB, -30..30 dB lin, glides 5 ms"
        - "threshold = -10 dB, -60..0 dB lin"
        - "ratio = 2, 1..24 exp; at 24 or above the device treats it as infinite (limiting)"
        - "knee = 0 dB, 0..24 dB lin"
        - "attack = 0 ms, 0..100 ms lin (the schema default differs from the device init of 2 ms; pushed values win)"
        - "release = 25 ms, 5..1500 ms lin"
        - "makeup = 0 dB, -40..40 dB lin"
        - "mix = 1.0, 0..1 lin"
        - "lookahead = false, automakeup = true, autoattack = false, autorelease = false, all bool parameters"
        - "side chain = optional input"
      signal_flow: "Gain staged input. Detection signal = max abs of the sidechain, or of the gained input. Level in dB through the static soft knee curve (zero below threshold minus half knee, quadratic inside the knee, linear slope 1/ratio - 1 above). A peak follower with separate attack and release coefficients smooths the reduction. Auto attack and release come from a block wise crest factor (peak over RMS) estimate that sets times inversely to crest. Auto makeup is the smoothed negative mean reduction. Lookahead path delays audio and runs the reduction through a ramp shaper so the dip arrives before the transient; the two paths are crossfaded over 15 ms when toggled. Output blends wet and dry by mix."
      chain_position: "any audio effect slot, sidechain from another output"
      automation_and_storage: "12 parameters, 1 sidechain pointer, three live meter values (input, reduction, output). Latency reported equals lookahead delay when on."
      state: "follower, crest factor states, makeup smoother, 5 ms stereo delay and reduction ring, ramps."
      edge_cases:
        - "Reduction is applied from a follower on the dB value; attack and release roles are on the level after the compression curve, so release is about how fast reduction recovers."
        - "dB conversions use a fast log2 and exp2 polynomial; the floor level for silence is minus 100 dB and the detector clamps the input level at 1e-6."
        - "Auto attack and release are block wise (per 128 frame quantum or sub block) estimates; sub block length changes affect results unless the block size is fixed in our engine."
        - "Mix is a parallel (dry plus wet) blend, not a power law."
      licence: "PORTED from a third party open source compressor (CTAG DRC). openDAW README lists it under Ported Plugins excluded from the commercial licence. The upstream licence was not verified here (believed GPL-3.0). Treat as encumbered: do not port or transcribe. Build our own from the textbook feed forward design (static curve, one pole attack and release follower on level in dB, optional lookahead)."
      avoid: "Porting the ported plugin; crest factor auto timing unless we design our own and listen; block size dependent estimates."
      tag: rethink
      we_call_it: compressor
      src: ["crates/stock-devices/device-compressor/src/lib.rs:1-330", "crates/dsp/src/ctagdrc.rs:1-300", "README.md:138-143"]
    - id: eq
      theirs: Revamp
      kind: audio effect
      purpose: "Seven band parametric EQ with live spectrum display."
      params:
        - "bands in fixed signal order: high pass, low shelf, low bell, mid bell, high bell, high shelf, low pass"
        - "each band: enabled (bool), frequency (exp 20..20000 Hz)"
        - "high pass and low pass add order (1..4 cascaded sections, a setting like parameter) and q (exp 0.01..10, default 0.7071)"
        - "shelves add gain (-24..24 dB, default 6)"
        - "bells add gain (-24..24 dB, default 6) and q (default 0.7071)"
        - "a deprecated global gain field (-18..18) remains in the schema"
      signal_flow: "Per channel, the enabled bands run in series (each filters the previous output), each a biquad with its own history; high and low pass are stacks of up to four sections. No enabled band copies input to output. Coefficients are recomputed when any parameter of that band changes (no smoothing in this device)."
      chain_position: "any audio effect slot"
      automation_and_storage: "up to 24 parameters. The spectrum (512 bins, plus 64 fine bins for the low end from a decimated path) is written only while the UI watches."
      state: "7 biquads per channel."
      edge_cases:
        - "No parameter smoothing: automated frequency sweeps step per update grid and can zipper; our control period and per sample coefficient interpolation is better."
        - "Biquad Q of 0 would give NaN, a small floor is used for the pass types."
        - "Order change resets the stack state (small click)."
        - "Biquad cascade at high orders with identical Q compounds resonance; their modulated filter lowers Q by order^1.25 to counter."
        - "Spectrum analyser: sum left and right, 1024 point Blackman window, radix 2 FFT, 512 magnitude bins with a max or decay envelope; decay is armed by the reader after each read."
      avoid: "No smoothing; consumer armed decay coupling the DSP to UI cadence (the analyser must be a pure function of the audio and a fixed decay per frame)."
      licence: "Own work, RBJ cookbook biquad formulas are public."
      tag: borrow
      we_call_it: eq
      src: ["crates/stock-devices/device-revamp/src/lib.rs:1-300", "crates/dsp/src/biquad.rs:35-215", "crates/dsp/src/analyser.rs:1-60", "crates/dsp/src/low_band_analyser.rs:1-40", "packages/studio/forge-boxes/src/schema/devices/audio-effects/RevampDeviceBox.ts"]
  effects_space_and_heavy:
    - id: room_reverb
      theirs: Reverb (Free Reverb)
      kind: audio effect
      purpose: "Classic Freeverb style reverb with pre delay."
      params:
        - "decay (room size) = 0.5, 0..1 lin"
        - "pre delay = 1 ms, 1..500 ms exp, shown in seconds"
