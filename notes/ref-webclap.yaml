# Verified reference map of WebCLAP (WASM CLAP plugins in the browser). Paths in src: are relative to
# <reference checkout>/webclap-browser-test-host (called "host") or <reference checkout>/webclap-spec (called "spec").
# Facts only from reading code or docs. Behavior is described, not copied. Reimplement from understanding.

