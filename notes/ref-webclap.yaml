  repos:
    host:
      url: https://github.com/WebCLAP/browser-test-host
      clone_commit: b42ade615bef2c989f96400a7b0b2ef15cabd396
      license:
        value: NOT STATED in the clone
        src: [host (no LICENSE file at the root, README.md has no licence section)]
        note: "Treat as all rights reserved until an owner statement is found. Read for ideas only. Its sources carry the Signalsmith Audio name (clap-audionode/host-dev/source/hosted-wclap.h:199-201)."
      size: "Small: about 1800 lines of JS and C++ plus a prebuilt 3 MB host.wasm. Three git submodules are NOT in the shallow clone: wclap-js, cbor-walker, examples."
